<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">

<title>Faturas pela TCAP</title>

<style>
:root{
  --bg:#050505;
  --card:#121214;
  --card2:#1a1a1d;
  --line:rgba(255,255,255,.10);
  --text:#f7f7f7;
  --muted:#929398;
  --red:#EB0A1E;
  --red2:#ff3346;
  --green:#35d58a;
  --yellow:#f5c542;
  --safe:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;
}

body{
  min-height:100dvh;
}

button,
input,
select,
textarea{
  font:inherit;
  color:inherit;
}

button{
  border:0;
  background:none;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100dvh;
  padding-bottom:calc(90px + var(--safe));
}

.main{
  padding:18px 18px 30px;
  max-width:850px;
  margin:auto;
}

.kicker{
  color:var(--muted);
  font-size:14px;
  font-weight:700;
  margin:8px 0 4px;
}

.page-title{
  margin:0 0 18px;
  font-size:40px;
  line-height:1;
  letter-spacing:-.05em;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.brand-mark{
  width:38px;
  height:38px;
  border:2px solid #fff;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
  flex:none;
}

.brand-mark:before,
.brand-mark:after{
  content:"";
  position:absolute;
  border:1.5px solid #fff;
  border-radius:50%;
}

.brand-mark:before{
  width:21px;
  height:10px;
}

.brand-mark:after{
  width:10px;
  height:21px;
}

.brand-name{
  font-weight:900;
  letter-spacing:.04em;
}

.brand-sub{
  color:var(--red2);
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.workspace{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid rgba(235,10,30,.35);
  color:#ffd4d8;
  background:rgba(235,10,30,.07);
  font-size:12px;
  font-weight:800;
  margin-bottom:18px;
}

.workspace i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 10px rgba(235,10,30,.8);
}

.cta{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  text-align:left;
  padding:18px;
  border-radius:22px;
  margin-bottom:12px;
}

.cta.hot{
  background:linear-gradient(180deg,#ff394d,var(--red));
  color:#fff;
  box-shadow:0 14px 36px rgba(235,10,30,.30);
}

.cta.cold{
  background:var(--card);
  border:1px solid var(--line);
}

.cta .orb{
  width:48px;
  height:48px;
  border-radius:50%;
  flex:none;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.12);
}

.cta.cold .orb{
  background:#09090a;
}

.cta b{
  display:block;
  font-size:18px;
}

.cta span{
  display:block;
  margin-top:4px;
  color:rgba(255,255,255,.78);
  font-size:13px;
  line-height:1.35;
}

.cta.cold span{
  color:var(--muted);
}

.fab{
  position:fixed;
  right:18px;
  bottom:calc(86px + var(--safe));
  z-index:20;
  width:62px;
  height:62px;
  border-radius:50%;
  background:linear-gradient(180deg,#ff394d,var(--red));
  color:#fff;
  display:grid;
  place-items:center;
  box-shadow:0 12px 30px rgba(235,10,30,.42);
}

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:19;
  display:flex;
  padding:6px 8px calc(8px + var(--safe));
  background:rgba(7,7,8,.94);
  border-top:1px solid var(--line);
  backdrop-filter:blur(20px);
}

.nav button{
  flex:1;
  min-height:54px;
  color:#737479;
  font-size:11px;
  font-weight:800;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.nav button[aria-current="page"]{
  color:#fff;
}

.nav svg{
  width:20px;
  height:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  margin-bottom:12px;
}

.status{
  margin:0 0 12px;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.warn{
  background:rgba(245,197,66,.08);
  border:1px solid rgba(245,197,66,.22);
  color:#f8d97a;
  border-radius:14px;
  padding:11px 12px;
  font-size:13px;
  line-height:1.4;
}

.success{
  background:rgba(53,213,138,.08);
  border:1px solid rgba(53,213,138,.22);
  color:#a9f3cf;
  border-radius:14px;
  padding:11px 12px;
  font-size:13px;
}

.scan-wrap{
  position:relative;
  background:#070707;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:12px;
  display:flex;
  justify-content:center;
}

.scan-wrap canvas,
.scan-wrap img{
  display:block;
  width:100%;
  max-height:60vh;
  object-fit:contain;
  background:#111;
}

.scan-badge{
  position:absolute;
  top:12px;
  left:12px;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(10px);
  font-size:11px;
  font-weight:900;
  letter-spacing:.04em;
}

.mini{
  display:flex;
  gap:8px;
  margin:10px 0 16px;
  overflow:auto;
}

.mini button{
  flex:none;
  padding:9px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#151518;
  color:#ccc;
  font-size:12px;
  font-weight:800;
}

.mini button.active{
  border-color:rgba(235,10,30,.65);
  color:#fff;
  background:rgba(235,10,30,.10);
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

label{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:12px;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

input,
select,
textarea{
  width:100%;
  background:#0b0b0d;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 14px;
  min-height:48px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:rgba(235,10,30,.6);
  box-shadow:0 0 0 3px rgba(235,10,30,.12);
}

textarea{
  min-height:120px;
  resize:vertical;
  font-family:ui-monospace,Menlo,monospace;
  font-size:12px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:52px;
  border-radius:999px;
  font-weight:900;
}

.btn.primary{
  background:linear-gradient(180deg,#ff394d,var(--red));
  color:#fff;
  box-shadow:0 10px 24px rgba(235,10,30,.26);
}

.btn.ghost,
.btn.soft{
  background:var(--card2);
  border:1px solid var(--line);
}

.btn.danger{
  background:#281014;
  color:#ffb5bd;
  border:1px solid rgba(235,10,30,.3);
}

.btn.tiny{
  min-height:40px;
  font-size:12px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:8px 0 14px;
}

.chip{
  padding:7px 10px;
  border-radius:999px;
  background:#1b1b1e;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:800;
}

.chip.ok{
  color:#a8f3cf;
  background:rgba(53,213,138,.08);
  border-color:rgba(53,213,138,.25);
}

.chip.warn{
  color:#f8d97a;
  background:rgba(245,197,66,.08);
  border-color:rgba(245,197,66,.25);
}

.month{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
}

.month h2{
  margin:0;
  font-size:22px;
  letter-spacing:-.03em;
}

.sum{
  margin:0;
  color:var(--red2);
  font-size:22px;
  font-weight:900;
}

.sub{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  color:var(--muted);
  font-size:14px;
}

.sub strong{
  color:#fff;
}

.item{
  display:grid;
  grid-template-columns:82px 1fr;
  gap:12px;
  padding:14px 0;
  border-top:1px solid var(--line);
}

.item img{
  width:82px;
  height:96px;
  object-fit:cover;
  border-radius:12px;
  background:#000;
}

.item h3{
  margin:0 0 5px;
  font-size:16px;
}

.item p{
  margin:3px 0;
  color:var(--muted);
  font-size:12px;
}

.search{
  width:100%;
  margin-bottom:12px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#1a1a1d;
  display:grid;
  place-items:center;
}

.review-top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.cam{
  position:fixed;
  inset:0;
  background:#000;
  z-index:100;
  display:flex;
  flex-direction:column;
}

.cam video{
  flex:1;
  width:100%;
  object-fit:cover;
}

.cam-guide{
  position:absolute;
  left:9%;
  right:9%;
  top:15%;
  bottom:18%;
  border:2px solid rgba(255,255,255,.85);
  border-radius:14px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.18);
  pointer-events:none;
}

.cam-guide:after{
  content:"Alinha a fatura dentro da moldura";
  position:absolute;
  top:-34px;
  left:0;
  right:0;
  text-align:center;
  color:#fff;
  font-size:12px;
  font-weight:800;
  text-shadow:0 1px 3px #000;
}

.cam-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 18px calc(18px + var(--safe));
  background:#000;
}

.shutter{
  width:72px;
  height:72px;
  border-radius:50%;
  background:#fff;
  border:6px solid #333;
}

.link{
  color:#fff;
  font-weight:800;
  min-width:72px;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:90;
  background:#050505;
  display:flex;
  flex-direction:column;
  padding:18px 18px calc(24px + var(--safe));
}

.ov-card{
  margin:auto 0;
  background:#121214;
  border:1px solid var(--line);
  border-radius:28px;
  padding:16px;
}

.ov-preview{
  position:relative;
  height:250px;
  border-radius:20px;
  overflow:hidden;
  background:#000;
  display:grid;
  place-items:center;
}

.ov-preview canvas{
  max-width:90%;
  max-height:95%;
  object-fit:contain;
}

.scanline{
  position:absolute;
  left:0;
  right:0;
  height:3px;
  background:var(--red);
  box-shadow:0 0 18px var(--red);
  animation:sweep 1.5s ease-in-out infinite;
}

@keyframes sweep{
  0%{top:10%}
  50%{top:88%}
  100%{top:10%}
}

.ov-card h2{
  margin:18px 0 6px;
  text-align:center;
  font-size:28px;
}

.ov-card p{
  text-align:center;
  color:var(--muted);
}

.step-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
  border-radius:16px;
  border:1px solid var(--line);
  background:#0b0b0d;
  margin-bottom:8px;
  color:#aaa;
  font-size:14px;
  font-weight:800;
}

.step-row.on{
  color:#fff;
  border-color:rgba(235,10,30,.55);
}

.step-row.done{
  color:#b9b9bd;
}

.tick{
  margin-left:auto;
  color:var(--red);
}

.editor-tools{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:12px;
}

.editor-tools button{
  min-height:44px;
  border-radius:12px;
  background:#19191c;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:800;
}

.loading{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.72);
  display:grid;
  place-items:center;
  backdrop-filter:blur(8px);
}

.loading-box{
  width:min(320px,calc(100% - 40px));
  background:#161619;
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  text-align:center;
}

.spinner{
  width:34px;
  height:34px;
  border-radius:50%;
  border:3px solid #333;
  border-top-color:var(--red);
  margin:0 auto 14px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =========================================================
   ÁREA DE IMPRESSÃO
   ========================================================= */

.print-sheet{
  display:none;
}

/*
  O PDF é criado em A4 e organiza 4 documentos por folha.
  A imagem de cada fatura é mantida em proporção.
*/
@media print{
  body{
    background:#fff!important;
    color:#000!important;
  }

  body>*{
    display:none!important;
  }

  #printRoot{
    display:block!important;
  }

  .print-page{
    width:210mm;
    height:297mm;
    padding:7mm;
    page-break-after:always;
    background:#fff;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:5mm;
  }

  .print-doc{
    border:1px solid #bbb;
    padding:4mm;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .print-doc-head{
    display:flex;
    justify-content:space-between;
    font-size:8pt;
    margin-bottom:2mm;
  }

  .print-doc img{
    width:100%;
    height:calc(100% - 12mm);
    object-fit:contain;
  }
}
</style>
</head>

<body>

<div id="app" class="app"></div>

<div id="printRoot" class="print-sheet"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

<script>
/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const CATS=[
  "Combustível",
  "Alimentação",
  "Restauração",
  "Estadias",
  "Outros"
];

const ico={
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="3" y="3" width="7" height="7" rx="1.5"/>
    <rect x="14" y="3" width="7" height="7" rx="1.5"/>
    <rect x="3" y="14" width="7" height="7" rx="1.5"/>
    <rect x="14" y="14" width="7" height="7" rx="1.5"/>
  </svg>`,

  docs:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
    <path d="M14 3v6h6"/>
  </svg>`,

  chart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>
  </svg>`,

  down:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>
  </svg>`,

  cam:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M4 8h3l2-3h6l2 3h3v11H4V8z"/>
    <circle cx="12" cy="13" r="3.2"/>
  </svg>`,

  up:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>
  </svg>`,

  form:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="5" y="3" width="14" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </svg>`
};

function $(tag,attrs={},html){
  const n=document.createElement(tag);

  for(const k in attrs){
    n.setAttribute(k,attrs[k]);
  }

  if(html!==undefined){
    n.innerHTML=html;
  }

  return n;
}

function fold(s=""){
  return String(s)
    .replace(/[\u2010-\u2015\u2212]/g,"-")
    .replace(/[\u00a0\u202f]/g," ")
    .normalize("NFD")
    .replace(/\p{M}/gu,"")
    .toLowerCase();
}

function pad(n){
  return String(n).padStart(2,"0");
}

function validDate(y,m,d){
  if(y<1990||y>2099||m<1||m>12||d<1||d>31)return false;

  const t=new Date(Date.UTC(y,m-1,d));

  return t.getUTCFullYear()===y &&
         t.getUTCMonth()===m-1 &&
         t.getUTCDate()===d;
}

function expandY(y){
  return y>=100?y:y>=70?1900+y:2000+y;
}

/* =========================================================
   DATAS
   ========================================================= */

function parseDate(text){

  const s=fold(text);
  const found=[];

  const push=(y,m,d,score)=>{
    y=expandY(y);

    if(!validDate(y,m,d))return;

    found.push({
      iso:`${y}-${pad(m)}-${pad(d)}`,
      display:`${pad(d)}/${pad(m)}/${y}`,
      score
    });
  };

  for(const m of s.matchAll(
    /(\d{4})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{1,2})/g
  )){
    const around=s.slice(
      Math.max(0,m.index-35),
      m.index+35
    );

    push(
      +m[1],
      +m[2],
      +m[3],
      /emiss|data|fatura|documento/.test(around)?120:20
    );
  }

  for(const m of s.matchAll(
    /(\d{1,2})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{2,4})/g
  )){
    const around=s.slice(
      Math.max(0,m.index-35),
      m.index+35
    );

    push(
      +m[3],
      +m[2],
      +m[1],
      /emiss|data|fatura|documento/.test(around)?120:20
    );
  }

  found.sort((a,b)=>b.score-a.score);

  return found[0]||null;
}

/* =========================================================
   DINHEIRO
   ========================================================= */

function euro(s){

  if(!s)return null;

  let x=String(s)
    .replace(/[€$]/g,"")
    .replace(/\s/g,"")
    .trim();

  if(x.includes(",") && x.includes(".")){
    x=x.replace(/\./g,"").replace(",",".");
  }else if(x.includes(",")){
    x=x.replace(",",".");
  }

  const n=Number(x);

  return Number.isFinite(n)?n:null;
}

function userMoney(s){

  if(!s || !s.trim())return null;

  return euro(s);
}

function euros(v){

  if(v==null || !Number.isFinite(v))return "—";

  return v.toLocaleString("pt-PT",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  })+" €";
}

/* =========================================================
   TOTAL
   ========================================================= */

function parseTotal(text){

  const lines=text.split(/\r?\n/);
  const found=[];

  const normal=l=>
    fold(l)
      .replace(/t[o0]ta[l1]/g,"total")
      .replace(/(\d)\s*[,.]\s*(\d{2})\b/g,"$1,$2");

  const money=`
    (\\d{1,3}(?:\\.\\d{3})*,\\d{2})
    |
    (\\d+[,\\.]\\d{2})
  `.replace(/\s/g,"");

  const re=new RegExp(
    "\\b(total\\s+a\\s+pagar|valor\\s+a\\s+pagar|"+
    "total\\s+pago|valor\\s+pago|importe|a\\s+pagar|total)"+
    "[^0-9]{0,45}"+money,
    "gi"
  );

  for(let i=0;i<lines.length;i++){

    const blob=normal(
      lines[i]+" "+(lines[i+1]||"")
    );

    if(/subtotal|total\\s+(de\\s+)?iva|total\\s+imposto/.test(blob)){
      continue;
    }

    for(const m of blob.matchAll(re)){

      const raw=m[m.length-1];
      const value=euro(raw);

      if(value!=null){
        found.push({
          euros:value,
          score:/pagar|pago/.test(m[1])?120:60,
          index:i
        });
      }
    }
  }

  /*
    Fallback:
    procura valores no fim das linhas.
  */

  if(!found.length){

    for(let i=0;i<lines.length;i++){

      const line=normal(lines[i]);

      const matches=[
        ...line.matchAll(
          /(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/g
        )
      ];

      for(const m of matches){

        const value=euro(m[1]);

        if(
          value!=null &&
          value>0 &&
          value<100000
        ){
          found.push({
            euros:value,
            score:5+i*.01,
            index:i
          });
        }
      }
    }
  }

  found.sort((a,b)=>b.score-a.score||b.index-a.index);

  return found[0]||null;
}

/* =========================================================
   IVA
   ========================================================= */

function parseVat(text){

  const lines=text.split(/\r?\n/);

  for(let i=0;i<lines.length;i++){

    const s=fold(lines[i]);

    if(!/\biva\b/.test(s))continue;

    const all=s+" "+fold(lines[i+1]||"");

    const m=all.match(
      /(?:iva)[^0-9]{0,25}(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/
    );

    if(m){

      const v=euro(m[1]);

      if(v!=null && v>0)return v;
    }
  }

  return null;
}

/* =========================================================
   NIF
   ========================================================= */

function nifOk(n){

  if(!/^\d{9}$/.test(n))return false;

  let sum=0;

  for(let i=0;i<8;i++){
    sum+=Number(n[i])*(9-i);
  }

  const mod=sum%11;
  const check=mod<2?0:11-mod;

  return check===Number(n[8]);
}

function parseNif(text){

  for(const line of text.split(/\n/)){

    const f=fold(line);

    if(
      !/\b(nif|nipc|contribuinte)\b/.test(f) ||
      /\b(adquirente|cliente|consumidor|hospede)\b/.test(f)
    ){
      continue;
    }

    for(const m of line.matchAll(/\d[\d\s.]{7,14}\d/g)){

      const d=m[0].replace(/\D/g,"");

      if(d.length===9 && nifOk(d)){
        return d;
      }
    }
  }

  /*
    Fallback:
    procurar qualquer NIF válido.
  */

  const digits=text.replace(/\D/g,"");

  for(let i=0;i<=digits.length-9;i++){

    const n=digits.slice(i,i+9);

    if(nifOk(n))return n;
  }

  return null;
}

/* =========================================================
   FORNECEDOR
   ========================================================= */

function parseSupplier(text){

  const known=[
    ["toyota","Toyota"],
    ["galp","Galp"],
    ["repsol","Repsol"],
    ["cepsa","Cepsa"],
    ["prio","Prio"],
    ["bp","BP"],
    ["continente","Continente"],
    ["pingo doce","Pingo Doce"],
    ["lidl","Lidl"],
    ["auchan","Auchan"],
    ["mercadona","Mercadona"],
    ["ibis","Ibis"],
    ["pestana","Pestana"],
    ["campanile","Campanile"],
    ["mcdonald","McDonald's"]
  ];

  const s=fold(text);

  for(const [key,name] of known){

    if(s.includes(key)){
      return name;
    }
  }

  const lines=text
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);

  for(const line of lines.slice(0,14)){

    const f=fold(line);

    if(
      f.length<4 ||
      f.length>55 ||
      /\b(nif|nipc|iva|total|data|fatura|documento|telefone|tel|www|http)\b/.test(f)
    ){
      continue;
    }

    const letters=(f.match(/[a-z]/g)||[]).length;

    if(letters>=5){
      return line.slice(0,60);
    }
  }

  return null;
}

/* =========================================================
   DOCUMENTO
   ========================================================= */

function parseDoc(text){

  const patterns=[
    /\b(?:FT|FS|FR|NC|FAT)\s*(?:Nr\.?|N[ºo.]?)?\s*[:.]?\s*[A-Z0-9][A-Z0-9./-]{2,}/i,
    /\b(?:fatura|documento)\s*(?:n[ºo.]?|nr\.?)?\s*[:.]?\s*[A-Z0-9./-]{3,}/i
  ];

  for(const p of patterns){

    const m=text.match(p);

    if(m){
      return m[0]
        .replace(/\s+/g," ")
        .slice(0,40);
    }
  }

  return null;
}

/* =========================================================
   CATEGORIA
   ========================================================= */

function categorize(text){

  const s=fold(text);

  if(
    /\b(galp|repsol|cepsa|prio|bp|gasolina|gasoleo|combustivel|diesel|posto)\b/.test(s)
  ){
    return "Combustível";
  }

  if(
    /\b(hotel|hostel|airbnb|pousada|ibis|pestana|campanile|alojamento)\b/.test(s)
  ){
    return "Estadias";
  }

  if(
    /\b(restaurante|pastelaria|cafe|café|mcdonald|burger|pizza|padaria|refeicao)\b/.test(s)
  ){
    return "Restauração";
  }

  if(
    /\b(continente|pingo doce|lidl|auchan|mercadona|supermercado)\b/.test(s)
  ){
    return "Alimentação";
  }

  return "Outros";
}

/* =========================================================
   BASE DE DADOS
   ========================================================= */

function openDb(){

  return new Promise((resolve,reject)=>{

    const req=indexedDB.open("faturas-tcap",3);

    req.onupgradeneeded=()=>{
      const db=req.result;

      if(!db.objectStoreNames.contains("faturas")){
        db.createObjectStore("faturas",{keyPath:"id"});
      }
    };

    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

async function saveF(f){

  const db=await openDb();

  const tx=db.transaction("faturas","readwrite");

  tx.objectStore("faturas").put(f);

  await new Promise((resolve,reject)=>{
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });

  db.close();
}

async function listF(){

  const db=await openDb();

  const tx=db.transaction("faturas","readonly");
  const req=tx.objectStore("faturas").getAll();

  const rows=await new Promise((resolve,reject)=>{
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });

  db.close();

  return rows.sort((a,b)=>b.createdAt-a.createdAt);
}

async function delF(id){

  const db=await openDb();

  const tx=db.transaction("faturas","readwrite");

  tx.objectStore("faturas").delete(id);

  await new Promise((resolve,reject)=>{
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });

  db.close();
}

/* =========================================================
   IMAGEM
   ========================================================= */

function limitCanvas(src,max=2200){

  const largest=Math.max(src.width,src.height);

  if(largest<=max)return src;

  const scale=max/largest;

  const c=document.createElement("canvas");

  c.width=Math.round(src.width*scale);
  c.height=Math.round(src.height*scale);

  const ctx=c.getContext("2d");

  ctx.drawImage(
    src,
    0,
    0,
    c.width,
    c.height
  );

  return c;
}

function fromFile(file){

  return new Promise((resolve,reject)=>{

    const url=URL.createObjectURL(file);

    const img=new Image();

    img.onload=()=>{

      const c=document.createElement("canvas");

      c.width=img.naturalWidth;
      c.height=img.naturalHeight;

      const ctx=c.getContext("2d");

      ctx.drawImage(img,0,0);

      URL.revokeObjectURL(url);

      resolve(limitCanvas(c));
    };

    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("Não consegui abrir a imagem."));
    };

    img.src=url;
  });
}

/* =========================================================
   DETECÇÃO DO DOCUMENTO
   =========================================================

   Esta versão não usa apenas "a mancha de tinta".
   Analisa o fundo nas margens e procura a área que
   realmente se destaca da fotografia.

   Depois adiciona uma pequena margem branca.
   ========================================================= */

function detectDocumentRect(canvas){

  const maxSize=1200;

  const scale=Math.min(
    1,
    maxSize/Math.max(canvas.width,canvas.height)
  );

  const w=Math.max(1,Math.round(canvas.width*scale));
  const h=Math.max(1,Math.round(canvas.height*scale));

  const sample=document.createElement("canvas");

  sample.width=w;
  sample.height=h;

  const ctx=sample.getContext("2d",{willReadFrequently:true});

  ctx.drawImage(canvas,0,0,w,h);

  const data=ctx.getImageData(0,0,w,h).data;

  /*
    Estimar cor do fundo usando os cantos.
  */

  const cornerPoints=[];

  const cornerSize=Math.max(8,Math.round(Math.min(w,h)*.035));

  for(let y=0;y<cornerSize;y++){

    for(let x=0;x<cornerSize;x++){

      const points=[
        [x,y],
        [w-1-x,y],
        [x,h-1-y],
        [w-1-x,h-1-y]
      ];

      for(const [px,py] of points){

        const i=(py*w+px)*4;

        cornerPoints.push([
          data[i],
          data[i+1],
          data[i+2]
        ]);
      }
    }
  }

  const avg=cornerPoints.reduce(
    (a,p)=>[
      a[0]+p[0],
      a[1]+p[1],
      a[2]+p[2]
    ],
    [0,0,0]
  ).map(v=>v/cornerPoints.length);

  const threshold=32;

  let minX=w;
  let minY=h;
  let maxX=-1;
  let maxY=-1;

  /*
    Ignorar uma margem exterior.
    Isto evita que a própria fotografia inteira
    seja confundida com o documento.
  */

  const marginX=Math.round(w*.035);
  const marginY=Math.round(h*.035);

  for(let y=marginY;y<h-marginY;y++){

    for(let x=marginX;x<w-marginX;x++){

      const i=(y*w+x)*4;

      const r=data[i];
      const g=data[i+1];
      const b=data[i+2];

      const distance=
        Math.abs(r-avg[0])+
        Math.abs(g-avg[1])+
        Math.abs(b-avg[2]);

      const brightness=(r+g+b)/3;

      /*
        Diferença significativa do fundo.
      */

      if(
        distance>threshold ||
        brightness<55 ||
        brightness>245
      ){

        if(x<minX)minX=x;
        if(y<minY)minY=y;
        if(x>maxX)maxX=x;
        if(y>maxY)maxY=y;
      }
    }
  }

  if(maxX<0 || maxY<0){
    return null;
  }

  const foundW=maxX-minX+1;
  const foundH=maxY-minY+1;

  /*
    Se o "documento" for praticamente a fotografia toda,
    fazemos um segundo teste usando margens.
  */

  if(
    foundW>w*.93 &&
    foundH>h*.93
  ){
    return null;
  }

  /*
    Expandir ligeiramente.
    Isto é importante para não cortar letras/bordas.
  */

  const padX=Math.round(foundW*.035);
  const padY=Math.round(foundH*.035);

  minX=Math.max(0,minX-padX);
  minY=Math.max(0,minY-padY);
  maxX=Math.min(w-1,maxX+padX);
  maxY=Math.min(h-1,maxY+padY);

  return {
    x:minX/scale,
    y:minY/scale,
    w:(maxX-minX+1)/scale,
    h:(maxY-minY+1)/scale
  };
}

/* =========================================================
   RECORTE + EFEITO SCANNER
   ========================================================= */

function renderScannedDocument(source,rect){

  const maxWidth=1700;

  const scale=Math.min(
    1,
    maxWidth/rect.w
  );

  const out=document.createElement("canvas");

  out.width=Math.max(
    1,
    Math.round(rect.w*scale)
  );

  out.height=Math.max(
    1,
    Math.round(rect.h*scale)
  );

  const ctx=out.getContext("2d");

  /*
    Fundo branco de scanner.
  */

  ctx.fillStyle="#fff";
  ctx.fillRect(
    0,
    0,
    out.width,
    out.height
  );

  /*
    Desenhar documento.
  */

  ctx.drawImage(
    source,
    rect.x,
    rect.y,
    rect.w,
    rect.h,
    0,
    0,
    out.width,
    out.height
  );

  /*
    Melhoramento de contraste.
  */

  const image=ctx.getImageData(
    0,
    0,
    out.width,
    out.height
  );

  const p=image.data;

  for(let i=0;i<p.length;i+=4){

    let r=p[i];
    let g=p[i+1];
    let b=p[i+2];

    /*
      Converter ligeiramente para aspecto de scanner,
      mas preservar cor para documentos.
    */

    const avg=(r+g+b)/3;

    if(avg>235){

      r=Math.min(255,r+8);
      g=Math.min(255,g+8);
      b=Math.min(255,b+8);
    }

    /*
      Contraste suave.
    */

    const factor=1.12;

    r=((r-128)*factor)+128;
    g=((g-128)*factor)+128;
    b=((b-128)*factor)+128;

    p[i]=Math.max(0,Math.min(255,r));
    p[i+1]=Math.max(0,Math.min(255,g));
    p[i+2]=Math.max(0,Math.min(255,b));
  }

  ctx.putImageData(image,0,0);

  return out;
}

function toBlob(canvas){

  return new Promise((resolve,reject)=>{

    canvas.toBlob(
      blob=>{
        if(blob)resolve(blob);
        else reject(new Error("Não consegui criar a imagem."));
      },
      "image/jpeg",
      .90
    );
  });
}

async function openCam(){

  if(!navigator.mediaDevices?.getUserMedia){
    fileCam.click();
    return;
  }

  let stream;

  try{

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1920},
        height:{ideal:2560}
      }
    });

  }catch{

    fileCam.click();
    return;
  }

  nav.classList.add("hidden");
  fab.classList.add("hidden");

  const wrap=$("div",{class:"cam"});

  const video=$("video",{
    playsinline:"true",
    autoplay:"true",
    muted:"true"
  });

  video.playsInline=true;
  video.autoplay=true;
  video.muted=true;
  video.srcObject=stream;

  const guide=$("div",{class:"cam-guide"});

  const bar=$("div",{class:"cam-bar"});

  const cancel=$(
    "button",
    {class:"link",type:"button"},
    "Fechar"
  );

  const shutter=$(
    "button",
    {
      class:"shutter",
      type:"button",
      "aria-label":"Fotografar"
    }
  );

  const gallery=$(
    "button",
    {class:"link",type:"button"},
    "Galeria"
  );

  bar.append(
    cancel,
    shutter,
    gallery
  );

  wrap.append(
    video,
    guide,
    bar
  );

  root.append(wrap);

  await video.play().catch(()=>{});

  const close=()=>{

    stream.getTracks().forEach(
      t=>t.stop()
    );

    wrap.remove();

    nav.classList.remove("hidden");
  };

  cancel.onclick=close;

  gallery.onclick=()=>{
    close();
    fileLib.click();
  };

  shutter.onclick=()=>{

    const w=video.videoWidth;
    const h=video.videoHeight;

    if(!w||!h)return;

    const c=document.createElement("canvas");

    c.width=w;
    c.height=h;

    const ctx=c.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      w,
      h
    );

    close();

    beginReview(
      limitCanvas(c)
    );
  };
}

function setStep(node,step){

  node.querySelectorAll(".step-row")
    .forEach((el,i)=>{

      el.classList.toggle(
        "on",
        i===step
      );

      el.classList.toggle(
        "done",
        i<step
      );

      const tick=el.querySelector(".tick");

      if(tick){
        tick.textContent=i<step?"✓":"";
      }
    });
}

async function beginReview(full){

  source=full;
  rect=null;
  scan=null;

  nav.classList.add("hidden");
  fab.classList.add("hidden");

  const overlay=$(
    "div",
    {class:"overlay"}
  );

  const card=$(
    "div",
    {class:"ov-card"}
  );

  const preview=$(
    "div",
    {class:"ov-preview"}
  );

  const mini=document.createElement("canvas");

  const scale=Math.min(
    1,
    520/Math.max(
      full.width,
      full.height
    )
  );

  mini.width=Math.round(
    full.width*scale
  );

  mini.height=Math.round(
    full.height*scale
  );

  mini.getContext("2d").drawImage(
    full,
    0,
    0,
    mini.width,
    mini.height
  );

  preview.append(
    mini,
    $("div",{class:"scanline"})
  );

  card.append(
    preview,

    $("h2",{},"A digitalizar"),

    $("p",{},"A procurar a folha e a preparar a imagem."),

    $("div",{class:"step-row on"},
      `A detectar a fatura <span class="tick"></span>`
    ),

    $("div",{class:"step-row"},
      `A recortar a fotografia <span class="tick"></span>`
    ),

    $("div",{class:"step-row"},
      `A melhorar a digitalização <span class="tick"></span>`
    ),

    $("div",{class:"step-row"},
      `A ler os dados <span class="tick"></span>`
    )
  );

  overlay.append(card);

  root.append(overlay);

  await new Promise(
    r=>setTimeout(r,300)
  );

  /*
    DETECÇÃO
  */

  rect=detectDocumentRect(full);

  if(!rect){

    rect={
      x:0,
      y:0,
      w:full.width,
      h:full.height
    };
  }

  setStep(card,1);

  await new Promise(
    r=>setTimeout(r,300)
  );

  /*
    RECORTE
  */

  scan=renderScannedDocument(
    full,
    rect
  );

  setStep(card,2);

  await new Promise(
    r=>setTimeout(r,350)
  );

  setStep(card,3);

  await new Promise(
    r=>setTimeout(r,250)
  );

  overlay.remove();

  nav.classList.remove("hidden");

  paintReview(
    !rect ||
    (
      rect.x===0 &&
      rect.y===0 &&
      rect.w===full.width &&
      rect.h===full.height
    ),
    false
  );

  runOcr();
}

    const draw=()=>{

      const img=scan;

      view.width=img.width;
      view.height=img.height;

      ctx.drawImage(
        img,
        0,

    draw();

    wrap.append(

      $("div",{class:"scan-badge"},"DIGITALIZAÇÃO")

    fig.append(wrap);

    const tools=$(
      "div",
      {class:"editor-tools"}
    );

    const less=$(
      "button",
      {type:"button"},
      "↙ Apertar"
    );

    const more=$(
      "button",
      {type:"button"},
      "↗ Alargar"
    );

    const whole=$(
      "button",
      {type:"button"},
      "□ Foto inteira"
    );

    const rescan=$(
      "button",
      {type:"button"},
      "⟳ Reprocessar"
    );

    tools.append(
      less,
      more,
      whole,
      rescan
    );

    fig.append(tools);

    if(failed){

      fig.append(
        $("p",{class:"warn"},
          "Não consegui identificar com segurança os limites da folha. O documento foi preparado, mas confirma o recorte antes de guardar."
        )
      );
    }else{

      fig.append(
        $("p",{class:"success"},
          "Documento recortado automaticamente. A imagem que vês aqui é a mesma que será guardada e enviada para o PDF."
        )
      );
    }

    main.append(fig);

    less.onclick=()=>{

      if(!source||!rect)return;

      const dx=rect.w*.045;
      const dy=rect.h*.045;

      rect={
        x:Math.min(
          source.width-1,
          rect.x+dx
        ),
        y:Math.min(
          source.height-1,
          rect.y+dy
        ),
        w:Math.max(
          1,
          rect.w-dx*2
        ),
        h:Math.max(
          1,
          rect.h-dy*2
        )
      };

      scan=renderScannedDocument(
        source,
        rect
      );

      draw();

      if(!reading)runOcr();
    };

    more.onclick=()=>{

      if(!source||!rect)return;

      const dx=rect.w*.055;
      const dy=rect.h*.055;

      const x=Math.max(
        0,
        rect.x-dx
      );

      const y=Math.max(
        0,
        rect.y-dy
      );

      const right=Math.min(
        source.width,
        rect.x+rect.w+dx
      );

      const bottom=Math.min(
        source.height,
        rect.y+rect.h+dy
      );

      rect={
        x,
        y,
        w:right-x,
        h:bottom-y
      };

      scan=renderScannedDocument(
        source,
        rect
      );

      draw();

      if(!reading)runOcr();
    };

    whole.onclick=()=>{

      rect={
        x:0,
        y:0,
        w:source.width,
        h:source.height
      };

      scan=renderScannedDocument(
        source,
        rect
      );

      draw();

      if(!reading)runOcr();
    };

    rescan.onclick=()=>{

      if(!source)return;

      rect=detectDocumentRect(
        source
      );

      if(!rect){

        rect={
          x:0,
          y:0,
          w:source.width,
          h:source.height
        };
      }

      scan=renderScannedDocument(
        source,
        rect
      );

      draw();

      if(!reading)runOcr();
    };
  }

  const form=$(
    "section",
    {class:"card"}
  );

  form.innerHTML=`
    <p class="status" data-status>
      ${manual?
        "Preenche os campos. Nada é inventado.":

      }
    </p>

    <div class="chips" data-chips></div>

    <label>
      Fornecedor
      <input

        maxlength="80"
        placeholder="Ex.: Toyota, Galp, Continente"

    </label>

    <label>
      NIF
      <input
        data-nif
        inputmode="numeric"
        maxlength="11"
        placeholder="9 dígitos"
      >
    </label>

    <label>
      Data de emissão
      <input
        data-date
        type="date"
      >
    </label>

    <label>
      IVA (€)
      <input
        data-vat
        inputmode="decimal"
        placeholder="1,23"
      >
    </label>

    <label>
      Total (€)
      <input
        data-total
        inputmode="decimal"
        placeholder="6,69"
      >
    </label>

    <label>
      Categoria
      <select data-cat>
        ${CATS.map(c=>
          `<option ${c==="Outros"?"selected":""}>${c}</option>`
        ).join("")}
      </select>
    </label>

    <label>
      N.º do documento
      <input
        data-doc
        maxlength="40"
        placeholder="FT 168/37404"
      >
    </label>

    <details>
      <summary>Viatura, km e projeto</summary>

      <label>
        Viatura
        <input data-vehicle maxlength="40">
      </label>

      <label>
        Quilómetros
        <input
          data-km
          inputmode="decimal"
          maxlength="12"
        >
      </label>

      <label>
        Projeto
        <input data-project maxlength="60">
      </label>

      <label>
        Notas
        <input data-notes maxlength="180">
      </label>
    </details>

    ${
      manual?
      "":
      `<label>
        Texto reconhecido pelo OCR
        <textarea
          data-ocr
          readonly
          placeholder="O texto reconhecido aparecerá aqui."
        ></textarea>
      </label>`
    }
  `;

  const actions=$("div",{class:"row"});

  const again=$(
    "button",
    {class:"btn ghost",type:"button"},
    "↺ Repetir"
  );

  const save=$(

    const reread=$(
      "button",
      {
        class:"btn soft",
        type:"button",
        style:"margin-top:10px"

    );

/* =========================================================
   OCR
   ========================================================= */

async function runOcr(){

  if(!scan || reading)return;

  reading=true;

  const f=fields(main);

  const status=s=>{
    if(f.status){
      f.status.textContent=s;
    }
  };

  try{

    if(!window.Tesseract){

      throw new Error(
        "O motor OCR não carregou. Verifica a ligação à internet."
      );
    }

    status(
      "A preparar reconhecimento de texto em português…"
    );

    /*
      O OCR recebe SEMPRE a imagem recortada.
      Isto é uma diferença importante em relação
      ao código anterior.
    */

    const worker=await Tesseract.createWorker(
      "por",
      1,
      {
        logger:m=>{

          if(
            m.status==="recognizing text"
          ){

            status(
              `A ler a fatura… ${Math.round(
                (m.progress||0)*100
              )}%`
            );
          }
        }
      }
    );

    const blob=await toBlob(scan);

    const result=await worker.recognize(blob);

    await worker.terminate();

    const text=result.data.text||"";

    if(f.ocr){
      f.ocr.value=text.trim();
    }

    /*
      Extrair tudo.
    */

    const date=parseDate(text);
    const total=parseTotal(text);
    const vat=parseVat(text);
    const supplier=parseSupplier(text);
    const nif=parseNif(text);
    const doc=parseDoc(text);
    const category=categorize(text);

    if(
      supplier &&
      f.supplier &&
      !f.supplier.value
    ){
      f.supplier.value=supplier;
    }

    if(
      nif &&
      f.nif &&
      !f.nif.value
    ){
      f.nif.value=nif;
    }

    if(
      date &&
      f.date &&
      !f.date.value
    ){
      f.date.value=date.iso;
    }

    if(
      total &&
      f.total &&
      !f.total.value
    ){
      f.total.value=total.euros
        .toLocaleString(
          "pt-PT",
          {
            minimumFractionDigits:2,
            maximumFractionDigits:2
          }
        );
    }

    if(
      vat &&
      f.vat &&
      !f.vat.value
    ){
      f.vat.value=vat.toLocaleString(
        "pt-PT",
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      );
    }

    if(
      doc &&
      f.doc &&
      !f.doc.value
    ){
      f.doc.value=doc;
    }

    if(
      f.cat &&
      category!=="Outros"
    ){
      f.cat.value=category;
    }

    /*
      Chips de confirmação.
    */

    if(f.chips){

      f.chips.innerHTML="";

      const add=(text,kind="")=>{

        const chip=$(
          "span",
          {class:"chip "+kind},
          text
        );

        f.chips.append(chip);
      };

      if(date){
        add(
          "✓ Data "+date.display,
          "ok"
        );
      }else{
        add(
          "Data por preencher",
          "warn"
        );
      }

      if(total){
        add(
          "✓ Total "+euros(total.euros),
          "ok"
        );
      }else{
        add(
          "Total por preencher",
          "warn"
        );
      }

      if(vat){
        add(
          "✓ IVA "+euros(vat),
          "ok"
        );
      }

      if(nif){
        add(
          "✓ NIF "+nif,
          "ok"
        );
      }

      if(supplier){
        add(
          "✓ "+supplier,
          "ok"
        );
      }

      add(category);
    }

    const missing=[];

    if(!supplier)missing.push("fornecedor");
    if(!nif)missing.push("NIF");
    if(!date)missing.push("data");
    if(!total)missing.push("total");

    if(!missing.length){

      status(
        "Leitura concluída. Confirma os dados antes de guardar."
      );

    }else{

      status(
        "Leitura concluída. Falta confirmar: "+
        missing.join(", ")+"."
      );
    }

  }catch(error){

    console.error(error);

    status(
      "Não consegui concluir o OCR. "+
      (error.message||"Tenta novamente.")
    );

  }finally{

    reading=false;
  }
}

/* =========================================================
   GUARDAR
   ========================================================= */

async function onSave(form){

  if(busy||!scan)return;

  const f=fields(form);

  const issued=/^\d{4}-\d{2}-\d{2}$/.test(
    f.date.value
  )
    ?f.date.value
    :null;

  const total=userMoney(
    f.total.value
  );

  const vat=userMoney(
    f.vat.value
  );

  const nif=(f.nif.value||"")
    .replace(/\D/g,"");

  if(
    f.total.value.trim() &&
    total==null
  ){

    f.status.textContent=
      "Total inválido. Exemplo: 6,69";

    return;
  }

  if(
    f.vat.value.trim() &&
    vat==null
  ){

    f.status.textContent=
      "IVA inválido.";

    return;
  }

  if(
    nif &&
    nif.length===9 &&
    !nifOk(nif)
  ){

    if(
      !confirm(
        "O NIF introduzido não passou a validação. Guardar mesmo assim?"
      )
    ){
      return;
    }
  }

  try{

    const existing=await listF();

    const duplicate=existing.some(
      r=>
        nif &&
        r.nif===nif &&
        r.issuedDate===issued &&
        r.total===total
    );

    if(
      duplicate &&
      !confirm(
        "Já existe uma fatura com o mesmo NIF, data e total. Guardar outra?"
      )
    ){
      return;
    }

  }catch{}

  busy=true;

  try{

    /*
      IMPORTANTE:
      guarda apenas a imagem recortada.
      A fotografia original NÃO vai para a base de dados.
    */

    const image=await toBlob(scan);

    const record={
      id:crypto.randomUUID(),
      createdAt:Date.now(),

      issuedDate:issued,
      month:monthKey(issued),

      category:f.cat.value,

      total,
      vat,

      supplier:f.supplier.value.trim(),
      nif,

      docNumber:f.doc.value.trim(),

      vehicle:f.vehicle
        ?f.vehicle.value.trim()
        :"",

      km:f.km
        ?f.km.value.trim()
        :"",

      project:f.project
        ?f.project.value.trim()
        :"",

      notes:f.notes
        ?f.notes.value.trim()
        :"",

      ocrText:f.ocr
        ?f.ocr.value
        :"",

      /*
        imagem digitalizada/recortada
      */
      image
    };

    await saveF(record);

    source=null;
    scan=null;
    rect=null;

    await showFaturas();

  }catch(error){

    console.error(error);

    f.status.textContent=
      "Não consegui guardar a fatura.";

  }finally{

    busy=false;
  }
}

/* =========================================================
   MESES
   ========================================================= */

function monthKey(iso){

  if(
    iso &&
    /^\d{4}-\d{2}-\d{2}$/.test(iso)
  ){
    return iso.slice(0,7);
  }

  return "sem-data";
}

function monthLabel(k){

  if(k==="sem-data"){
    return "Sem data";
  }

  const names=[
    "janeiro",
    "fevereiro",
    "março",
    "abril",
    "maio",
    "junho",
    "julho",
    "agosto",
    "setembro",
    "outubro",
    "novembro",
    "dezembro"
  ];

  const [y,m]=k.split("-");

  return `${names[
    Number(m)-1
  ]} ${y}`;
}

/* =========================================================
   DOCUMENTOS
   ========================================================= */

async function showFaturas(){

  setTab("faturas");

  revoke();

  main.replaceChildren();

  main.append(
    $("p",{class:"kicker"},"Arquivo"),
    $("h1",{class:"page-title"},"Documentos")
  );

  let rows=[];

  try{
    rows=await listF();
  }catch{

    main.append(
      $("p",{class:"warn"},
        "Não consegui abrir os documentos."
      )
    );

    return;
  }

  if(!rows.length){

    main.append(
      $("p",{class:"status"},
        "Ainda não existem documentos."
      )
    );

    return;
  }

  const search=$(
    "input",
    {
      class:"search",
      type:"search",
      placeholder:"Procurar fornecedor, NIF ou documento"
    }
  );

  const list=$("div");

  main.append(
    search,
    list
  );

  const paint=()=>{

    const q=fold(search.value);

    list.replaceChildren();

    revoke();

    const visible=rows.filter(r=>{

      const blob=fold(`
        ${r.supplier||""}
        ${r.nif||""}
        ${r.notes||""}
        ${r.category||""}
        ${r.docNumber||""}
      `);

      return !q||blob.includes(q);
    });

    if(!visible.length){

      list.append(
        $("p",{class:"status"},
          "Nenhum documento encontrado."
        )
      );

      return;
    }

    const groups=new Map();

    for(const r of visible){

      const k=r.month||"sem-data";

      if(!groups.has(k)){
        groups.set(k,[]);
      }

      groups.get(k).push(r);
    }

    const keys=[...groups.keys()].sort(
      (a,b)=>
        a==="sem-data"
          ?1
          :b==="sem-data"
            ?-1
            :a<b?1:-1
    );

    for(const key of keys){

      const items=groups.get(key);

      let grand=0;
      let vat=0;

      const sums=new Map();

      for(const it of items){

        if(it.total!=null){

          grand+=it.total;

          sums.set(
            it.category,
            (sums.get(it.category)||0)+it.total
          );
        }

        if(it.vat!=null){
          vat+=it.vat;
        }
      }

      const card=$(
        "section",
        {class:"card"}
      );

      card.innerHTML=`
        <div class="month">
          <h2>${monthLabel(key)}</h2>
          <p class="sum">${euros(grand)}</p>
        </div>

        <p class="status">
          ${items.length} documentos · IVA ${euros(vat)}
        </p>
      `;

      for(const c of CATS){

        if(!sums.has(c))continue;

        card.append(
          $("div",{class:"sub"},
            `<span>${c}</span>
             <strong>${euros(sums.get(c))}</strong>`
          )
        );
      }

      for(const it of items){

        const url=URL.createObjectURL(
          it.image
        );

        urls.push(url);

        const date=it.issuedDate
          ?it.issuedDate.split("-").reverse().join("/")
          :"Sem data";

        const item=$(
          "article",
          {class:"item"}
        );

        item.innerHTML=`
          <img
            src="${url}"
            alt="Documento digitalizado"
          >

          <div>
            <h3>
              ${escapeHtml(
                it.supplier||date
              )}
            </h3>

            <p>
              ${date} ·
              ${escapeHtml(it.category||"Outros")} ·
              ${euros(it.total)}
            </p>

            ${
              it.nif
                ?`<p>NIF ${it.nif}</p>`
                :""
            }

            <div
              class="row"
              style="margin-top:8px"
            >

              <button
                class="btn soft tiny"
                data-edit="${it.id}"
                type="button"
              >
                Corrigir
              </button>

              <button
                class="btn danger tiny"
                data-del="${it.id}"
                type="button"
              >
                Apagar
              </button>

            </div>
          </div>
        `;

        card.append(item);
      }

      list.append(card);
    }

    list.querySelectorAll(
      "[data-del]"
    ).forEach(button=>{

      button.onclick=async()=>{

        if(
          !confirm(
            "Apagar esta fatura?"
          )
        ){
          return;
        }

        await delF(
          button.dataset.del
        );

        showFaturas();
      };
    });

    list.querySelectorAll(
      "[data-edit]"
    ).forEach(button=>{

      button.onclick=async()=>{

        const it=rows.find(
          r=>r.id===button.dataset.edit
        );

        if(it){
          openEdit(it);
        }
      };
    });
  };

  search.oninput=paint;

  paint();
}

    );

    const vat=userMoney(
      card.querySelector(
        "[data-vat]"
      ).value
    );

    const issued=
      /^\d{4}-\d{2}-\d{2}$/.test(date)
        ?date
        :null;

    try{

      await saveF({
        ...it,

        issuedDate:issued,
        month:monthKey(issued),

        total,
        vat,

        supplier:
          card.querySelector(
            "[data-supplier]"
          ).value.trim(),

        nif:
          card.querySelector(
            "[data-nif]"
          ).value.replace(/\D/g,""),

        category:
          card.querySelector(
            "[data-cat]"
          ).value,

        docNumber:
          card.querySelector(
            "[data-doc]"
          ).value.trim(),

        notes:
          card.querySelector(
            "[data-notes]"
          ).value.trim()
      });

      showFaturas();

    }catch{

      status.textContent=
        "Não consegui atualizar.";
    }
  };
}

/* =========================================================
   ANÁLISE / EXPORTAÇÃO
   ========================================================= */

async function showResumo(exportMode=false){

  setTab(
    exportMode
      ?"exportar"
      :"resumo"
  );

  main.replaceChildren();

  main.append(
    $("p",{class:"kicker"},
      exportMode
        ?"Enviar o mês"
        :"Totais"
    ),

    $("h1",{class:"page-title"},
      exportMode
        ?"Exportar"
        :"Análise"
    )
  );

  let rows=[];

  try{
    rows=await listF();
  }catch{

    main.append(
      $("p",{class:"warn"},
        "Não consegui abrir os documentos."
      )
    );

    return;
  }

  const months=[
    ...new Set(
      rows.map(
        r=>r.month||"sem-data"
      )
    )
  ].sort(
    (a,b)=>a<b?1:-1
  );

  if(!months.length){

    main.append(
      $("p",{class:"status"},
        "Ainda não existem faturas."
      )
    );

    return;
  }

  const card=$(
    "section",
    {class:"card"}
  );

  const select=$("select");

  select.setAttribute(
    "aria-label",
    "Mês"
  );

  months.forEach(k=>{

    const option=$("option");

    option.value=k;
    option.textContent=monthLabel(k);

    select.append(option);
  });

  const stats=$("div");

  const actions=$(
    "div",
    {class:"row"}
  );

  const pdf=$(
    "button",
    {class:"btn primary",type:"button"},
    "PDF compacto"
  );

  const csv=$(
    "button",
    {class:"btn ghost",type:"button"},
    "Excel"
  );

  actions.append(
    pdf,
    csv
  );

  card.append(
    select,
    stats,
    actions
  );

  main.append(card);

  const itemsOf=()=>rows.filter(
    r=>
      (r.month||"sem-data")===
      select.value
  );

  const paint=()=>{

    const items=itemsOf();

    let grand=0;
    let vat=0;

    const sums=new Map();

    for(const it of items){

      if(it.total!=null){

        grand+=it.total;

        sums.set(
          it.category,
          (sums.get(it.category)||0)+it.total
        );
      }

      if(it.vat!=null){
        vat+=it.vat;
      }
    }

    stats.innerHTML=`
      <div class="month">
        <h2>${items.length} docs</h2>
        <p class="sum">${euros(grand)}</p>
      </div>

      <p class="status">
        IVA ${euros(vat)}
      </p>

      ${
        CATS
          .filter(c=>sums.has(c))
          .map(c=>
            `<div class="sub">
              <span>${c}</span>
              <strong>${euros(
                sums.get(c)
              )}</strong>
            </div>`
          )
          .join("")
      }
    `;
  };

  select.onchange=paint;

  paint();

  /* =======================================================
     PDF
     ======================================================= */

  pdf.onclick=async()=>{

    const items=itemsOf();

    if(!items.length){

      alert(
        "Não existem documentos neste mês."
      );

      return;
    }

    pdf.textContent="A criar PDF…";
    pdf.disabled=true;

    try{

      if(!window.jspdf){

        await loadScript(
          "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"
        );
      }

      const jsPDF=
        window.jspdf.jsPDF;

      /*
        A4.
        4 documentos por folha.
      */

      const doc=new jsPDF({
        unit:"mm",
        format:"a4",
        orientation:"portrait",
        compress:true
      });

      const pageW=
        doc.internal.pageSize.getWidth();

      const pageH=
        doc.internal.pageSize.getHeight();

      const margin=7;
      const gap=5;

      const cellW=
        (pageW-margin*2-gap)/2;

      const cellH=
        (pageH-margin*2-gap)/2;

      /*
        Cabeçalho muito pequeno.
        O objetivo é poupar papel.
      */

      for(let i=0;i<items.length;i++){

        const position=i%4;

        if(
          i>0 &&
          position===0
        ){
          doc.addPage();
        }

        const col=position%2;
        const row=Math.floor(position/2);

        const x=
          margin+
          col*(cellW+gap);

        const y=
          margin+
          row*(cellH+gap);

        const it=items[i];

        /*
          Caixa muito discreta para facilitar
          corte manual das cópias.
        */

        doc.setDrawColor(
          190,
          190,
          190
        );

        doc.setLineWidth(.25);

        doc.rect(
          x,
          y,
          cellW,
          cellH
        );

        /*
          Cabeçalho.
        */

        doc.setFont(
          "helvetica",
          "bold"
        );

        doc.setFontSize(7);

        doc.setTextColor(
          30,
          30,
          30
        );

        const date=it.issuedDate
          ?it.issuedDate
            .split("-")
            .reverse()
            .join("/")
          :"Sem data";

        const title=[
          it.supplier||"Documento",
          date
        ].join(" · ");

        doc.text(
          title.slice(0,58),
          x+3,
          y+4
        );

        doc.text(
          euros(it.total),
          x+cellW-3,
          y+4,
          {align:"right"}
        );

        /*
          Converter blob para DataURL.
        */

        const data=await blobToDataURL(
          it.image
        );

        /*
          Área de imagem.
        */

        const imgX=x+3;
        const imgY=y+7;
        const imgW=cellW-6;
        const imgH=cellH-10;

        /*
          jsPDF consegue preservar proporção
          quando passamos a dimensão correta.
        */

        const size=await imageSize(
          data
        );

        const ratio=Math.min(
          imgW/size.width,
          imgH/size.height
        );

        const drawW=
          size.width*ratio;

        const drawH=
          size.height*ratio;

        const drawX=
          imgX+(imgW-drawW)/2;

        const drawY=
          imgY+(imgH-drawH)/2;

        doc.addImage(
          data,
          "JPEG",
          drawX,
          drawY,
          drawW,
          drawH,
          undefined,
          "FAST"
        );
      }

      const blob=doc.output(
        "blob"
      );

      await downloadOrShare(
        `faturas-${select.value}-4porfolha.pdf`,
        blob,
        "application/pdf"
      );

    }catch(error){

      console.error(error);

      alert(
        "Não consegui criar o PDF."
      );

    }finally{

      pdf.textContent=
        "PDF compacto";

      pdf.disabled=false;
    }
  };

  /* =======================================================
     CSV
     ======================================================= */

  csv.onclick=async()=>{

    const items=itemsOf();

    const lines=[
      [
        "Data",
        "Fornecedor",
        "NIF",
        "Documento",
        "Categoria",
        "IVA",
        "Total",
        "Viatura",
        "Km",
        "Projeto",
        "Notas"
      ].join(";")
    ];

    const cell=v=>
      `"${String(v??"")
        .replace(/"/g,'""')}"`;

    for(const it of items){

      const date=it.issuedDate
        ?it.issuedDate
          .split("-")
          .reverse()
          .join("/")
        :"";

      lines.push([
        date,
        it.supplier,
        it.nif,
        it.docNumber,
        it.category,
        it.vat??"",
        it.total??"",
        it.vehicle??"",
        it.km??"",
        it.project??"",
        it.notes??""
      ].map(cell).join(";"));
    }

    await downloadOrShare(
      `faturas-${select.value}.csv`,
      new Blob(
        [
          "\uFEFF"+
          lines.join("\r\n")
        ],
        {
          type:
            "text/csv;charset=utf-8"
        }
      ),
      "text/csv"
    );
  };
}

/* =========================================================
   UTILITÁRIOS EXPORTAÇÃO
   ========================================================= */

function loadScript(src){

  return new Promise(
    (resolve,reject)=>{

      const s=document.createElement(
        "script"
      );

      s.src=src;

      s.onload=resolve;
      s.onerror=reject;

      document.head.append(s);
    }
  );
}

function blobToDataURL(blob){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();

      reader.onload=()=>
        resolve(reader.result);

      reader.onerror=reject;

      reader.readAsDataURL(blob);
    }
  );
}

function imageSize(data){

  return new Promise(
    (resolve,reject)=>{

      const img=new Image();

      img.onload=()=>resolve({
        width:img.naturalWidth,
        height:img.naturalHeight
      });

      img.onerror=reject;

      img.src=data;
    }
  );
}

async function downloadOrShare(
  name,
  blob,
  type
){

  const file=new File(
    [blob],
    name,
    {type}
  );

  if(
    navigator.canShare &&
    navigator.canShare({
      files:[file]
    })
  ){

    try{

      await navigator.share({
        files:[file],
        title:name
      });

      return;

    }catch(error){

      if(
        error &&
        error.name==="AbortError"
      ){
        return;
      }
    }
  }

  const url=
    URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=name;

  document.body.append(a);

  a.click();

  a.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    3000
  );
}

/* =========================================================
   SEGURANÇA HTML
   ========================================================= */

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(value){

  return escapeHtml(value);
}

/* =========================================================
   IMPRESSÃO COMPACTA
   =========================================================

   Esta função fica disponível para uma futura opção
   "Imprimir diretamente".

   O PDF continua a ser a opção principal.
   ========================================================= */

async function preparePrint(month){

  const rows=await listF();

  const items=rows.filter(
    r=>
      (r.month||"sem-data")===month
  );

  const printRoot=
    document.getElementById(
      "printRoot"
    );

  printRoot.innerHTML="";

  for(let i=0;i<items.length;i+=4){

    const page=$(
      "div",
      {class:"print-page"}
    );

    const batch=items.slice(
      i,
      i+4
    );

    for(const it of batch){

      const box=$(
        "div",
        {class:"print-doc"}
      );

      const head=$(
        "div",
        {class:"print-doc-head"}
      );

      head.innerHTML=`
        <span>
          ${escapeHtml(
            it.supplier||"Documento"
          )}
        </span>

        <span>
          ${euros(it.total)}
        </span>
      `;

      const img=$("img");

      img.src=
        URL.createObjectURL(
          it.image
        );

      box.append(
        head,
        img
      );

      page.append(box);
    }

    printRoot.append(page);
  }

  window.print();
}
