<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Faturas Toyota</title>

<style>
:root{
  --red:#EB0A1E;
  --red2:#ff3345;
  --black:#080809;
  --card:#151518;
  --card2:#1d1d21;
  --line:rgba(255,255,255,.10);
  --text:#f7f7f7;
  --muted:#999ba0;
  --green:#43d79a;
  --yellow:#f5c542;
  --safe:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--black);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;
  min-height:100%;
}

body{
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
  color:inherit;
}

button{
  border:0;
  cursor:pointer;
  background:none;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100dvh;
  padding-bottom:calc(92px + var(--safe));
}

.main{
  padding:18px 18px 30px;
  max-width:760px;
  margin:auto;
}

.kicker{
  margin:8px 0 3px;
  color:var(--muted);
  font-size:14px;
  font-weight:700;
}

.title{
  margin:0 0 16px;
  font-size:40px;
  line-height:1;
  letter-spacing:-.05em;
}

.brand{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:7px 12px;
  margin-bottom:18px;
  border-radius:999px;
  background:#111;
  border:1px solid rgba(235,10,30,.42);
  color:#fff;
  font-size:13px;
  font-weight:800;
}

.brand-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 12px rgba(235,10,30,.8);
}

.cta{
  width:100%;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  padding:18px;
  margin-bottom:12px;
  border-radius:22px;
}

.cta.hot{
  color:#fff;
  background:linear-gradient(145deg,var(--red2),var(--red));
  box-shadow:0 14px 36px rgba(235,10,30,.28);
}

.cta.cold{
  background:var(--card);
  border:1px solid var(--line);
}

.orb{
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(0,0,0,.25);
}

.cta.cold .orb{
  background:#0c0c0e;
}

.cta b{
  display:block;
  font-size:18px;
}

.cta span{
  display:block;
  margin-top:4px;
  color:rgba(255,255,255,.78);
  font-size:13px;
  line-height:1.35;
}

.cta.cold span{
  color:var(--muted);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  margin-bottom:12px;
}

.status{
  margin:0 0 12px;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.warn{
  padding:12px;
  border-radius:14px;
  color:#f7d978;
  background:rgba(245,197,66,.08);
  border:1px solid rgba(245,197,66,.24);
  font-size:13px;
}

.okbox{
  padding:12px;
  border-radius:14px;
  color:#9bf0c9;
  background:rgba(67,215,154,.08);
  border:1px solid rgba(67,215,154,.24);
  font-size:13px;
}

label{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:12px;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

input,select,textarea{
  width:100%;
  min-height:48px;
  padding:13px 14px;
  background:#0c0c0e;
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:rgba(235,10,30,.55);
  box-shadow:0 0 0 3px rgba(235,10,30,.10);
}

textarea{
  min-height:110px;
  resize:vertical;
  font-family:ui-monospace,Menlo,monospace;
  font-size:12px;
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

.btn{
  min-height:54px;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  border-radius:999px;
  font-weight:850;
}

.btn.primary{
  color:#fff;
  background:linear-gradient(145deg,var(--red2),var(--red));
  box-shadow:0 10px 24px rgba(235,10,30,.25);
}

.btn.ghost,
.btn.soft{
  color:#fff;
  background:var(--card2);
  border:1px solid var(--line);
}

.btn.danger{
  color:#ffb5bc;
  background:#281114;
  border:1px solid rgba(235,10,30,.30);
}

.btn.tiny{
  min-height:40px;
  padding:0 12px;
  font-size:13px;
}

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  display:flex;
  padding:6px 8px calc(8px + var(--safe));
  background:rgba(10,10,12,.95);
  border-top:1px solid var(--line);
  backdrop-filter:blur(18px);
}

.nav button{
  flex:1;
  min-height:54px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:#777980;
  font-size:11px;
  font-weight:800;
}

.nav button.active{
  color:#fff;
}

.nav svg{
  width:20px;
  height:20px;
}

.fab{
  position:fixed;
  right:18px;
  bottom:calc(88px + var(--safe));
  z-index:55;
  width:62px;
  height:62px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:#fff;
  background:linear-gradient(145deg,var(--red2),var(--red));
  box-shadow:0 12px 30px rgba(235,10,30,.40);
}

.search{
  margin-bottom:12px;
}

.month-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
}

.month-head h2{
  margin:0;
  font-size:22px;
  letter-spacing:-.03em;
}

.sum{
  margin:0;
  color:var(--red2);
  font-size:21px;
  font-weight:900;
}

.sub{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  color:var(--muted);
  font-size:14px;
}

.sub strong{
  color:#fff;
}

.item{
  display:grid;
  grid-template-columns:78px 1fr;
  gap:12px;
  padding:13px 0;
  border-top:1px solid var(--line);
}

.item img{
  width:78px;
  height:78px;
  object-fit:contain;
  border-radius:12px;
  background:#fff;
}

.item h3{
  margin:0 0 4px;
  font-size:16px;
}

.item p{
  margin:0 0 3px;
  color:var(--muted);
  font-size:13px;
}

/* CAMERA */

.camera{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  background:#000;
}

.camera video{
  width:100%;
  height:100%;
  flex:1;
  object-fit:cover;
}

.camera-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 18px calc(18px + var(--safe));
  background:#000;
}

.camera-link{
  min-width:72px;
  color:#fff;
  font-weight:800;
}

.shutter{
  width:74px;
  height:74px;
  border-radius:50%;
  background:#fff;
  border:6px solid #444;
}

/* PROCESSAMENTO */

.processing{
  position:fixed;
  inset:0;
  z-index:110;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:20px;
  background:#050506;
}

.processing-box{
  max-width:480px;
  width:100%;
  margin:auto;
  padding:16px;
  border-radius:28px;
  background:#151518;
  border:1px solid var(--line);
}

.processing-preview{
  position:relative;
  min-height:240px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:20px;
  background:#101011;
}

.processing-preview canvas{
  display:block;
  max-width:90%;
  max-height:340px;
  object-fit:contain;
  background:#fff;
}

.scan-line{
  position:absolute;
  left:5%;
  right:5%;
  height:3px;
  background:var(--red);
  box-shadow:0 0 18px var(--red);
  animation:sweep 1.7s infinite;
}

@keyframes sweep{
  0%{top:10%}
  50%{top:88%}
  100%{top:10%}
}

.processing h2{
  margin:18px 0 5px;
  text-align:center;
  font-size:28px;
  letter-spacing:-.04em;
}

.processing p{
  margin:0 0 16px;
  text-align:center;
  color:var(--muted);
}

.step{
  padding:13px 14px;
  margin-bottom:8px;
  border-radius:15px;
  background:#0c0c0e;
  border:1px solid var(--line);
  color:#bfc0c4;
  font-weight:750;
}

.step.active{
  color:#fff;
  border-color:rgba(235,10,30,.55);
}

.step.done{
  color:#8ce8bf;
}

/* REVIEW */

.scan{
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:150px;
  border-radius:18px;
  background:#090909;
}

.scan canvas,
.scan img{
  display:block;
  max-width:100%;
  max-height:55vh;
  object-fit:contain;
  background:#fff;
}

.mini{
  display:flex;
  gap:8px;
  margin:10px 0 16px;
  overflow:auto;
}

.mini button{
  flex:none;
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#121214;
  color:#d4d4d7;
  font-size:13px;
  font-weight:750;
}

/* TOYOTA PRINT BRANDING */

.print-brand{
  display:flex;
  align-items:center;
  gap:9px;
  color:#fff;
  font-weight:900;
}

.print-logo{
  width:35px;
  height:35px;
  border:2px solid var(--red);
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--red);
  font-weight:900;
  font-size:13px;
}

/* MOBILE */

@media(max-width:480px){
  .title{
    font-size:36px;
  }

  .row{
    gap:8px;
  }

  .item{
    grid-template-columns:70px 1fr;
  }

  .item img{
    width:70px;
    height:70px;
  }
}
</style>
</head>

<body>

<div id="app" class="app"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

<script>
/* ============================================================
   FATURAS TOYOTA
   Captura + recorte + digitalização + OCR + arquivo + PDF
   ============================================================ */

const CATS=[
  "Combustível",
  "Alimentação",
  "Restauração",
  "Estadias",
  "Outros"
];

const ICON={
home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<rect x="3" y="3" width="7" height="7" rx="1.5"/>
<rect x="14" y="3" width="7" height="7" rx="1.5"/>
<rect x="3" y="14" width="7" height="7" rx="1.5"/>
<rect x="14" y="14" width="7" height="7" rx="1.5"/>
</svg>`,

docs:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
<path d="M14 3v6h6"/>
</svg>`,

chart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>
</svg>`,

download:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M12 4v12"/>
<path d="M7 11l5 5 5-5"/>
<path d="M5 20h14"/>
</svg>`,

camera:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M4 8h3l2-3h6l2 3h3v11H4V8z"/>
<circle cx="12" cy="13" r="3.2"/>
</svg>`,

upload:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M12 16V5"/>
<path d="M7 9l5-5 5 5"/>
<path d="M5 20h14"/>
</svg>`,

form:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<rect x="5" y="3" width="14" height="18" rx="2"/>
<path d="M8 8h8M8 12h8M8 16h5"/>
</svg>`
};

function el(tag,attrs={},html=""){
  const n=document.createElement(tag);

  Object.entries(attrs).forEach(([k,v])=>{
    n.setAttribute(k,v);
  });

  if(html!==null)n.innerHTML=html;

  return n;
}

function normalizeText(s){
  return String(s||"")
    .replace(/[\u2010-\u2015\u2212]/g,"-")
    .replace(/\u00a0/g," ")
    .normalize("NFD")
    .replace(/\p{M}/gu,"")
    .toLowerCase();
}

function pad(n){
  return String(n).padStart(2,"0");
}

function validDate(y,m,d){
  if(y<1990||y>2099||m<1||m>12||d<1||d>31)return false;

  const x=new Date(Date.UTC(y,m-1,d));

  return x.getUTCFullYear()===y &&
         x.getUTCMonth()===m-1 &&
         x.getUTCDate()===d;
}

function expandYear(y){
  return y>=100 ? y : y>=70 ? 1900+y : 2000+y;
}

/* ============================================================
   DATA EXTRACTION
   ============================================================ */

function parseDate(text){

  const s=normalizeText(text);
  const found=[];

  function add(y,m,d,score){
    y=expandYear(y);

    if(!validDate(y,m,d))return;

    found.push({
      iso:`${y}-${pad(m)}-${pad(d)}`,
      display:`${pad(d)}/${pad(m)}/${y}`,
      score
    });
  }

  let m;

  const r1=/(\d{4})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{1,2})/g;

  while((m=r1.exec(s))){
    const context=s.slice(Math.max(0,m.index-35),m.index+35);
    add(+m[1],+m[2],+m[3],/emiss|data|document/.test(context)?120:30);
  }

  const r2=/(\d{1,2})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{2,4})/g;

  while((m=r2.exec(s))){
    const context=s.slice(Math.max(0,m.index-35),m.index+35);
    add(+m[3],+m[2],+m[1],/emiss|data|document/.test(context)?120:30);
  }

  found.sort((a,b)=>b.score-a.score);

  return found[0]||null;
}

function parseMoney(value){

  if(value==null)return null;

  let s=String(value)
    .replace(/[€$£]/g,"")
    .replace(/\s/g,"")
    .trim();

  if(!s)return null;

  if(s.includes(",") && s.includes(".")){
    if(s.lastIndexOf(",")>s.lastIndexOf(".")){
      s=s.replace(/\./g,"").replace(",",".");
    }else{
      s=s.replace(/,/g,"");
    }
  }else if(s.includes(",")){
    s=s.replace(/\./g,"").replace(",",".");
  }else{
    const parts=s.split(".");
    if(parts.length===2 && parts[1].length===2){
      s=parts[0]+"."+parts[1];
    }else{
      s=s.replace(/\./g,"");
    }
  }

  const n=Number(s);

  return Number.isFinite(n)?n:null;
}

function parseTotal(text){

  const lines=String(text||"").split(/\r?\n/);
  const found=[];

  const keywords=[
    "total a pagar",
    "valor a pagar",
    "total pago",
    "valor pago",
    "total",
    "importe",
    "a pagar",
    "pagar"
  ];

  for(let i=0;i<lines.length;i++){

    const line=normalizeText(
      lines[i]+" "+(lines[i+1]||"")
    );

    const moneyRe=/(\d{1,3}(?:[.\s]\d{3})*[,.]\d{2}|\d+[,.]\d{2})/g;

    let match;

    while((match=moneyRe.exec(line))){

      const before=line.slice(
        Math.max(0,match.index-45),
        match.index
      );

      const keyword=keywords.find(k=>before.includes(k));

      if(!keyword)continue;

      const value=parseMoney(match[1]);

      if(value==null)continue;

      if(/subtotal|sub total|total iva|total imposto|iva a/.test(before)){
        continue;
      }

      found.push({
        euros:value,
        score:
          keyword==="total a pagar" ? 150 :
          keyword==="valor a pagar" ? 145 :
          keyword==="a pagar" ? 140 :
          keyword==="total pago" ? 135 :
          keyword==="valor pago" ? 130 :
          keyword==="total" ? 100 : 70,
        line:i
      });
    }
  }

  found.sort((a,b)=>
    b.score-a.score ||
    b.line-a.line
  );

  return found[0]||null;
}

function parseVat(text){

  const s=normalizeText(text);

  const patterns=[
    /\biva\b[^0-9]{0,15}(\d{1,3}(?:[.\s]\d{3})*[,.]\d{2}|\d+[,.]\d{2})/g,
    /\btotal\s+iva\b[^0-9]{0,15}(\d{1,3}(?:[.\s]\d{3})*[,.]\d{2}|\d+[,.]\d{2})/g
  ];

  let result=null;

  for(const re of patterns){

    let m;

    while((m=re.exec(s))){
      const n=parseMoney(m[1]);
      if(n!=null && n>=0)result=n;
    }
  }

  return result;
}

function nifValid(n){

  if(!/^\d{9}$/.test(n))return false;

  let sum=0;

  for(let i=0;i<8;i++){
    sum+=Number(n[i])*(9-i);
  }

  const mod=sum%11;
  const check=mod<2?0:11-mod;

  return check===Number(n[8]);
}

function parseNif(text){

  const lines=String(text||"").split(/\n/);

  for(const line of lines){

    const f=normalizeText(line);

    if(!/\b(nif|nipc|contribuinte)\b/.test(f))continue;

    if(/\b(adquirente|cliente|hospede|consumidor)\b/.test(f))continue;

    const matches=line.match(/\d[\d\s.]{7,16}\d/g)||[];

    for(const m of matches){

      const digits=m.replace(/\D/g,"");

      if(digits.length===9 && nifValid(digits)){
        return digits;
      }
    }
  }

  return null;
}

function parseSupplier(text){

  const known=[
    ["galp","Galp"],
    ["repsol","Repsol"],
    ["cepsa","Cepsa"],
    ["prio","PRIO"],
    ["continente","Continente"],
    ["pingo doce","Pingo Doce"],
    ["lidl","Lidl"],
    ["auchan","Auchan"],
    ["mercadona","Mercadona"],
    ["pestana","Pestana"],
    ["ibis","Ibis"],
    ["campanile","Campanile"],
    ["mcdonald","McDonald's"]
  ];

  const s=normalizeText(text);

  for(const [key,name] of known){
    if(s.includes(key))return name;
  }

  const lines=String(text||"")
    .split(/\n/)
    .map(x=>x.trim())
    .filter(Boolean);

  for(const line of lines.slice(0,12)){

    const f=normalizeText(line);

    if(f.length<4 || f.length>60)continue;

    if(/\b(nif|nipc|iva|total|data|fatura|recibo|documento|telefone|tel)\b/.test(f)){
      continue;
    }

    const letters=f.replace(/[^a-z]/g,"");

    if(letters.length>=5){
      return line.slice(0,60);
    }
  }

  return null;
}

function parseDocumentNumber(text){

  const patterns=[
    /\b(?:fatura|factura|recibo|documento)\s*(?:n[ºo°.]?|nr[.]?)?\s*[:\-]?\s*([A-Z0-9./-]{3,30})/i,
    /\b(?:FT|FS|FR|NC|FAT)\s*(?:n[ºo°.]?|nr[.]?)?\s*[:\-]?\s*([A-Z0-9./-]{3,30})/i
  ];

  for(const p of patterns){

    const m=String(text||"").match(p);

    if(m){
      return m[0]
        .replace(/\s+/g," ")
        .slice(0,40);
    }
  }

  return null;
}

function categorize(text){

  const s=normalizeText(text);

  if(/\b(galp|repsol|cepsa|prio|gasolina|gasoleo|diesel|combustivel)\b/.test(s)){
    return "Combustível";
  }

  if(/\b(hotel|hostel|airbnb|pousada|pestana|ibis|campanile|alojamento)\b/.test(s)){
    return "Estadias";
  }

  if(/\b(restaurante|pastelaria|cafe|café|pizza|burger|padaria|mcdonald)\b/.test(s)){
    return "Restauração";
  }

  if(/\b(continente|pingo doce|lidl|auchan|mercadona|supermercado)\b/.test(s)){
    return "Alimentação";
  }

  return "Outros";
}

/* ============================================================
   IMAGEM / DIGITALIZAÇÃO
   ============================================================ */

function resizeCanvas(source,max=1800){

  const scale=Math.min(
    1,
    max/Math.max(source.width,source.height)
  );

  if(scale>=.999)return source;

  const c=document.createElement("canvas");

  c.width=Math.max(1,Math.round(source.width*scale));
  c.height=Math.max(1,Math.round(source.height*scale));

  const ctx=c.getContext("2d");

  ctx.drawImage(
    source,
    0,0,
    c.width,c.height
  );

  return c;
}

/*
  A deteção antiga tentava classificar cada pixel.
  Isso é frágil em fotografias reais.

  Aqui procuramos primeiro as zonas claras do documento,
  ignorando margens muito escuras e procurando o maior
  retângulo plausível.
*/

function detectDocument(source){

  const max=1200;

  const scale=Math.min(
    1,
    max/Math.max(source.width,source.height)
  );

  const w=Math.max(1,Math.round(source.width*scale));
  const h=Math.max(1,Math.round(source.height*scale));

  const c=document.createElement("canvas");
  c.width=w;
  c.height=h;

  const ctx=c.getContext("2d",{
    willReadFrequently:true
  });

  ctx.drawImage(source,0,0,w,h);

  const img=ctx.getImageData(0,0,w,h);
  const p=img.data;

  /*
    Média por colunas/linhas.
    O documento normalmente é significativamente
    mais claro que o fundo.
  */

  const col=new Float32Array(w);
  const row=new Float32Array(h);

  for(let y=0;y<h;y++){

    for(let x=0;x<w;x++){

      const i=(y*w+x)*4;

      const r=p[i];
      const g=p[i+1];
      const b=p[i+2];

      const lum=(r*0.299)+(g*0.587)+(b*0.114);

      col[x]+=lum;
      row[y]+=lum;
    }
  }

  for(let x=0;x<w;x++)col[x]/=h;
  for(let y=0;y<h;y++)row[y]/=w;

  const global=(
    col.reduce((a,b)=>a+b,0)/w+
    row.reduce((a,b)=>a+b,0)/h
  )/2;

  /*
    Threshold adaptativo.
    Nunca deixa o documento desaparecer.
  */

  const threshold=Math.max(
    115,
    Math.min(205,global*.82)
  );

  let left=0;
  let right=w-1;
  let top=0;
  let bottom=h-1;

  function columnScore(x){

    let hits=0;

    for(let y=0;y<h;y++){

      const i=(y*w+x)*4;

      const lum=
        p[i]*.299+
        p[i+1]*.587+
        p[i+2]*.114;

      if(lum>threshold)hits++;
    }

    return hits/h;
  }

  function rowScore(y){

    let hits=0;

    for(let x=0;x<w;x++){

      const i=(y*w+x)*4;

      const lum=
        p[i]*.299+
        p[i+1]*.587+
        p[i+2]*.114;

      if(lum>threshold)hits++;
    }

    return hits/w;
  }

  const edgeLimit=.48;

  while(left<w*.18 && columnScore(left)<edgeLimit){
    left++;
  }

  while(right>w*.82 && columnScore(right)<edgeLimit){
    right--;
  }

  while(top<h*.18 && rowScore(top)<edgeLimit){
    top++;
  }

  while(bottom>h*.82 && rowScore(bottom)<edgeLimit){
    bottom--;
  }

  /*
    Se a imagem inteira for relativamente uniforme,
    não recortamos agressivamente.
  */

  const rw=right-left+1;
  const rh=bottom-top+1;

  if(rw<w*.55 || rh<h*.45){
    return {
      x:0,
      y:0,
      w:source.width,
      h:source.height,
      confidence:false
    };
  }

  /*
    Pequena margem branca para que o conteúdo nunca fique
    cortado pelo algoritmo.
  */

  const mx=Math.round(rw*.015);
  const my=Math.round(rh*.015);

  left=Math.max(0,left-mx);
  top=Math.max(0,top-my);
  right=Math.min(w-1,right+mx);
  bottom=Math.min(h-1,bottom+my);

  const inv=1/scale;

  return {
    x:Math.round(left*inv),
    y:Math.round(top*inv),
    w:Math.round((right-left+1)*inv),
    h:Math.round((bottom-top+1)*inv),
    confidence:true
  };
}

/*
  Digitalização segura:
  - mantém a proporção original;
  - fundo branco;
  - melhora ligeiramente contraste;
  - NÃO transforma a imagem toda em preto;
  - preserva recibos pequenos.
*/

function makeScan(source,rect){

  const maxWidth=1800;

  const scale=Math.min(
    1,
    maxWidth/rect.w
  );

  const w=Math.max(
    1,
    Math.round(rect.w*scale)
  );

  const h=Math.max(
    1,
    Math.round(rect.h*scale)
  );

  const out=document.createElement("canvas");

  out.width=w;
  out.height=h;

  const ctx=out.getContext("2d",{
    willReadFrequently:true
  });

  /*
    Branco primeiro.
    Isto impede qualquer canvas transparente/preto.
  */

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,w,h);

  ctx.drawImage(
    source,
    rect.x,
    rect.y,
    rect.w,
    rect.h,
    0,
    0,
    w,
    h
  );

  /*
    Melhoria muito suave.
    Não usamos threshold preto/branco porque isso destrói
    recibos fotografados em condições difíceis.
  */

  try{

    const img=ctx.getImageData(0,0,w,h);
    const d=img.data;

    for(let i=0;i<d.length;i+=4){

      let r=d[i];
      let g=d[i+1];
      let b=d[i+2];

      /*
        contraste suave
      */

      r=Math.max(0,Math.min(255,(r-128)*1.04+128));
      g=Math.max(0,Math.min(255,(g-128)*1.04+128));
      b=Math.max(0,Math.min(255,(b-128)*1.04+128));

      d[i]=r;
      d[i+1]=g;
      d[i+2]=b;
    }

    ctx.putImageData(img,0,0);

  }catch(e){
    /*
      Se o processamento falhar, a imagem original recortada
      continua válida.
    */
  }

  return out;
}

function canvasBlob(canvas){

  return new Promise((resolve,reject)=>{

    canvas.toBlob(
      blob=>{
        if(blob)resolve(blob);
        else reject(new Error("Não foi possível criar a imagem."));
      },
      "image/jpeg",
      .90
    );
  });
}

function openDB(){

  return new Promise((resolve,reject)=>{

    const request=indexedDB.open(
      "faturas-toyota",
      1
    );

    request.onupgradeneeded=()=>{

      const db=request.result;

      if(!db.objectStoreNames.contains("faturas")){
        db.createObjectStore(
          "faturas",
          {keyPath:"id"}
        );
      }
    };

    request.onsuccess=()=>{
      resolve(request.result);
    };

    request.onerror=()=>{
      reject(request.error);
    };
  });
}

async function saveInvoice(invoice){

  const db=await openDB();

  const tx=db.transaction(
    "faturas",
    "readwrite"
  );

  tx.objectStore("faturas").put(invoice);

  await new Promise((resolve,reject)=>{

    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });

  db.close();
}

async function getInvoices(){

  const db=await openDB();

  const tx=db.transaction(
    "faturas",
    "readonly"
  );

  const request=
    tx.objectStore("faturas").getAll();

  const rows=await new Promise((resolve,reject)=>{

    request.onsuccess=()=>{
      resolve(request.result||[]);
    };

    request.onerror=()=>{
      reject(request.error);
    };
  });

  db.close();

  return rows.sort(
    (a,b)=>b.createdAt-a.createdAt
  );
}

async function deleteInvoice(id){

  const db=await openDB();

  const tx=db.transaction(
    "faturas",
    "readwrite"
  );

  tx.objectStore("faturas").delete(id);

  await new Promise((resolve,reject)=>{

    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });

  db.close();
}

async function openCamera(){

  if(!navigator.mediaDevices?.getUserMedia){
    fileCamera.click();
    return;
  }

  let stream;

  try{

    stream=
      await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{ideal:"environment"},
          width:{ideal:1920},
          height:{ideal:2560}
        }
      });

  }catch(e){

    fileCamera.click();
    return;
  }

  nav.classList.add("hidden");
  fab.classList.add("hidden");

  const camera=el(
    "div",
    {class:"camera"}
  );

  const video=el(
    "video",
    {
      autoplay:"true",
      playsinline:"true"
    }
  );

  video.autoplay=true;
  video.playsInline=true;
  video.muted=true;
  video.srcObject=stream;

  const bar=el(
    "div",
    {class:"camera-bar"}
  );

  const close=el(
    "button",
    {class:"camera-link",type:"button"},
    "Fechar"
  );

  const shutter=el(
    "button",
    {
      class:"shutter",
      type:"button",
      "aria-label":"Fotografar"
    }
  );

  const gallery=el(
    "button",
    {class:"camera-link",type:"button"},
    "Galeria"
  );

  bar.append(
    close,
    shutter,
    gallery
  );

  camera.append(
    video,
    bar
  );

  document.body.append(camera);

  await video.play().catch(()=>{});

  function closeCamera(){

    stream.getTracks().forEach(
      track=>track.stop()
    );

    camera.remove();

    nav.classList.remove("hidden");
  }

  close.onclick=closeCamera;

  gallery.onclick=()=>{
    closeCamera();
    fileGallery.click();
  };

  shutter.onclick=()=>{

    const w=video.videoWidth;
    const h=video.videoHeight;

    if(!w||!h)return;

    const c=document.createElement("canvas");

    c.width=w;
    c.height=h;

    const ctx=c.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      w,
      h
    );

    closeCamera();

    startProcessing(
      resizeCanvas(c)
    );
  };
}

/* ============================================================
   PROCESSAMENTO
   ============================================================ */

async function startProcessing(full){

  sourceCanvas=full;

  nav.classList.add("hidden");
  fab.classList.add("hidden");

  const overlay=el(
    "div",
    {class:"processing"}
  );

  const box=el(
    "div",
    {class:"processing-box"}
  );

  const preview=el(
    "div",
    {class:"processing-preview"}
  );

  const canvas=document.createElement("canvas");

  const scale=Math.min(
    1,
    480/Math.max(full.width,full.height)
  );

  canvas.width=Math.max(
    1,
    Math.round(full.width*scale)
  );

  canvas.height=Math.max(
    1,
    Math.round(full.height*scale)
  );

  canvas.getContext("2d").drawImage(
    full,
    0,
    0,
    canvas.width,
    canvas.height
  );

  preview.append(
    canvas,
    el("div",{class:"scan-line"})
  );

  const h=el(
    "h2",
    {},
    "A digitalizar"
  );

  const p=el(
    "p",
    {},
    "A procurar as margens do documento."
  );

  const s1=el(
    "div",
    {class:"step active"},
    "① A detetar o documento"
  );

  const s2=el(
    "div",
    {class:"step"},
    "② A recortar a fotografia"
  );

  const s3=el(
    "div",
    {class:"step"},
    "③ A preparar a imagem para OCR"
  );

  box.append(
    preview,
    h,
    p,
    s1,
    s2,
    s3
  );

  overlay.append(box);
  document.body.append(overlay);

  await wait(250);

  /*
    Deteção.
  */

  documentRect=detectDocument(full);

  if(!documentRect){
    documentRect={
      x:0,
      y:0,
      w:full.width,
      h:full.height,
      confidence:false
    };
  }

  s1.classList.remove("active");
  s1.classList.add("done");

  s2.classList.add("active");

  await wait(250);

  /*
    RECORTE REAL
  */

  scanCanvas=
    makeScan(
      full,
      documentRect
    );

  /*
    Mostra imediatamente o resultado no preview.
  */

  const previewScale=Math.min(
    1,
    480/Math.max(
      scanCanvas.width,
      scanCanvas.height
    )
  );

  canvas.width=Math.max(
    1,
    Math.round(scanCanvas.width*previewScale)
  );

  canvas.height=Math.max(
    1,
    Math.round(scanCanvas.height*previewScale)
  );

  canvas.getContext("2d").drawImage(
    scanCanvas,
    0,
    0,
    canvas.width,
    canvas.height
  );

  p.textContent=
    documentRect.confidence
      ? "Documento detetado e recortado."
      : "Não consegui confirmar as margens. Mantive a fotografia inteira para não cortar informação.";

  s2.classList.remove("active");
  s2.classList.add("done");

  s3.classList.add("active");

  await wait(350);

  overlay.remove();

  paintReview(
    !documentRect.confidence
  );

  runOCR();
}

function wait(ms){
  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );
}

    },
    "Rever digitalização"
  );

    title
  );

    scanCanvas=null;
    documentRect=null;

  };

  main.append(top);

    "section",
    {class:"card"}
  );

  const scan=el(
    "div",
    {class:"scan"}
  );

  const image=document.createElement("canvas");

  function draw(){

    if(!scanCanvas)return;

    image.width=scanCanvas.width;
    image.height=scanCanvas.height;

    const ctx=image.getContext("2d");

    ctx.fillStyle="#fff";
    ctx.fillRect(
      0,
      0,
      image.width,
      image.height
    );

    ctx.drawImage(
      scanCanvas,
      0,
      0
    );
  }

  draw();

  scan.append(image);

  const controls=el(
    "div",
    {class:"mini"}
  );

  const narrower=el(
    "button",
    {type:"button"},
    "Apertar margens"
  );

  const wider=el(
    "button",
    {type:"button"},
    "Alargar margens"
  );

  const original=el(
    "button",
    {type:"button"},
    "Foto original"
  );

  const full=el(
    "button",
    {type:"button"},
    "Foto inteira"
  );

  controls.append(
    narrower,
    wider,
    original,
    full
  );

  imageCard.append(
    scan,
    controls
  );

  if(warning){

    imageCard.append(
      el(
        "p",
        {class:"warn"},
        "As margens não foram identificadas com confiança. A imagem foi mantida inteira para evitar cortar dados. Podes ajustar as margens manualmente."
      )
    );
  }

  main.append(imageCard);

  narrower.onclick=()=>{

    if(!sourceCanvas||!documentRect)return;

    const dx=documentRect.w*.035;
    const dy=documentRect.h*.035;

    documentRect={
      x:documentRect.x+dx,
      y:documentRect.y+dy,
      w:Math.max(10,documentRect.w-dx*2),
      h:Math.max(10,documentRect.h-dy*2),
      confidence:true
    };

    scanCanvas=
      makeScan(
        sourceCanvas,
        documentRect
      );

    draw();
  };

  wider.onclick=()=>{

    if(!sourceCanvas||!documentRect)return;

    const dx=documentRect.w*.05;
    const dy=documentRect.h*.05;

    const x=Math.max(
      0,
      documentRect.x-dx
    );

    const y=Math.max(
      0,
      documentRect.y-dy
    );

    const right=Math.min(
      sourceCanvas.width,
      documentRect.x+
      documentRect.w+
      dx
    );

    const bottom=Math.min(
      sourceCanvas.height,
      documentRect.y+
      documentRect.h+
      dy
    );

    documentRect={
      x,
      y,
      w:right-x,
      h:bottom-y,
      confidence:true
    };

    scanCanvas=
      makeScan(
        sourceCanvas,
        documentRect
      );

    draw();
  };

  original.onclick=()=>{

    if(!sourceCanvas)return;

    image.width=sourceCanvas.width;
    image.height=sourceCanvas.height;

    const ctx=image.getContext("2d");

    ctx.fillStyle="#fff";
    ctx.fillRect(
      0,
      0,
      image.width,
      image.height
    );

    ctx.drawImage(
      sourceCanvas,
      0,
      0
    );
  };

  full.onclick=()=>{

    if(!sourceCanvas)return;

    documentRect={
      x:0,
      y:0,
      w:sourceCanvas.width,
      h:sourceCanvas.height,
      confidence:true
    };

    scanCanvas=
      makeScan(
        sourceCanvas,
        documentRect
      );

    draw();
  };

  createForm();
}

function getFields(){

  const q=s=>main.querySelector(s);

  return {
    status:q("[data-status]"),
    chips:q("[data-chips]"),
    supplier:q("[data-supplier]"),
    nif:q("[data-nif]"),
    date:q("[data-date]"),
    vat:q("[data-vat]"),
    total:q("[data-total]"),
    category:q("[data-category]"),
    document:q("[data-document]"),
    vehicle:q("[data-vehicle]"),
    km:q("[data-km]"),
    project:q("[data-project]"),
    notes:q("[data-notes]"),
    ocr:q("[data-ocr]")
  };
}

/* ============================================================
   OCR
   ============================================================ */

async function runOCR(){

  if(!scanCanvas || reading)return;

  reading=true;

  const f=getFields();

  const status=text=>{
    if(f.status)f.status.textContent=text;
  };

  try{

    if(!window.Tesseract){
      throw new Error(
        "O OCR não carregou. Verifica a ligação à internet."
      );
    }

    status(
      "A carregar o leitor de documentos..."
    );

    /*
      OCR trabalha melhor com uma imagem razoavelmente grande.
    */

    const ocrCanvas=
      resizeCanvas(
        scanCanvas,
        2200
      );

    const blob=
      await canvasBlob(
        ocrCanvas
      );

    status(
      "A reconhecer os dados..."
    );

    const worker=
      await Tesseract.createWorker(
        "por",
        1,
        {
          logger:m=>{

            if(
              m.status===
              "recognizing text"
            ){

              status(
                `A ler a fatura... ${Math.round(
                  (m.progress||0)*100
                )}%`
              );
            }
          }
        }
      );

    const result=
      await worker.recognize(
        blob
      );

    await worker.terminate();

    const text=
      result?.data?.text||"";

    if(f.ocr){
      f.ocr.value=text.trim();
    }

    /*
      Extrair campos.
    */

    const supplier=parseSupplier(text);
    const nif=parseNif(text);
    const date=parseDate(text);
    const total=parseTotal(text);
    const vat=parseVat(text);
    const documentNumber=parseDocumentNumber(text);
    const category=categorize(text);

    if(
      supplier &&
      !f.supplier.value
    ){
      f.supplier.value=supplier;
    }

    if(
      nif &&
      !f.nif.value
    ){
      f.nif.value=nif;
    }

    if(
      date &&
      !f.date.value
    ){
      f.date.value=date.iso;
    }

    if(
      total &&
      !f.total.value
    ){
      f.total.value=
        total.euros.toLocaleString(
          "pt-PT",
          {
            minimumFractionDigits:2,
            maximumFractionDigits:2
          }
        );
    }

    if(
      vat!=null &&
      !f.vat.value
    ){
      f.vat.value=
        vat.toLocaleString(
          "pt-PT",
          {
            minimumFractionDigits:2,
            maximumFractionDigits:2
          }
        );
    }

    if(
      documentNumber &&
      !f.document.value
    ){
      f.document.value=documentNumber;
    }

    if(category!=="Outros"){
      f.category.value=category;
    }

    /*
      Chips de confirmação.
    */

    f.chips.replaceChildren();

    function chip(text,kind){

      const c=el(
        "span",
        {
          style:`
            display:inline-flex;
            padding:6px 10px;
            border-radius:999px;
            background:${kind==="ok"
              ?"rgba(67,215,154,.10)"
              :"rgba(245,197,66,.10)"};
            border:1px solid ${kind==="ok"
              ?"rgba(67,215,154,.28)"
              :"rgba(245,197,66,.28)"};
            color:${kind==="ok"
              ?" #9bf0c9"
              :"#f7d978"};
            margin:3px;
            font-size:12px;
            font-weight:800;
          `
        },
        text
      );

      f.chips.append(c);
    }

    chip(
      date
        ? "✓ Data "+date.display
        : "⚠ Data por preencher",
      date?"ok":"warn"
    );

    chip(
      total
        ? "✓ Total "+total.euros.toFixed(2)+" €"
        : "⚠ Total por preencher",
      total?"ok":"warn"
    );

    if(nif){
      chip(
        "✓ NIF "+nif,
        "ok"
      );
    }

    if(supplier){
      chip(
        "✓ "+supplier,
        "ok"
      );
    }

    status(
      [
        supplier||"Fornecedor por confirmar",
        date
          ? "Data "+date.display
          : "Data por confirmar",
        total
          ? "Total "+total.euros.toFixed(2)+" €"
          : "Total por confirmar"
      ].join(" · ")
      +" — confirma os dados antes de guardar."
    );

  }catch(error){

    status(
      "O OCR não conseguiu concluir a leitura. Podes preencher os campos manualmente."
    );

    if(f.ocr){
      f.ocr.value=
        error?.message||
        String(error);
    }

  }finally{

    reading=false;
  }
}

/* ============================================================
   GUARDAR
   ============================================================ */

async function saveCurrent(card){

  if(busy || !scanCanvas)return;

  const f=getFields();

  const total=parseMoney(
    f.total.value
  );

  const vat=parseMoney(
    f.vat.value
  );

  const issued=
    /^\d{4}-\d{2}-\d{2}$/.test(f.date.value)
      ?f.date.value
      :null;

  if(
    f.total.value.trim() &&
    total==null
  ){

    f.status.textContent=
      "O total não é válido.";

    return;
  }

  if(
    f.vat.value.trim() &&
    vat==null
  ){

    f.status.textContent=
      "O IVA não é válido.";

    return;
  }

  const nif=
    (f.nif.value||"")
      .replace(/\D/g,"");

  /*
    Verificação de duplicado.
  */

  try{

    const existing=
      await getInvoices();

    const duplicate=
      existing.some(
        x=>
          nif &&
          x.nif===nif &&
          x.issuedDate===issued &&
          x.total===total
      );

    if(
      duplicate &&
      !confirm(
        "Já existe uma fatura com o mesmo NIF, data e total.\n\nGuardar mesmo assim?"
      )
    ){
      return;
    }

  }catch(e){}

  busy=true;

  try{

    /*
      IMPORTANTE:
      guardamos scanCanvas, NÃO sourceCanvas.
    */

    const image=
      await canvasBlob(
        scanCanvas
      );

    const invoice={
      id:
        crypto.randomUUID
          ?crypto.randomUUID()
          :Date.now()+"-"+Math.random(),

      createdAt:Date.now(),

      issuedDate:issued,

      month:
        issued
          ?issued.slice(0,7)
          :"sem-data",

      supplier:
        f.supplier.value.trim(),

      nif,

      vat,

      total,

      category:
        f.category.value,

      documentNumber:
        f.document.value.trim(),

      vehicle:
        f.vehicle?.value.trim()||"",

      km:
        f.km?.value.trim()||"",

      project:
        f.project?.value.trim()||"",

      notes:
        f.notes?.value.trim()||"",

      ocrText:
        f.ocr?.value||"",

      /*
        A imagem guardada é a digitalização.
      */

      image
    };

    await saveInvoice(
      invoice
    );

    sourceCanvas=null;
    scanCanvas=null;
    documentRect=null;

    await showDocuments();

  }catch(error){

    f.status.textContent=
      "Não foi possível guardar a fatura.";

  }finally{

    busy=false;
  }
}

async function showDocuments(){

  setTab("docs");
  revokeURLs();

  main.replaceChildren();

  main.append(
    el("p",{class:"kicker"},"Arquivo"),
    el("h1",{class:"title"},"Documentos")
  );

  let rows;

  try{
    rows=await getInvoices();
  }catch(e){

    main.append(
      el(
        "p",
        {class:"warn"},
        "Não foi possível abrir o arquivo."
      )
    );

    return;
  }

  if(!rows.length){

    main.append(
      el(
        "p",
        {class:"status"},
        "Ainda não tens documentos guardados."
      )
    );

    return;
  }

  const search=el(
    "input",
    {
      class:"search",
      type:"search",
      placeholder:"Procurar fornecedor, NIF, categoria..."
    }
  );

  const list=el("div");

  main.append(
    search,
    list
  );

  function paint(){

    revokeURLs();

    const query=
      normalizeText(
        search.value
      );

    const visible=
      rows.filter(row=>{

        const text=[
          row.supplier,
          row.nif,
          row.category,
          row.documentNumber,
          row.notes,
          row.project
        ].join(" ");

        return !query ||
          normalizeText(text)
            .includes(query);
      });

    list.replaceChildren();

    if(!visible.length){

      list.append(
        el(
          "p",
          {class:"status"},
          "Nenhum documento encontrado."
        )
      );

      return;
    }

    const groups=new Map();

    visible.forEach(row=>{

      const key=row.month||"sem-data";

      if(!groups.has(key)){
        groups.set(key,[]);
      }

      groups.get(key).push(row);
    });

    const keys=
      [...groups.keys()].sort(
        (a,b)=>
          a==="sem-data"
            ?1
            :b==="sem-data"
              ?-1
              :b.localeCompare(a)
      );

    keys.forEach(month=>{

      const items=
        groups.get(month);

      let total=0;
      let vat=0;

      const cats=new Map();

      items.forEach(item=>{

        if(item.total!=null){

          total+=item.total;

          cats.set(
            item.category,
            (cats.get(item.category)||0)
            +item.total
          );
        }

        if(item.vat!=null){
          vat+=item.vat;
        }
      });

      const card=
        el(
          "section",
          {class:"card"}
        );

      const head=el(
        "div",
        {class:"month-head"}
      );

      head.append(
        el(
          "h2",
          {},
          monthLabel(month)
        ),
        el(
          "p",
          {class:"sum"},
          formatEuro(total)
        )
      );

      card.append(
        head,
        el(
          "p",
          {class:"status"},
          `${items.length} documento(s) · IVA ${formatEuro(vat)}`
        )
      );

      CATS.forEach(category=>{

        if(!cats.has(category))return;

        card.append(
          el(
            "div",
            {class:"sub"},
            `<span>${category}</span>
             <strong>${formatEuro(cats.get(category))}</strong>`
          )
        );
      });

      items.forEach(item=>{

        const url=
          URL.createObjectURL(
            item.image
          );

        objectURLs.push(url);

        const article=
          el(
            "article",
            {class:"item"}
          );

        const when=
          item.issuedDate
            ?item.issuedDate
              .split("-")
              .reverse()
              .join("/")
            :"Sem data";

        const info=el("div");

        info.innerHTML=`
          <h3>${safe(item.supplier||"Documento")}</h3>
          <p>${when} · ${safe(item.category)} · ${formatEuro(item.total)}</p>
          ${item.nif
            ?`<p>NIF ${safe(item.nif)}</p>`
            :""}
        `;

        const buttons=el(
          "div",
          {
            class:"row",
            style:"margin-top:8px"
          }
        );

        const edit=el(
          "button",
          {
            class:"btn soft tiny",
            type:"button"
          },
          "Corrigir"
        );

        const del=el(
          "button",
          {
            class:"btn danger tiny",
            type:"button"
          },
          "Apagar"
        );

        edit.onclick=
          ()=>openEdit(item);

        del.onclick=async()=>{

          if(!confirm("Apagar este documento?")){
            return;
          }

          await deleteInvoice(
            item.id
          );

          showDocuments();
        };

        buttons.append(
          edit,
          del
        );

        info.append(buttons);

        const img=el(
          "img",
          {
            src:url,
            alt:"Documento digitalizado"
          }
        );

        article.append(
          img,
          info
        );

        card.append(article);
      });

      list.append(card);
    });
  }

  search.oninput=paint;

  paint();
}

      )

  const stats=el("div");

  const actions=el(
    "div",
    {class:"row"}
  );

  const pdf=el(
    "button",
    {class:"btn primary",type:"button"},
    "PDF para impressão"
  );

  const csv=el(
    "button",
    {class:"btn ghost",type:"button"},
    "CSV / Excel"
  );

  actions.append(
    pdf,
    csv
  );

  card.append(
    select,
    stats,
    actions
  );

  main.append(card);

  function items(){

      r=>
        (r.month||"sem-data")
        ===select.value
    );
  }

  function update(){

    const data=items();

    let total=0;
    let vat=0;

    const cats=new Map();

    data.forEach(item=>{

      if(item.total!=null){

        total+=item.total;

        cats.set(
          item.category,
          (cats.get(item.category)||0)
          +item.total
        );

        <p class="sum">${formatEuro(total)}</p>

  select.onchange=update;

  update();

  csv.onclick=async()=>{

    const lines=[
      [
        "Data",
        "Fornecedor",
        "NIF",
        "Documento",
        "Categoria",
        "IVA",
        "Total",
        "Notas"
      ].join(";")
    ];

    data.forEach(item=>{

      const cell=v=>
        `"${String(v??"")
          .replace(/"/g,'""')}"`;

      const date=
        item.issuedDate
          ?item.issuedDate
            .split("-")
            .reverse()
            .join("/")
          :"";

      lines.push(
        [
          date,
          item.supplier,
          item.nif,
          item.documentNumber,
          item.category,
          item.vat??"",
          item.total??"",
          item.notes
        ].map(cell).join(";")
      );
    });

    download(
      `faturas-${select.value}.csv`,
      new Blob(
        ["\uFEFF"+lines.join("\r\n")],
        {
          type:"text/csv;charset=utf-8"
        }
      )
    );
  };

  pdf.onclick=async()=>{

    pdf.textContent=
      "A criar PDF...";

    try{

      if(!window.jspdf){

        await loadScript(
          "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"
        );
      }

      const data=items();

      /*
        PDF A4 com várias faturas por página.

        Cada documento mantém a proporção da digitalização.
        O algoritmo tenta colocar duas imagens por página
        quando estas são pequenas, evitando desperdício.
      */

      const PDF=
        window.jspdf.jsPDF;

      const doc=
        new PDF({
          unit:"mm",
          format:"a4",
          orientation:"portrait"
        });

      const pageW=
        doc.internal.pageSize.getWidth();

      const pageH=
        doc.internal.pageSize.getHeight();

      const margin=8;

      let y=8;

      /*
        Cabeçalho compacto.
      */

      function header(){

        doc.setFillColor(
          10,
          10,
          10
        );

        doc.roundedRect(
          margin,
          y,
          pageW-margin*2,
          12,
          2,
          2,
          "F"
        );

        doc.setTextColor(
          255,
          255,
          255
        );

        doc.setFont(
          "helvetica",
          "bold"
        );

        doc.setFontSize(10);

        doc.text(
          "FATURAS TOYOTA",
          margin+5,
          y+7.5
        );

        doc.setFontSize(8);

        doc.text(
          monthLabel(select.value),
          pageW-margin-5,
          y+7.5,
          {align:"right"}
        );

        y+=16;
      }

      header();

      /*
        Layout:
        - recibos pequenos podem ocupar meia página;
        - documentos maiores ocupam largura total;
        - nunca reduzimos demasiado uma fatura.
      */

      for(let index=0;index<data.length;index++){

        const item=data[index];

        const imgData=
          await blobToDataURL(
            item.image
          );

        const props=
          doc.getImageProperties(
            imgData
          );

        const ratio=
          props.width/props.height;

        let boxW=
          pageW-margin*2;

        let boxH=
          boxW/ratio;

        /*
          Limite para documentos muito altos.
        */

        const maxH=105;

        if(boxH>maxH){

          boxH=maxH;
          boxW=boxH*ratio;
        }

        /*
          Se a fatura for pequena/estreita,
          colocamos duas por página sempre que possível.
        */

        const compact=
          ratio<1.15 &&
          boxH<100;

        if(compact){

          const halfW=
            (pageW-margin*2-4)/2;

          const h=
            Math.min(
              100,
              halfW/ratio
            );

          if(y+h+12>pageH-8){

            doc.addPage();
            y=8;
            header();
          }

          const x1=margin;
          const x2=margin+halfW+4;

          const x=
            index%2===0
              ?x1
              :x2;

          doc.setFillColor(
            245,
            245,
            245
          );

          doc.roundedRect(
            x,
            y,
            halfW,
            h,
            1.5,
            1.5,
            "F"
          );

          doc.addImage(
            imgData,
            "JPEG",
            x+1,
            y+1,
            halfW-2,
            h-2,
            undefined,
            "FAST"
          );

          if(index%2===1){
            y+=h+6;
          }

        }else{

          if(y+boxH+12>pageH-8){

            doc.addPage();
            y=8;
            header();
          }

          const x=
            (pageW-boxW)/2;

          doc.setFillColor(
            245,
            245,
            245
          );

          doc.roundedRect(
            x,
            y,
            boxW,
            boxH,
            1.5,
            1.5,
            "F"
          );

          doc.addImage(
            imgData,
            "JPEG",
            x+1,
            y+1,
            boxW-2,
            boxH-2,
            undefined,
            "FAST"
          );

          y+=boxH+5;
        }

        /*
          Informação textual muito pequena,
          apenas para identificação.
        */

        if(
          y+7<pageH-5 &&
          !compact
        ){

          doc.setTextColor(
            70,
            70,
            70
          );

          doc.setFont(
            "helvetica",
            "normal"
          );

          doc.setFontSize(6.5);

          const date=
            item.issuedDate
              ?item.issuedDate
                .split("-")
                .reverse()
                .join("/")
              :"";

          const line=
            [
              date,
              item.supplier,
              item.nif
                ?"NIF "+item.nif
                :"",
              item.total!=null
                ?formatEuro(item.total)
                :""
            ].filter(Boolean).join(" · ");

          doc.text(
            line.slice(0,130),
            margin,
            y
          );

          y+=6;
        }
      }

      /*
        Rodapé com número de páginas.
      */

      const pageCount=
        doc.getNumberOfPages();

      for(
        let p=1;
        p<=pageCount;
        p++
      ){

        doc.setPage(p);

        doc.setTextColor(
          130,
          130,
          130
        );

        doc.setFontSize(6);

        doc.text(
          `Faturas Toyota · Página ${p}/${pageCount}`,
          pageW/2,
          pageH-4,
          {align:"center"}
        );
      }

      const blob=
        doc.output("blob");

      await shareOrDownload(
        `faturas-${select.value}.pdf`,
        blob,
        "application/pdf"
      );

    }catch(error){

      alert(
        "Não foi possível criar o PDF.\n\n"+
        (error?.message||"Erro desconhecido")
      );

    }finally{

      pdf.textContent=
        "PDF para impressão";
    }
  };
}

function openManual(){

  */

  const c=document.createElement("canvas");

  c.width=600;
  c.height=800;

  const ctx=c.getContext("2d");

  ctx.fillStyle="#fff";
  ctx.fillRect(
    0,
    0,
    c.width,
    c.height
  );

  scanCanvas=c;

  documentRect={
    x:0,
    y:0,
    w:c.width,
    h:c.height,
    confidence:true
  };

  nav.classList.remove("hidden");
  fab.classList.add("hidden");

  main.replaceChildren();

  const card=el(
    "section",
    {class:"card"}
  );

  card.innerHTML=`
    <p class="status">
      Introdução manual. Preenche apenas os dados disponíveis.
    </p>

    <label>
      Fornecedor
      <input data-supplier>
    </label>

    <label>
      NIF
      <input data-nif>
    </label>

    <label>
      Data
      <input data-date type="date">
    </label>

    <label>
      IVA (€)
      <input data-vat inputmode="decimal">
    </label>

    <label>
      Total (€)
      <input data-total inputmode="decimal">
    </label>

    <label>
      Categoria
      <select data-category>
        ${CATS.map(c=>`<option>${c}</option>`).join("")}
      </select>
    </label>

    <label>
      Nº documento
      <input data-document>
    </label>

    <label>
      Notas
      <input data-notes>
    </label>
  `;

  const save=el(
    "button",
    {
      class:"btn primary",
      type:"button"
    },
    "✓ Guardar"
  );

  const back=el(
    "button",
    {
      class:"btn ghost",
      type:"button",
      style:"margin-top:10px"
    },
    "Cancelar"
  );

  main.append(
    el("h1",{class:"title"},"Novo registo"),

    save,

  back.onclick=showHome;

async function saveCurrentManual(card){

  const q=s=>card.querySelector(s);

  const date=q("[data-date]").value;

  const total=
    parseMoney(
      q("[data-total]").value
    );

  const vat=
    parseMoney(
      q("[data-vat]").value
    );

  const nif=
    q("[data-nif]")
      .value
      .replace(/\D/g,"");

  try{

    const image=
      await canvasBlob(
        scanCanvas
      );

    await saveInvoice({

      id:
        crypto.randomUUID
          ?crypto.randomUUID()
          :Date.now()+"",

      createdAt:Date.now(),

      issuedDate:
        /^\d{4}-\d{2}-\d{2}$/.test(date)
          ?date
          :null,

      month:
        /^\d{4}-\d{2}-\d{2}$/.test(date)
          ?date.slice(0,7)
          :"sem-data",

      supplier:
        q("[data-supplier]").value.trim(),

      nif,

      vat,

      total,

      category:
        q("[data-category]").value,

      documentNumber:
        q("[data-document]").value.trim(),

      notes:
        q("[data-notes]").value.trim(),

      ocrText:"",

      image
    });

    scanCanvas=null;

    showDocuments();

  }catch(e){

    alert(
      "Não foi possível guardar."
    );
  }
}

async function fileToCanvas(file){

  const canvas=document.createElement("canvas");

  try{

    const bitmap=
      await createImageBitmap(
        file,
        {
          imageOrientation:"from-image"
        }
      );

    canvas.width=bitmap.width;
    canvas.height=bitmap.height;

    canvas
      .getContext("2d")
      .drawImage(
        bitmap,
        0,
        0
      );

    bitmap.close();

  }catch(e){

    const url=
      URL.createObjectURL(file);

    try{

      const img=
        await new Promise(
          (resolve,reject)=>{

            const image=
              new Image();

            image.onload=
              ()=>resolve(image);

            image.onerror=
              reject;

            image.src=url;
          }
        );

      canvas.width=
        img.naturalWidth;

      canvas.height=
        img.naturalHeight;

      canvas
        .getContext("2d")
        .drawImage(
          img,
          0,
          0
        );

    }finally{

      URL.revokeObjectURL(url);
    }
  }

  return resizeCanvas(
    canvas,
    2200
  );
}

/* ============================================================
   UTILITÁRIOS
   ============================================================ */

function formatEuro(value){

  if(
    value==null ||
    !Number.isFinite(value)
  ){
    return "—";
  }

  return value.toLocaleString(
    "pt-PT",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  )+" €";
}

function moneyInput(value){

  if(value==null)return "";

  return value.toLocaleString(
    "pt-PT",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}

function monthLabel(month){

  if(month==="sem-data"){
    return "Sem data";
  }

  const names=[
    "janeiro",
    "fevereiro",
    "março",
    "abril",
    "maio",
    "junho",
    "julho",
    "agosto",
    "setembro",
    "outubro",
    "novembro",
    "dezembro"
  ];

  const [year,m]=month.split("-");

  return `${names[
    Number(m)-1
  ]} ${year}`;
}

function safe(value){

  return String(value??"")
    .replace(/[&<>"']/g,m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));
}

function safeAttr(value){
  return safe(value);
}

function download(filename,blob){

  const url=
    URL.createObjectURL(
      blob
    );

  const a=
    document.createElement("a");

  a.href=url;
  a.download=filename;

  document.body.append(a);

  a.click();

  a.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );
}

async function shareOrDownload(
  filename,
  blob,
  type
){

  const file=
    new File(
      [blob],
      filename,
      {type}
    );

  if(
    navigator.canShare?.({
      files:[file]
    })
  ){

    try{

      await navigator.share({
        files:[file],
        title:filename
      });

      return;

    }catch(e){

      if(
        e.name==="AbortError"
      ){
        return;
      }
    }
  }

  download(
    filename,
    blob
  );
}

function blobToDataURL(blob){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();

      reader.onload=
        ()=>resolve(
          reader.result
        );

      reader.onerror=
        reject;

      reader.readAsDataURL(
        blob
      );
    }
  );
}

function loadScript(src){

  return new Promise(
    (resolve,reject)=>{

      const script=
        document.createElement("script");

      script.src=src;

      script.onload=resolve;
      script.onerror=reject;

      document.head.append(script);
    }
  );
}
