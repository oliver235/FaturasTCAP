<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Faturas pela TCAP</title>

<style>
:root{
  --bg:#08090a;
  --card:#151619;
  --card2:#1c1d20;
  --line:rgba(255,255,255,.09);
  --ink:#f7f7f7;
  --muted:#92949a;
  --red:#eb0a1e;
  --red2:#ff3547;
  --blue:#5ba4ff;
  --green:#39d98a;
  --yellow:#f3c74f;
  --safe:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
}

body{
  min-height:100dvh;
}

button,input,select,textarea{
  font:inherit;
  color:inherit;
}

button{
  border:0;
  cursor:pointer;
  background:none;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100dvh;
  padding-bottom:calc(90px + var(--safe));
}

.main{
  padding:18px 18px 30px;
}

.kicker{
  color:var(--muted);
  font-size:14px;
  font-weight:700;
  margin:8px 0 4px;
}

.title{
  font-size:40px;
  line-height:1;
  letter-spacing:-.05em;
  margin:0 0 18px;
}

.workspace{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid rgba(235,10,30,.35);
  color:#ffd5d9;
  font-size:13px;
  font-weight:800;
  margin-bottom:18px;
}

.workspace i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 10px rgba(235,10,30,.7);
}

.toyota-mark{
  display:flex;
  align-items:center;
  gap:10px;
}

.toyota-symbol{
  width:34px;
  height:24px;
  border:2px solid white;
  border-radius:50%;
  position:relative;
}

.toyota-symbol:before{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  top:4px;
  bottom:4px;
  border:1px solid white;
  border-radius:50%;
}

.toyota-symbol:after{
  content:"";
  position:absolute;
  width:2px;
  top:2px;
  bottom:2px;
  left:15px;
  background:white;
}

.cta{
  width:100%;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  padding:18px;
  border-radius:22px;
  margin-bottom:12px;
}

.cta.hot{
  background:linear-gradient(180deg,var(--red2),var(--red));
  box-shadow:0 15px 38px rgba(235,10,30,.28);
}

.cta.cold{
  background:var(--card);
  border:1px solid var(--line);
}

.cta .orb{
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.12);
}

.cta.cold .orb{
  background:#0c0d0f;
}

.cta b{
  display:block;
  font-size:18px;
}

.cta span{
  display:block;
  margin-top:4px;
  font-size:13px;
  line-height:1.35;
  opacity:.82;
}

.cta.cold span{
  color:var(--muted);
  opacity:1;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  margin-bottom:12px;
}

.scan-wrap{
  position:relative;
  background:#080808;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:12px;
  display:flex;
  justify-content:center;
}

.scan-wrap canvas,
.scan-wrap img{
  display:block;
  width:100%;
  height:auto;
  max-height:65vh;
  object-fit:contain;
}

.scan-info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:var(--muted);
  font-size:12px;
  margin-top:8px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:10px 0;
}

.chip{
  padding:7px 10px;
  border-radius:999px;
  background:var(--card2);
  border:1px solid var(--line);
  color:#d7d7da;
  font-size:12px;
  font-weight:800;
}

.chip.ok{
  color:#a3f1cb;
  background:rgba(57,217,138,.08);
  border-color:rgba(57,217,138,.25);
}

.chip.warn{
  color:#f8d979;
  background:rgba(243,199,79,.08);
  border-color:rgba(243,199,79,.25);
}

.status{
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
  margin:0 0 12px;
}

.warn{
  color:#f8d979;
  background:rgba(243,199,79,.08);
  border:1px solid rgba(243,199,79,.25);
  border-radius:14px;
  padding:11px 12px;
  font-size:13px;
  line-height:1.4;
}

label{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:12px;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

input,
select,
textarea{
  width:100%;
  min-height:48px;
  padding:13px 14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#0d0e10;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:rgba(235,10,30,.55);
  box-shadow:0 0 0 3px rgba(235,10,30,.12);
}

textarea{
  min-height:110px;
  resize:vertical;
  font-family:ui-monospace,Menlo,monospace;
  font-size:12px;
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

.btn{
  width:100%;
  min-height:52px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:850;
}

.btn.primary{
  color:#fff;
  background:linear-gradient(180deg,var(--red2),var(--red));
  box-shadow:0 10px 25px rgba(235,10,30,.25);
}

.btn.ghost{
  background:var(--card2);
  border:1px solid var(--line);
}

.btn.danger{
  background:#2a1114;
  border:1px solid rgba(235,10,30,.28);
  color:#ffb7bd;
}

.btn.tiny{
  min-height:40px;
  padding:0 10px;
  font-size:12px;
}

.fab{
  position:fixed;
  z-index:20;
  right:18px;
  bottom:calc(86px + var(--safe));
  width:62px;
  height:62px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#fff;
  background:linear-gradient(180deg,var(--red2),var(--red));
  box-shadow:0 14px 30px rgba(235,10,30,.4);
}

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:19;
  display:flex;
  padding:6px 8px calc(8px + var(--safe));
  background:rgba(10,10,12,.95);
  border-top:1px solid var(--line);
  backdrop-filter:blur(20px);
}

.nav button{
  flex:1;
  min-height:54px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:#777980;
  font-size:11px;
  font-weight:800;
}

.nav button[aria-current="page"]{
  color:#fff;
}

.nav svg{
  width:20px;
  height:20px;
}

.search{
  margin-bottom:12px;
}

.month{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
}

.month h2{
  margin:0;
  font-size:22px;
  letter-spacing:-.03em;
}

.sum{
  margin:0;
  color:var(--red2);
  font-size:21px;
  font-weight:900;
}

.sub{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  color:var(--muted);
  font-size:14px;
}

.sub strong{
  color:var(--ink);
}

.item{
  display:grid;
  grid-template-columns:76px 1fr;
  gap:12px;
  padding:13px 0;
  border-top:1px solid var(--line);
}

.item img{
  width:76px;
  height:92px;
  object-fit:contain;
  border-radius:12px;
  background:#050505;
}

.item h3{
  margin:0 0 4px;
  font-size:16px;
}

.item p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

.mini{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:10px 0 16px;
}

.mini button{
  flex:none;
  padding:9px 12px;
  border-radius:999px;
  color:#d6d6d9;
  background:#121316;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:800;
}

.mini button.active{
  border-color:rgba(235,10,30,.55);
  color:#fff;
}

details{
  margin:4px 0 12px;
}

summary{
  cursor:pointer;
  font-weight:800;
  margin-bottom:12px;
}

/* CAMERA */

.camera{
  position:fixed;
  inset:0;
  z-index:100;
  background:#000;
  display:flex;
  flex-direction:column;
}

.camera video{
  flex:1;
  width:100%;
  object-fit:cover;
}

.camera-guide{
  position:absolute;
  left:8%;
  right:8%;
  top:12%;
  bottom:17%;
  border:2px solid rgba(255,255,255,.75);
  border-radius:8px;
  box-shadow:
    0 0 0 9999px rgba(0,0,0,.28),
    0 0 30px rgba(255,255,255,.18);
}

.camera-guide:before,
.camera-guide:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  height:2px;
  background:rgba(235,10,30,.9);
}

.camera-guide:before{
  top:0;
}

.camera-guide:after{
  bottom:0;
}

.camera-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 18px calc(18px + var(--safe));
  background:#000;
}

.link{
  min-width:75px;
  color:#fff;
  font-weight:800;
}

.shutter{
  width:74px;
  height:74px;
  border-radius:50%;
  background:#fff;
  border:7px solid #404044;
}

/* SCANNER OVERLAY */

.scanner{
  position:fixed;
  inset:0;
  z-index:90;
  background:#08090a;
  display:flex;
  flex-direction:column;
  padding:18px 18px calc(24px + var(--safe));
}

.scanner-card{
  margin:auto 0;
  padding:16px;
  border-radius:28px;
  background:#141518;
  border:1px solid var(--line);
}

.scanner-preview{
  position:relative;
  height:250px;
  border-radius:20px;
  overflow:hidden;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.scanner-preview canvas{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.scanner-line{
  position:absolute;
  left:5%;
  right:5%;
  height:2px;
  background:var(--red);
  box-shadow:0 0 18px var(--red);
  animation:sweep 1.5s ease-in-out infinite;
}

@keyframes sweep{
  0%{top:10%}
  50%{top:90%}
  100%{top:10%}
}

.scanner-card h2{
  margin:18px 0 6px;
  text-align:center;
  font-size:28px;
  letter-spacing:-.04em;
}

.scanner-card .lead{
  color:var(--muted);
  text-align:center;
  margin:0 0 16px;
  font-size:13px;
}

.step{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
  border-radius:15px;
  background:#0d0e10;
  border:1px solid var(--line);
  margin-bottom:8px;
  color:#a8a9ad;
  font-size:14px;
  font-weight:800;
}

.step.on{
  color:#fff;
  border-color:rgba(235,10,30,.55);
}

.step.done{
  color:#a8f0ca;
  border-color:rgba(57,217,138,.25);
}

.step .tick{
  margin-left:auto;
}

/* PDF */

.print-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.print-option{
  padding:13px;
  border-radius:16px;
  background:#0e0f11;
  border:1px solid var(--line);
}

.print-option b{
  display:block;
  margin-bottom:4px;
}

.print-option span{
  color:var(--muted);
  font-size:12px;
}

.copies{
  display:flex;
  align-items:center;
  gap:10px;
}

.copies button{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--card2);
  border:1px solid var(--line);
}

.copies input{
  text-align:center;
}

/* RESPONSIVE */

@media(min-width:700px){
  .main{
    max-width:900px;
    margin:auto;
  }

  .cta{
    max-width:650px;
  }
}
</style>

<div id="app" class="app"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

<!-- OpenCV: deteção dos cantos e correção da perspetiva -->
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
"use strict";

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const CATEGORIES = [
  "Combustível",
  "Alimentação",
  "Restauração",
  "Estadias",
  "Outros"
];

const DB_NAME = "faturas-tcap-scanner";
const DB_VERSION = 4;
const STORE = "faturas";

let currentTab = "nova";
let sourceCanvas = null;
let scanCanvas = null;
let corners = null;
let readingOCR = false;
let busy = false;
let objectUrls = [];

/* =========================================================
   ÍCONES
========================================================= */

const ICONS = {

home: `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<rect x="3" y="3" width="7" height="7" rx="1.5"/>
<rect x="14" y="3" width="7" height="7" rx="1.5"/>
<rect x="3" y="14" width="7" height="7" rx="1.5"/>
<rect x="14" y="14" width="7" height="7" rx="1.5"/>
</svg>`,

docs: `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
<path d="M14 3v6h6"/>
</svg>`,

chart: `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>
</svg>`,

download: `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M12 4v12"/>
<path d="M7 11l5 5 5-5"/>
<path d="M5 20h14"/>
</svg>`,

camera: `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M4 8h3l2-3h6l2 3h3v11H4V8z"/>
<circle cx="12" cy="13" r="3.2"/>
</svg>`,

upload: `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M12 16V5"/>
<path d="M7 9l5-5 5 5"/>
<path d="M5 20h14"/>
</svg>`,

form: `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<rect x="5" y="3" width="14" height="18" rx="2"/>
<path d="M8 8h8M8 12h8M8 16h5"/>
</svg>`
};

/* =========================================================
   HELPERS
========================================================= */

function el(tag, attrs={}, html=null){
  const n=document.createElement(tag);

  for(const key in attrs){
    n.setAttribute(key,attrs[key]);
  }

  if(html!==null){
    n.innerHTML=html;
  }

  return n;
}

function normalize(text){
  return String(text||"")
    .replace(/[\u2010-\u2015\u2212]/g,"-")
    .replace(/\u00a0/g," ")
    .normalize("NFD")
    .replace(/\p{M}/gu,"")
    .toLowerCase();
}

function pad(n){
  return String(n).padStart(2,"0");
}

function euros(value){

  if(value===null || value===undefined || !Number.isFinite(value)){
    return "—";
  }

  return value.toLocaleString("pt-PT",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  })+" €";
}

function moneyFromInput(value){

  if(!value || !String(value).trim()){
    return null;
  }

  const s=String(value)
    .trim()
    .replace(/\s/g,"")
    .replace(/\./g,"")
    .replace(",", ".");

  const n=Number(s);

  return Number.isFinite(n) ? n : null;
}

function safeHTML(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function monthKey(date){

  if(!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)){
    return "sem-data";
  }

  return date.substring(0,7);
}

function monthLabel(key){

  if(key==="sem-data"){
    return "Sem data";
  }

  const months=[
    "janeiro",
    "fevereiro",
    "março",
    "abril",
    "maio",
    "junho",
    "julho",
    "agosto",
    "setembro",
    "outubro",
    "novembro",
    "dezembro"
  ];

  const [y,m]=key.split("-");

  return `${months[Number(m)-1]} ${y}`;
}

function revokeUrls(){

  objectUrls.forEach(u=>URL.revokeObjectURL(u));
  objectUrls=[];
}

/* =========================================================
   INDEXED DB
========================================================= */

function openDB(){

  return new Promise((resolve,reject)=>{

    const request=indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded=()=>{
      const db=request.result;

      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE,{keyPath:"id"});
      }
    };

    request.onsuccess=()=>{
      resolve(request.result);
    };

    request.onerror=()=>{
      reject(request.error);
    };
  });
}

async function saveInvoice(invoice){

  const db=await openDB();

  const tx=db.transaction(STORE,"readwrite");

  tx.objectStore(STORE).put(invoice);

  await new Promise((resolve,reject)=>{

    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });

  db.close();
}

async function getInvoices(){

  const db=await openDB();

  const tx=db.transaction(STORE,"readonly");

  const req=tx.objectStore(STORE).getAll();

  const result=await new Promise((resolve,reject)=>{

    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });

  db.close();

  return result.sort((a,b)=>b.createdAt-a.createdAt);
}

async function deleteInvoice(id){

  const db=await openDB();

  const tx=db.transaction(STORE,"readwrite");

  tx.objectStore(STORE).delete(id);

  await new Promise((resolve,reject)=>{

    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });

  db.close();
}

/* =========================================================
   IMAGEM
========================================================= */

function limitCanvas(canvas,max=2200){

  const largest=Math.max(canvas.width,canvas.height);

  if(largest<=max){
    return canvas;
  }

  const scale=max/largest;

  const out=document.createElement("canvas");

  out.width=Math.round(canvas.width*scale);
  out.height=Math.round(canvas.height*scale);

  const ctx=out.getContext("2d");

  ctx.drawImage(
    canvas,
    0,
    0,
    out.width,
    out.height
  );

  return out;
}

async function fileToCanvas(file){

  try{

    const bitmap=await createImageBitmap(
      file,
      {imageOrientation:"from-image"}
    );

    const canvas=document.createElement("canvas");

    canvas.width=bitmap.width;
    canvas.height=bitmap.height;

    canvas.getContext("2d").drawImage(
      bitmap,
      0,
      0
    );

    bitmap.close();

    return limitCanvas(canvas);

  }catch(error){

    const url=URL.createObjectURL(file);

    try{

      const image=await new Promise((resolve,reject)=>{

        const img=new Image();

        img.onload=()=>resolve(img);
        img.onerror=reject;

        img.src=url;
      });

      const canvas=document.createElement("canvas");

      canvas.width=image.naturalWidth;
      canvas.height=image.naturalHeight;

      canvas.getContext("2d").drawImage(
        image,
        0,
        0
      );

      return limitCanvas(canvas);

    }finally{

      URL.revokeObjectURL(url);
    }
  }
}

function canvasBlob(canvas,quality=.88){

  return new Promise((resolve,reject)=>{

    canvas.toBlob(
      blob=>{
        if(blob) resolve(blob);
        else reject(new Error("Não foi possível criar a imagem."));
      },
      "image/jpeg",
      quality
    );
  });
}

/* =========================================================
   OPENCV
========================================================= */

function waitForOpenCV(timeout=12000){

  return new Promise(resolve=>{

    const started=Date.now();

    const timer=setInterval(()=>{

      if(window.cv && cv.Mat){

        clearInterval(timer);
        resolve(true);
        return;
      }

      if(Date.now()-started>timeout){

        clearInterval(timer);
        resolve(false);
      }

    },100);
  });
}

/* =========================================================
   GEOMETRIA
========================================================= */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function orderPoints(points){

  const pts=[...points];

  pts.sort((a,b)=>(a.x+a.y)-(b.x+b.y));

  const tl=pts[0];
  const br=pts[3];

  const remaining=[pts[1],pts[2]];

  remaining.sort((a,b)=>(a.y-a.x)-(b.y-b.x));

  const tr=remaining[0];
  const bl=remaining[1];

  return [tl,tr,br,bl];
}

function polygonArea(points){

  let area=0;

  for(let i=0;i<points.length;i++){

    const a=points[i];
    const b=points[(i+1)%points.length];

    area+=a.x*b.y-b.x*a.y;
  }

  return Math.abs(area/2);
}

/* =========================================================
   DETEÇÃO DE DOCUMENTO
========================================================= */

async function detectDocumentCorners(canvas){

  const ready=await waitForOpenCV();

  if(!ready){
    return null;
  }

  let src=null;
  let gray=null;
  let blur=null;
  let edges=null;
  let contours=null;
  let hierarchy=null;

  try{

    src=cv.imread(canvas);

    const maxSide=1000;

    let work=src;

    if(Math.max(src.cols,src.rows)>maxSide){

      const scale=maxSide/Math.max(src.cols,src.rows);

      work=new cv.Mat();

      cv.resize(
        src,
        work,
        new cv.Size(
          Math.round(src.cols*scale),
          Math.round(src.rows*scale)
        )
      );
    }

    gray=new cv.Mat();
    blur=new cv.Mat();
    edges=new cv.Mat();
    contours=new cv.MatVector();
    hierarchy=new cv.Mat();

    cv.cvtColor(
      work,
      gray,
      cv.COLOR_RGBA2GRAY
    );

    cv.GaussianBlur(
      gray,
      blur,
      new cv.Size(5,5),
      0
    );

    cv.Canny(
      blur,
      edges,
      50,
      150
    );

    cv.dilate(
      edges,
      edges,
      cv.Mat.ones(3,3,cv.CV_8U)
    );

    cv.findContours(
      edges,
      contours,
      hierarchy,
      cv.RETR_LIST,
      cv.CHAIN_APPROX_SIMPLE
    );

    const imageArea=work.cols*work.rows;

    let best=null;
    let bestScore=0;

    for(let i=0;i<contours.size();i++){

      const contour=contours.get(i);

      const area=Math.abs(cv.contourArea(contour));

      if(area<imageArea*.08){
        contour.delete();
        continue;
      }

      if(area>imageArea*.98){
        contour.delete();
        continue;
      }

      const perimeter=cv.arcLength(
        contour,
        true
      );

      const approx=new cv.Mat();

      cv.approxPolyDP(
        contour,
        approx,
        .025*perimeter,
        true
      );

      if(approx.rows===4){

        const pts=[];

        for(let j=0;j<4;j++){

          pts.push({
            x:approx.intAt(j,0),
            y:approx.intAt(j,1)
          });
        }

        const ordered=orderPoints(pts);

        const areaRatio=area/imageArea;

        const rectArea=
          distance(ordered[0],ordered[1])*
          distance(ordered[1],ordered[2]);

        const rectangularity=
          rectArea>0
            ? Math.min(1,area/rectArea)
            : 0;

        const score=
          areaRatio*.65+
          rectangularity*.35;

        if(score>bestScore){

          bestScore=score;
          best=ordered;
        }
      }

      approx.delete();
      contour.delete();
    }

    if(work!==src){
      work.delete();
    }

    if(!best){
      return null;
    }

    const scaleX=canvas.width/(src.cols);
    const scaleY=canvas.height/(src.rows);

    return best.map(p=>({
      x:p.x*scaleX,
      y:p.y*scaleY
    }));

  }catch(error){

    console.warn("Deteção do documento:",error);

    return null;

  }finally{

    if(src)src.delete();
    if(gray)gray.delete();
    if(blur)blur.delete();
    if(edges)edges.delete();
    if(contours)contours.delete();
    if(hierarchy)hierarchy.delete();
  }
}

/* =========================================================
   CORREÇÃO DE PERSPETIVA
========================================================= */

function perspectiveCrop(canvas,points){

  const [tl,tr,br,bl]=orderPoints(points);

  const widthTop=distance(tl,tr);
  const widthBottom=distance(bl,br);

  const heightLeft=distance(tl,bl);
  const heightRight=distance(tr,br);

  let width=Math.round(
    Math.max(widthTop,widthBottom)
  );

  let height=Math.round(
    Math.max(heightLeft,heightRight)
  );

  if(width<100 || height<100){
    return null;
  }

  /*
     Limites para evitar imagens gigantes.
     Mantemos a proporção real do documento.
  */

  const maxDimension=2600;

  const factor=Math.min(
    1,
    maxDimension/Math.max(width,height)
  );

  width=Math.round(width*factor);
  height=Math.round(height*factor);

  const src=cv.imread(canvas);

  const srcPoints=cv.matFromArray(
    4,
    1,
    cv.CV_32FC2,
    [
      tl.x,
      tl.y,
      tr.x,
      tr.y,
      br.x,
      br.y,
      bl.x,
      bl.y
    ]
  );

  const dstPoints=cv.matFromArray(
    4,
    1,
    cv.CV_32FC2,
    [
      0,
      0,
      width-1,
      0,
      width-1,
      height-1,
      0,
      height-1
    ]
  );

  const matrix=cv.getPerspectiveTransform(
    srcPoints,
    dstPoints
  );

  const dst=new cv.Mat();

  cv.warpPerspective(
    src,
    dst,
    matrix,
    new cv.Size(width,height),
    cv.INTER_CUBIC,
    cv.BORDER_REPLICATE,
    new cv.Scalar()
  );

  const output=document.createElement("canvas");

  output.width=width;
  output.height=height;

  cv.imshow(
    output,
    dst
  );

  src.delete();
  srcPoints.delete();
  dstPoints.delete();
  matrix.delete();
  dst.delete();

  return output;
}

/* =========================================================
   SCANNER PRINCIPAL
========================================================= */

async function scanDocument(fullCanvas){

  sourceCanvas=fullCanvas;

  const scanner=document.createElement("div");

  scanner.className="scanner";

  const card=document.createElement("div");

  card.className="scanner-card";

  const preview=document.createElement("div");

  preview.className="scanner-preview";

  const mini=document.createElement("canvas");

  const scale=Math.min(
    1,
    500/Math.max(
      fullCanvas.width,
      fullCanvas.height
    )
  );

  mini.width=Math.round(fullCanvas.width*scale);
  mini.height=Math.round(fullCanvas.height*scale);

  mini.getContext("2d").drawImage(
    fullCanvas,
    0,
    0,
    mini.width,
    mini.height
  );

  preview.append(
    mini,
    el("div",{class:"scanner-line"})
  );

  const title=el(
    "h2",
    {},
    "A digitalizar"
  );

  const lead=el(
    "p",
    {class:"lead"},
    "A procurar os limites do documento e a corrigir a perspetiva."
  );

  const step1=el(
    "div",
    {class:"step on"},
    "①  A detetar os quatro cantos <span class='tick'></span>"
  );

  const step2=el(
    "div",
    {class:"step"},
    "②  A corrigir a perspetiva <span class='tick'></span>"
  );

  const step3=el(
    "div",
    {class:"step"},
    "③  A preparar o documento para OCR <span class='tick'></span>"
  );

  card.append(
    preview,
    title,
    lead,
    step1,
    step2,
    step3
  );

  scanner.append(card);

  document.body.append(scanner);

  await new Promise(r=>setTimeout(r,250));

  corners=await detectDocumentCorners(fullCanvas);

  step1.classList.remove("on");
  step1.classList.add("done");
  step1.querySelector(".tick").textContent="✓";

  step2.classList.add("on");

  await new Promise(r=>setTimeout(r,250));

  let corrected=null;

  if(corners){

    corrected=perspectiveCrop(
      fullCanvas,
      corners
    );
  }

  /*
    Se não conseguirmos detetar os quatro cantos,
    NÃO fingimos que fizemos um scan.
    Guardamos a fotografia inteira apenas como
    fallback e avisamos o utilizador.
  */

  if(!corrected){

    corrected=fullCanvas;

    step2.classList.remove("on");

    step2.innerHTML=
      "②  Não foi possível detetar os cantos <span class='tick'>!</span>";

  }else{

    step2.classList.remove("on");
    step2.classList.add("done");
    step2.querySelector(".tick").textContent="✓";
  }

  step3.classList.add("on");

  await new Promise(r=>setTimeout(r,300));

  scanCanvas=corrected;

  step3.classList.remove("on");
  step3.classList.add("done");
  step3.querySelector(".tick").textContent="✓";

  await new Promise(r=>setTimeout(r,200));

  scanner.remove();

  showReview(!corners);

  runOCR();
}

/* =========================================================
   CÂMARA
========================================================= */

async function openCamera(){

  if(!navigator.mediaDevices?.getUserMedia){

    fileCamera.click();
    return;
  }

  let stream;

  try{

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{
          ideal:"environment"
        },
        width:{
          ideal:1920
        },
        height:{
          ideal:2560
        }
      }
    });

  }catch(error){

    fileCamera.click();
    return;
  }

  nav.classList.add("hidden");
  fab.classList.add("hidden");

  const camera=el(
    "div",
    {class:"camera"}
  );

  const video=el(
    "video",
    {
      autoplay:"true",
      playsinline:"true",
      muted:"true"
    }
  );

  video.autoplay=true;
  video.playsInline=true;
  video.muted=true;
  video.srcObject=stream;

  const guide=el(
    "div",
    {class:"camera-guide"}
  );

  const bar=el(
    "div",
    {class:"camera-bar"}
  );

  const close=el(
    "button",
    {class:"link",type:"button"},
    "Fechar"
  );

  const shutter=el(
    "button",
    {
      class:"shutter",
      type:"button",
      "aria-label":"Fotografar"
    }
  );

  const gallery=el(
    "button",
    {class:"link",type:"button"},
    "Galeria"
  );

  bar.append(
    close,
    shutter,
    gallery
  );

  camera.append(
    video,
    guide,
    bar
  );

  document.body.append(camera);

  await video.play().catch(()=>{});

  function finish(){

    stream.getTracks().forEach(
      track=>track.stop()
    );

    camera.remove();

    nav.classList.remove("hidden");
  }

  close.onclick=finish;

  gallery.onclick=()=>{

    finish();

    fileLibrary.click();
  };

  shutter.onclick=()=>{

    const width=video.videoWidth;
    const height=video.videoHeight;

    if(!width || !height){
      return;
    }

    const canvas=document.createElement("canvas");

    canvas.width=width;
    canvas.height=height;

    canvas.getContext("2d").drawImage(
      video,
      0,
      0,
      width,
      height
    );

    finish();

    scanDocument(
      limitCanvas(canvas)
    );
  };
}

/* =========================================================
   OCR
========================================================= */

function validateNIF(nif){

  if(!/^\d{9}$/.test(nif)){
    return false;
  }

  let sum=0;

  for(let i=0;i<8;i++){

    sum+=Number(nif[i])*(9-i);
  }

  const mod=sum%11;

  const check=mod<2
    ?0
    :11-mod;

  return check===Number(nif[8]);
}

function parseDate(text){

  const s=normalize(text);

  const candidates=[];

  function add(year,month,day,score){

    if(year<1990 || year>2099){
      return;
    }

    if(month<1 || month>12){
      return;
    }

    if(day<1 || day>31){
      return;
    }

    const date=new Date(
      Date.UTC(year,month-1,day)
    );

    if(
      date.getUTCFullYear()!==year ||
      date.getUTCMonth()!==month-1 ||
      date.getUTCDate()!==day
    ){
      return;
    }

    candidates.push({
      iso:`${year}-${pad(month)}-${pad(day)}`,
      display:`${pad(day)}/${pad(month)}/${year}`,
      score
    });
  }

  for(
    const match of s.matchAll(
      /(\d{4})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{1,2})/g
    )
  ){

    add(
      Number(match[1]),
      Number(match[2]),
      Number(match[3]),
      100
    );
  }

  for(
    const match of s.matchAll(
      /(\d{1,2})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{2,4})/g
    )
  ){

    let year=Number(match[3]);

    if(year<100){
      year=year>=70
        ?1900+year
        :2000+year;
    }

    add(
      year,
      Number(match[2]),
      Number(match[1]),
      80
    );
  }

  candidates.sort(
    (a,b)=>b.score-a.score
  );

  return candidates[0]||null;
}

function parseTotal(text){

  const lines=text.split(/\r?\n/);

  const candidates=[];

  const totalRegex=
    /\b(total\s*(?:a\s*pagar)?|valor\s*a\s*pagar|valor\s*pago|importe|montante)\b[^0-9]{0,40}(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/gi;

  for(let i=0;i<lines.length;i++){

    const line=normalize(
      lines[i]+" "+(lines[i+1]||"")
    );

    if(
      /subtotal|total\s+iva|total\s+imposto|base\s+tributavel/.test(line)
    ){
      continue;
    }

    for(
      const match of line.matchAll(totalRegex)
    ){

      const value=moneyFromInput(
        match[2]
      );

      if(value!==null){

        candidates.push({
          value,
          score:/pagar|pago/.test(match[1])
            ?100
            :80
        });
      }
    }
  }

  candidates.sort(
    (a,b)=>b.score-a.score
  );

  return candidates[0]?.value??null;
}

function parseVAT(text){

  const regex=
    /\biva\b[^0-9]{0,30}(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/gi;

  let last=null;

  for(const match of text.matchAll(regex)){

    const value=moneyFromInput(
      match[1]
    );

    if(value!==null){
      last=value;
    }
  }

  return last;
}

function parseNIF(text){

  for(const line of text.split(/\n/)){

    if(
      !/\b(nif|nipc|contribuinte)\b/i.test(line)
    ){
      continue;
    }

    if(
      /\b(adquirente|cliente|hospede)\b/i.test(line)
    ){
      continue;
    }

    const matches=line.match(
      /\d[\d\s.-]{7,15}\d/g
    );

    if(!matches){
      continue;
    }

    for(const match of matches){

      const digits=match.replace(/\D/g,"");

      if(
        digits.length===9 &&
        validateNIF(digits)
      ){
        return digits;
      }
    }
  }

  return null;
}

function parseSupplier(text){

  const known=[
    ["toyota","Toyota"],
    ["toyota portugal","Toyota Portugal"],
    ["galp","Galp"],
    ["repsol","Repsol"],
    ["prio","PRIO"],
    ["cepsa","CEPSA"],
    ["continente","Continente"],
    ["pingo doce","Pingo Doce"],
    ["lidl","Lidl"],
    ["auchan","Auchan"],
    ["mercadona","Mercadona"],
    ["pestana","Pestana"],
    ["ibis","Ibis"],
    ["campanile","Campanile"]
  ];

  const normalized=normalize(text);

  for(const [key,value] of known){

    if(normalized.includes(key)){
      return value;
    }
  }

  const lines=text
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean)
    .slice(0,12);

  for(const line of lines){

    const n=normalize(line);

    if(
      n.length<4 ||
      n.length>70
    ){
      continue;
    }

    if(
      /nif|nipc|iva|total|data|fatura|tal[aã]o|recibo|telefone|www|http/.test(n)
    ){
      continue;
    }

    const letters=n.replace(/[^a-z]/g,"");

    if(letters.length>=5){
      return line.substring(0,70);
    }
  }

  return null;
}

function parseDocumentNumber(text){

  const match=text.match(
    /\b(?:FT|FAT|FS|FR|NC|VD|REC)\s*(?:N[ºo°.]*)?\s*[:.]?\s*[A-Z0-9][A-Z0-9./-]{2,}/i
  );

  return match
    ?match[0].replace(/\s+/g," ").substring(0,50)
    :null;
}

function categorize(text){

  const s=normalize(text);

  if(
    /\b(galp|repsol|cepsa|prio|gasolina|gasoleo|diesel|combustivel|posto)\b/.test(s)
  ){
    return "Combustível";
  }

  if(
    /\b(hotel|hostel|ibis|pestana|pousada|alojamento|campanile)\b/.test(s)
  ){
    return "Estadias";
  }

  if(
    /\b(restaurante|cafe|caf[eé]|pastelaria|pizza|burger|mcdonald|padaria)\b/.test(s)
  ){
    return "Restauração";
  }

  if(
    /\b(continente|pingo doce|lidl|auchan|mercadona|supermercado)\b/.test(s)
  ){
    return "Alimentação";
  }

  return "Outros";
}

async function runOCR(){

  if(
    !scanCanvas ||
    readingOCR
  ){
    return;
  }

  readingOCR=true;

  const fields=getFields(main);

  const status=text=>{

    if(fields.status){
      fields.status.textContent=text;
    }
  };

  try{

    if(!window.Tesseract){

      throw new Error(
        "O OCR não está disponível."
      );
    }

    status(
      "A preparar OCR em português…"
    );

    const worker=await Tesseract.createWorker(
      "por",
      1,
      {
        logger:message=>{

          if(
            message.status==="recognizing text"
          ){

            const progress=Math.round(
              (message.progress||0)*100
            );

            status(
              `A ler o documento… ${progress}%`
            );
          }
        }
      }
    );

    /*
      OCR sobre a imagem JÁ corrigida.
      Isto é muito importante:
      não fazemos OCR sobre a fotografia inclinada.
    */

    const blob=await canvasBlob(
      scanCanvas,
      .92
    );

    const result=await worker.recognize(
      blob
    );

    await worker.terminate();

    const text=result.data.text||"";

    if(fields.ocr){
      fields.ocr.value=text.trim();
    }

    const supplier=parseSupplier(text);
    const nif=parseNIF(text);
    const date=parseDate(text);
    const total=parseTotal(text);
    const vat=parseVAT(text);
    const documentNumber=parseDocumentNumber(text);
    const category=categorize(text);

    if(
      supplier &&
      !fields.supplier.value
    ){
      fields.supplier.value=supplier;
    }

    if(
      nif &&
      !fields.nif.value
    ){
      fields.nif.value=nif;
    }

    if(
      date &&
      !fields.date.value
    ){
      fields.date.value=date.iso;
    }

    if(
      total!==null &&
      !fields.total.value
    ){
      fields.total.value=
        total.toLocaleString(
          "pt-PT",
          {
            minimumFractionDigits:2,
            maximumFractionDigits:2
          }
        );
    }

    if(
      vat!==null &&
      !fields.vat.value
    ){
      fields.vat.value=
        vat.toLocaleString(
          "pt-PT",
          {
            minimumFractionDigits:2,
            maximumFractionDigits:2
          }
        );
    }

    if(
      documentNumber &&
      !fields.document.value
    ){
      fields.document.value=
        documentNumber;
    }

    if(
      category!=="Outros"
    ){
      fields.category.value=
        category;
    }

    fields.chips.innerHTML="";

    function chip(text,type){

      const node=el(
        "span",
        {class:`chip ${type||""}`},
        text
      );

      fields.chips.append(node);
    }

    if(date){
      chip(
        `Data ${date.display}`,
        "ok"
      );
    }else{
      chip(
        "Data por confirmar",
        "warn"
      );
    }

    if(total!==null){
      chip(
        `Total ${euros(total)}`,
        "ok"
      );
    }else{
      chip(
        "Total por confirmar",
        "warn"
      );
    }

    if(nif){
      chip(
        `NIF ${nif}`,
        "ok"
      );
    }

    if(supplier){
      chip(
        supplier,
        "ok"
      );
    }

    chip(category);

    status(
      "Leitura concluída. Confirma os dados antes de guardar."
    );

  }catch(error){

    console.error(error);

    status(
      "O OCR não conseguiu interpretar completamente o documento. Os campos podem ser preenchidos manualmente."
    );

  }finally{

    readingOCR=false;
  }
}

========================================================= */

async function saveCurrent(form){

  if(
    busy ||
    !scanCanvas
  ){
    return;
  }

  const fields=getFields(form);

  const issuedDate=
    /^\d{4}-\d{2}-\d{2}$/.test(
      fields.date.value
    )
    ?fields.date.value
    :null;

  const total=moneyFromInput(
    fields.total.value
  );

  const vat=moneyFromInput(
    fields.vat.value
  );

  const nif=
    fields.nif.value
      .replace(/\D/g,"");

  if(
    fields.total.value.trim() &&
    total===null
  ){

    fields.status.textContent=
      "Total inválido.";

    return;
  }

  if(
    fields.vat.value.trim() &&
    vat===null
  ){

    fields.status.textContent=
      "IVA inválido.";

    return;
  }

  busy=true;

  try{

    const existing=await getInvoices();

    const duplicate=existing.some(
      item=>
        nif &&
        item.nif===nif &&
        item.issuedDate===issuedDate &&
        item.total===total
    );

    if(
      duplicate &&
      !confirm(
        "Já existe uma fatura com o mesmo NIF, data e total. Guardar novamente?"
      )
    ){

      busy=false;
      return;
    }

    /*
      MUITO IMPORTANTE:
      guardamos scanCanvas e NÃO sourceCanvas.
      Portanto a base de dados fica com a
      versão digitalizada.
    */

    const image=await canvasBlob(
      scanCanvas,
      .92
    );

    const invoice={
      id:crypto.randomUUID(),

      createdAt:Date.now(),

      issuedDate,

      month:monthKey(
        issuedDate
      ),

      category:fields.category.value,

      supplier:
        fields.supplier.value.trim(),

      nif,

      vat,

      total,

      docNumber:
        fields.document.value.trim(),

      vehicle:
        fields.vehicle?.value.trim()||"",

      km:
        fields.km?.value.trim()||"",

      project:
        fields.project?.value.trim()||"",

      notes:
        fields.notes?.value.trim()||"",

      ocrText:
        fields.ocr?.value||"",

      /*
        Documento final digitalizado.
      */
      image,

      /*
        Guarda dimensão para o PDF
        saber se é vertical/horizontal.
      */
      imageWidth:scanCanvas.width,
      imageHeight:scanCanvas.height
    };

    await saveInvoice(invoice);

    sourceCanvas=null;
    scanCanvas=null;
    corners=null;

    await showInvoices();

  }catch(error){

    console.error(error);

    fields.status.textContent=
      "Não foi possível guardar a fatura.";

  }finally{

    busy=false;
  }
}

async function showInvoices(){

  setTab("faturas");

  revokeUrls();

  main.replaceChildren();

  main.append(
    el(
      "p",
      {class:"kicker"},
      "Arquivo"
    ),
    el(
      "h1",
      {class:"title"},
      "Documentos"
    )
  );

  let invoices=[];

  try{

    invoices=await getInvoices();

  }catch(error){

    main.append(
      el(
        "p",
        {class:"warn"},
        "Não consegui abrir o arquivo."
      )
    );

    return;
  }

  if(!invoices.length){

    main.append(
      el(
        "p",
        {class:"status"},
        "Ainda não existem documentos."
      )
    );

    return;
  }

  const search=el(
    "input",
    {
      class:"search",
      type:"search",
      placeholder:"Pesquisar fornecedor, NIF, categoria..."
    }
  );

  const list=el(
    "div"
  );

  main.append(
    search,
    list
  );

  function render(){

    list.replaceChildren();

    revokeUrls();

    const query=normalize(
      search.value
    );

    const filtered=invoices.filter(
      invoice=>
        !query ||
        normalize(
          [
            invoice.supplier,
            invoice.nif,
            invoice.category,
            invoice.docNumber,
            invoice.notes
          ].join(" ")
        ).includes(query)
    );

    if(!filtered.length){

      list.append(
        el(
          "p",
          {class:"status"},
          "Nenhum documento encontrado."
        )
      );

      return;
    }

    const groups=new Map();

    for(const invoice of filtered){

      const key=
        invoice.month||"sem-data";

      if(!groups.has(key)){
        groups.set(key,[]);
      }

      groups.get(key).push(invoice);
    }

    const keys=[...groups.keys()].sort(
      (a,b)=>{

        if(a==="sem-data")return 1;
        if(b==="sem-data")return -1;

        return a<b?1:-1;
      }
    );

    for(const key of keys){

      const items=groups.get(key);

      let total=0;
      let vat=0;

      const categories=new Map();

      for(const invoice of items){

        if(invoice.total!==null){

          total+=invoice.total;

          categories.set(
            invoice.category,
            (categories.get(invoice.category)||0)
              +invoice.total
          );
        }

        if(invoice.vat!==null){
          vat+=invoice.vat;
        }
      }

      const card=el(
        "section",
        {class:"card"}
      );

      card.innerHTML=`
        <div class="month">
          <h2>${monthLabel(key)}</h2>
          <p class="sum">${euros(total)}</p>
        </div>

        <p class="status">
          ${items.length} documentos · IVA ${euros(vat)}
        </p>
      `;

      for(const category of CATEGORIES){

        if(!categories.has(category)){
          continue;
        }

        card.append(
          el(
            "div",
            {class:"sub"},
            `
            <span>${safeHTML(category)}</span>
            <strong>${euros(categories.get(category))}</strong>
            `
          )
        );
      }

      for(const invoice of items){

        const url=URL.createObjectURL(
          invoice.image
        );

        objectUrls.push(url);

        const item=el(
          "article",
          {class:"item"}
        );

        const date=invoice.issuedDate
          ?invoice.issuedDate
            .split("-")
            .reverse()
            .join("/")
          :"Sem data";

        item.innerHTML=`
          <img
            src="${url}"
            alt=""
          >

          <div>

            <h3>
              ${safeHTML(
                invoice.supplier||date
              )}
            </h3>

            <p>
              ${date}
              ·
              ${safeHTML(invoice.category)}
              ·
              ${euros(invoice.total)}
            </p>

            ${
              invoice.nif
              ?`<p>NIF ${safeHTML(invoice.nif)}</p>`
              :""
            }

            <div
              class="row"
              style="margin-top:9px"
            >

              <button
                class="btn ghost tiny"
                data-edit="${invoice.id}"
                type="button"
              >
                Corrigir
              </button>

              <button
                class="btn danger tiny"
                data-delete="${invoice.id}"
                type="button"
              >
                Apagar
              </button>

            </div>

          </div>
        `;

        card.append(item);
      }

      list.append(card);
    }

    list
      .querySelectorAll("[data-delete]")
      .forEach(button=>{

        button.onclick=async()=>{

          if(
            !confirm(
              "Apagar esta fatura?"
            )
          ){
            return;
          }

          await deleteInvoice(
            button.dataset.delete
          );

          showInvoices();
        };
      });

    list
      .querySelectorAll("[data-edit]")
      .forEach(button=>{

        button.onclick=async()=>{

          const invoice=invoices.find(
            x=>x.id===button.dataset.edit
          );

          if(invoice){
            openEdit(invoice);
          }
        };
      });
  }

  search.oninput=render;

  render();
}

        "p",
        {class:"warn"},
        "Não consegui abrir as faturas."
      )
    );

    return;
  }

  if(!invoices.length){

    main.append(
      el(
        "p",
        {class:"status"},
        "Ainda não existem documentos."
      )
    );

    return;
  }

  const months=[
    ...new Set(
      invoices.map(
        invoice=>invoice.month||"sem-data"
      )
    )
  ].sort(
    (a,b)=>a<b?1:-1
  );

  const card=el(
    "section",
    {class:"card"}
  );

  const select=el(
    "select"
  );

  months.forEach(month=>{

    select.append(
      el(
        "option",
        {value:month},
        monthLabel(month)
      )
    );
  });

  const stats=el("div");

  card.append(
    select,
    stats
  );

  if(exportMode){

    const title=el(
      "p",
      {
        style:"font-weight:900;margin:18px 0 8px"
      },
      "Impressão"
    );

    const info=el(
      "p",
      {class:"status"},
      "As imagens usadas no PDF são as versões já digitalizadas e recortadas."
    );

    const layout=el(
      "div",
      {class:"print-options"}
    );

    const one=el(
      "div",
      {class:"print-option"}
    );

    one.innerHTML=`
      <b>Compacto</b>
      <span>Várias faturas por página, aproveitando melhor o papel.</span>
    `;

    const large=el(
      "div",
      {class:"print-option"}
    );

    large.innerHTML=`
      <b>Documento</b>
      <span>Uma fatura maior por área de impressão.</span>
    `;

    layout.append(
      one,
      large
    );

    const copiesTitle=el(
      "p",
      {
        style:"font-weight:900;margin:18px 0 8px"
      },
      "Número de cópias"
    );

    const copies=el(
      "div",
      {class:"copies"}
    );

    const minus=el(
      "button",
      {type:"button"},
      "−"
    );

    const copiesInput=el(
      "input",
      {
        type:"number",
        min:"1",
        max:"20",
        value:"1"
      }
    );

    const plus=el(
      "button",
      {type:"button"},
      "+"
    );

    copies.append(
      minus,
      copiesInput,
      plus
    );

    minus.onclick=()=>{
      copiesInput.value=
        Math.max(
          1,
          Number(copiesInput.value)-1
        );
    };

    plus.onclick=()=>{
      copiesInput.value=
        Math.min(
          20,
          Number(copiesInput.value)+1
        );
    };

    const pdfCompact=el(
      "button",
      {
        class:"btn primary",
        type:"button",
        style:"margin-top:16px"
      },
      "PDF compacto para impressão"
    );

    const pdfNormal=el(
      "button",
      {
        class:"btn ghost",
        type:"button",
        style:"margin-top:10px"
      },
      "PDF — uma por área"
    );

    const csv=el(
      "button",
      {
        class:"btn ghost",
        type:"button",
        style:"margin-top:10px"
      },
      "Exportar Excel / CSV"
    );

    card.append(
      title,
      info,
      layout,
      copiesTitle,
      copies,
      pdfCompact,
      pdfNormal,
      csv
    );

    pdfCompact.onclick=()=>{

      createPDF(
        invoices,
        select.value,
        "compact",
        Math.max(
          1,
          Number(copiesInput.value)||1
        ),
        pdfCompact
      );
    };

    pdfNormal.onclick=()=>{

      createPDF(
        invoices,
        select.value,
        "normal",
        Math.max(
          1,
          Number(copiesInput.value)||1
        ),
        pdfNormal
      );
    };

    csv.onclick=()=>{

      exportCSV(
        invoices,
        select.value
      );
    };
  }

  main.append(card);

  function paint(){

    const items=invoices.filter(
      invoice=>
        (invoice.month||"sem-data")
        ===select.value
    );

    let total=0;
    let vat=0;

    const categories=new Map();

    for(const invoice of items){

      if(invoice.total!==null){

        total+=invoice.total;

        categories.set(
          invoice.category,
          (categories.get(invoice.category)||0)
            +invoice.total
        );
      }

      if(invoice.vat!==null){
        vat+=invoice.vat;
      }
    }

    stats.innerHTML=`
      <div
        class="month"
        style="margin-top:18px"
      >
        <h2>${items.length} docs</h2>
        <p class="sum">${euros(total)}</p>
      </div>

      <p class="status">
        IVA ${euros(vat)}
      </p>

      ${
        CATEGORIES
          .filter(c=>categories.has(c))
          .map(
            c=>
            `
            <div class="sub">
              <span>${safeHTML(c)}</span>
              <strong>${euros(categories.get(c))}</strong>
            </div>
            `
          )
          .join("")
      }
    `;
  }

  select.onchange=paint;

  paint();
}

/* =========================================================
   PDF
========================================================= */

async function loadJsPDF(){

  if(window.jspdf?.jsPDF){
    return;
  }

  await new Promise((resolve,reject)=>{

    const script=document.createElement("script");

    script.src=
      "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js";

    script.onload=resolve;
    script.onerror=reject;

    document.head.append(script);
  });
}

async function blobToDataURL(blob){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.onerror=reject;

    reader.readAsDataURL(blob);
  });
}

async function createPDF(
  invoices,
  month,
  mode,
  copies,
  button
){

  button.disabled=true;

  const originalText=button.textContent;

  button.textContent=
    "A criar PDF…";

  try{

    await loadJsPDF();

    const selected=invoices.filter(
      invoice=>
        (invoice.month||"sem-data")
        ===month
    );

    /*
      Repete as faturas conforme número de cópias.
    */

    const printable=[];

    for(const invoice of selected){

      for(let i=0;i<copies;i++){

        printable.push(invoice);
      }
    }

    const PDF=window.jspdf.jsPDF;

    const pdf=new PDF({
      orientation:"portrait",
      unit:"mm",
      format:"a4",
      compress:true
    });

    const pageWidth=
      pdf.internal.pageSize.getWidth();

    const pageHeight=
      pdf.internal.pageSize.getHeight();

    const margin=8;

    if(mode==="compact"){

      /*
        A4 com 2 colunas.
        Cada documento é colocado dentro
        do espaço disponível mantendo a
        proporção da digitalização.

        Para recibos estreitos, o espaço
        vertical é reduzido.
      */

      const columns=2;
      const gap=4;

      const boxWidth=
        (pageWidth-margin*2-gap)
        /columns;

      const boxHeight=65;

      let x=margin;
      let y=margin;
      let column=0;

      let first=true;

      for(const invoice of printable){

        if(!first){

          if(column===columns-1){

            column=0;
            x=margin;
            y+=boxHeight+gap;

          }else{

            column++;
            x+=boxWidth+gap;
          }
        }

        if(
          y+boxHeight>
          pageHeight-margin
        ){

          pdf.addPage();

          x=margin;
          y=margin;
          column=0;
        }

        first=false;

        const data=
          await blobToDataURL(
            invoice.image
          );

        /*
          Moldura muito discreta para facilitar
          o corte das cópias impressas.
        */

        pdf.setDrawColor(
          210,
          210,
          210
        );

        pdf.rect(
          x,
          y,
          boxWidth,
          boxHeight
        );

        const ratio=
          (invoice.imageWidth||1000)/
          (invoice.imageHeight||1400);

        let imageWidth=boxWidth-4;
        let imageHeight=imageWidth/ratio;

        if(imageHeight>boxHeight-12){

          imageHeight=boxHeight-12;
          imageWidth=imageHeight*ratio;
        }

        const imageX=
          x+(boxWidth-imageWidth)/2;

        const imageY=
          y+4;

        pdf.addImage(
          data,
          "JPEG",
          imageX,
          imageY,
          imageWidth,
          imageHeight,
          undefined,
          "FAST"
        );

        /*
          Pequena legenda apenas se houver
          espaço suficiente.
        */

        const date=
          invoice.issuedDate
            ?invoice.issuedDate
              .split("-")
              .reverse()
              .join("/")
            :"";

        const label=[
          invoice.supplier||"",
          date
        ].filter(Boolean).join(" · ");

        if(label){

          pdf.setFont(
            "helvetica",
            "normal"
          );

          pdf.setFontSize(5.5);

          pdf.setTextColor(
            80,
            80,
            80
          );

          pdf.text(
            label.substring(0,55),
            x+2,
            y+boxHeight-2
          );
        }
      }

    }else{

      /*
        Modo normal:
        cada documento ocupa uma área
        confortável, mas continua a manter
        a proporção original.
      */

      let y=margin;

      for(let index=0;index<printable.length;index++){

        const invoice=printable[index];

        if(
          index>0 &&
          y>pageHeight-80
        ){

          pdf.addPage();

          y=margin;
        }

        const data=
          await blobToDataURL(
            invoice.image
          );

        const ratio=
          (invoice.imageWidth||1000)/
          (invoice.imageHeight||1400);

        const maxWidth=
          pageWidth-margin*2;

        const maxHeight=
          pageHeight-40;

        let width=maxWidth;
        let height=width/ratio;

        if(height>maxHeight){

          height=maxHeight;
          width=height*ratio;
        }

        const x=
          (pageWidth-width)/2;

        pdf.addImage(
          data,
          "JPEG",
          x,
          y,
          width,
          height,
          undefined,
          "FAST"
        );

        y+=height+10;
      }
    }

    /*
      Rodapé discreto.
    */

    const pageCount=
      pdf.getNumberOfPages();

    for(
      let page=1;
      page<=pageCount;
      page++
    ){

      pdf.setPage(page);

      pdf.setFont(
        "helvetica",
        "normal"
      );

      pdf.setFontSize(6);

      pdf.setTextColor(
        140,
        140,
        140
      );

      pdf.text(
        `Faturas pela TCAP · ${monthLabel(month)} · ${page}/${pageCount}`,
        pageWidth-margin,
        pageHeight-3,
        {align:"right"}
      );
    }

    const blob=
      pdf.output("blob");

    await downloadOrShare(
      blob,
      `faturas-${month}-${mode}.pdf`,
      "application/pdf"
    );

  }catch(error){

    console.error(error);

    alert(
      "Não foi possível criar o PDF."
    );

  }finally{

    button.disabled=false;
    button.textContent=
      originalText;
  }
}

/* =========================================================
   CSV
========================================================= */

async function exportCSV(
  invoices,
  month
){

  const selected=invoices.filter(
    invoice=>
      (invoice.month||"sem-data")
      ===month
  );

  const rows=[
    [
      "Data",
      "Fornecedor",
      "NIF",
      "Documento",
      "Categoria",
      "IVA",
      "Total",
      "Viatura",
      "KM",
      "Projeto",
      "Notas"
    ].join(";")
  ];

  const quote=value=>
    `"${String(value??"")
      .replace(/"/g,'""')}"`;

  for(const invoice of selected){

    const date=invoice.issuedDate
      ?invoice.issuedDate
        .split("-")
        .reverse()
        .join("/")
      :"";

    rows.push(
      [
        date,
        invoice.supplier,
        invoice.nif,
        invoice.docNumber,
        invoice.category,
        invoice.vat??"",
        invoice.total??"",
        invoice.vehicle,
        invoice.km,
        invoice.project,
        invoice.notes
      ]
      .map(quote)
      .join(";")
    );
  }

  const blob=new Blob(
    [
      "\uFEFF",
      rows.join("\r\n")
    ],
    {
      type:"text/csv;charset=utf-8"
    }
  );

  await downloadOrShare(
    blob,
    `faturas-${month}.csv`,
    "text/csv"
  );
}

/* =========================================================
   DOWNLOAD / PARTILHA
========================================================= */

async function downloadOrShare(
  blob,
  filename,
  type
){

  const file=new File(
    [blob],
    filename,
    {type}
  );

  if(
    navigator.canShare &&
    navigator.canShare({
      files:[file]
    })
  ){

    try{

      await navigator.share({
        files:[file],
        title:filename
      });

      return;

    }catch(error){

      if(
        error.name==="AbortError"
      ){
        return;
      }
    }
  }

  const url=
    URL.createObjectURL(blob);

  const anchor=
    document.createElement("a");

  anchor.href=url;
  anchor.download=filename;

  document.body.append(anchor);

  anchor.click();

  anchor.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );
}
