  function luma(r, g, b) {

        for (let dy = -r; dy <= r && !on; dy++) {
          const yy = y + dy;
          if (yy < 0 || yy >= h) continue;
          const row = yy * w;
          for (let dx = -r; dx <= r; dx++) {
            const xx = x + dx;
            if (xx < 0 || xx >= w) continue;
            if (src[row + xx]) {
              on = 1;
              break;
            }

        dst[y * w + x] = on;
      }

  }

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let on = 1;
        for (let dy = -r; dy <= r && on; dy++) {
          const yy = y + dy;
          if (yy < 0 || yy >= h) {
            on = 0;
            break;

          for (let dx = -r; dx <= r; dx++) {
            const xx = x + dx;

      seen[start] = 1;

.ft-btn:disabled { opacity: 0.55; }
.ft-btn.secondary { background: #fff; color: #111; border: 1px solid #cfcfd2; }
.ft-btn.ghost { background: transparent; color: #111; border: 1px solid #cfcfd2; min-height: 44px; }
.ft-btn.danger { background: #111; }
.ft-row { display: flex; gap: 8px; }
.ft-row > * { flex: 1; }
.ft-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.94); border-top: 1px solid #e4e4e6; backdrop-filter: blur(10px); z-index: 5; }
.ft-nav button { flex: 1; min-height: 48px; border-radius: 12px; border: 0; background: transparent; color: #58595B; font-weight: 700; }
.ft-nav button[aria-current="page"] { background: #111; color: #fff; }
.ft-cam { position: fixed; inset: 0; background: #000; z-index: 20; display: flex; flex-direction: column; }
.ft-cam video { flex: 1; width: 100%; object-fit: cover; background: #000; }
.ft-cam-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px calc(18px + env(safe-area-inset-bottom)); background: #111; }
.ft-shutter { width: 68px; height: 68px; border-radius: 50%; border: 4px solid #fff; background: #EB0A1E; padding: 0; }
.ft-cam-bar button.link { background: none; border: 0; color: #fff; min-height: 48px; min-width: 72px; font-weight: 700; }
.ft-scan { width: 100%; height: auto; border-radius: 12px; background: #fff; border: 1px solid #e4e4e6; display: block; }
.ft label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #58595B; }
.ft input, .ft select, .ft textarea { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid #d0d0d3; background: #fff; padding: 10px 12px; font-weight: 600; color: #111; }
.ft textarea { min-height: 120px; font-weight: 500; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.ft-warn { background: #fff4f4; border: 1px solid #f3b7bd; color: #111; border-radius: 12px; padding: 10px 12px; margin: 0; }
.ft-month { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ft-month h2 { margin: 0; font-size: 20px; letter-spacing: -0.03em; }
.ft-sum { margin: 0; font-size: 18px; font-weight: 800; color: #EB0A1E; }
.ft-sub { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.ft-item { display: grid; grid-template-columns: 72px 1fr; gap: 10px; padding-top: 10px; border-top: 1px solid #eee; }
.ft-item img { width: 72px; height: 96px; object-fit: cover; border-radius: 8px; background: #fff; border: 1px solid #e4e4e6; }
.ft-item h3 { margin: 0; font-size: 16px; }
.ft-item p { margin: 2px 0 0; }
.ft-status { min-height: 1.2em; }
.ft-hidden { display: none !important; }
.ft-pdf-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; margin-top: 10px; }
.ft-pdf-controls label { font-size: 12px; }
.ft-pdf-controls select { min-height: 46px; }
 .ft-trim { display:grid; gap:8px; margin-top:10px; }
.ft-trim-row { display:grid; grid-template-columns: 72px 1fr 52px; gap:8px; align-items:center; font-size:12px; }
.ft-trim-row input[type=range] { width:100%; min-height:36px; accent-color:#EB0A1E; }
.ft-trim-row output { text-align:right; font-variant-numeric:tabular-nums; }
.ft-trim-help { margin:4px 0 0; font-size:12px; color:#666; }
`;
  function logo() {
    return '<svg class="ft-logo" viewBox="0 0 86 56" aria-hidden="true"><g fill="none" stroke="#EB0A1E" stroke-width="5"><ellipse cx="30" cy="28" rx="22" ry="13" transform="rotate(-52 30 28)"/><ellipse cx="43" cy="28" rx="22" ry="13"/><ellipse cx="56" cy="28" rx="22" ry="13" transform="rotate(52 56 28)"/></g></svg>';
  }
  function ensureStyle() {
    if (document.getElementById("ft-style")) return;
    const style = document.createElement("style");
    style.id = "ft-style";
    style.textContent = CSS;
    document.head.appendChild(style);
  }
  function el(tag, attrs, html) {
    const node = document.createElement(tag);
    for (const pair of Object.entries(attrs || {})) node.setAttribute(pair[0], pair[1]);
    if (html != null) node.innerHTML = html;
    return node;
  }
  function limitCanvas(src, maxSide) {
    const scale = Math.min(1, maxSide / Math.max(src.width, src.height));
    if (scale === 1) return src;
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(src.width * scale));
    c.height = Math.max(1, Math.round(src.height * scale));
    const ctx = c.getContext("2d");
    if (!ctx) return src;
    ctx.drawImage(src, 0, 0, c.width, c.height);
    return c;
  }
  function renderScan(src, rect) {
    // Mantém exatamente a resolução do recorte. Não aplica filtro, contraste
    // nem redução de tamanho. O PNG preserva os pixels do canvas.
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(rect.w));
    c.height = Math.max(1, Math.round(rect.h));
    const ctx = c.getContext("2d");
    if (!ctx) return c;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, rect.x, rect.y, rect.w, rect.h, 0, 0, c.width, c.height);
    return c;
  }
  async function canvasFromFile(file) {
    if (!file || !file.type?.startsWith("image/")) throw new Error("formato");
    // Safari/iPhone pode não aceitar o segundo argumento de createImageBitmap.
    // Primeiro tentamos a versão simples, depois o decoder nativo via <img>.
    let bmp = null;
    try {
      if (typeof createImageBitmap === "function") {
        try {
          bmp = await createImageBitmap(file);
        } catch {
          bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
        }
      }
    } catch {}

    if (bmp) {
      const c = document.createElement("canvas");
      c.width = bmp.width;
      c.height = bmp.height;
      const ctx = c.getContext("2d", { alpha: false });
      if (!ctx) { bmp.close?.(); throw new Error("canvas"); }
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(bmp, 0, 0);
      bmp.close?.();
      return c;
    }

    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("imagem"));
        image.src = url;
      });
      const w = img.naturalWidth || img.width;
      const h = img.naturalHeight || img.height;
      if (!w || !h) throw new Error("dimensao");
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      const ctx = c.getContext("2d", { alpha: false });
      if (!ctx) throw new Error("canvas");
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, 0, 0, w, h);
      return c;
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => {
      // PNG: sem compressão com perdas. A fotografia é apenas recortada.
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("sem imagem")), "image/png");
    });
  }
  function mountFaturas(root2) {
    ensureStyle();
    root2.replaceChildren();
    root2.className = "ft";
    const header = el("header", { class: "ft-top" });
    header.innerHTML = logo() + '<div><p class="ft-kicker">PELA TCAP</p><h1>Faturas</h1></div>';
    const main = el("main", { class: "ft-main" });
    const nav = el("nav", { class: "ft-nav" });
    nav.innerHTML = '<button type="button" data-tab="nova">Nova</button><button type="button" data-tab="arquivo">Arquivo</button>';
    const fileCam = el("input", { type: "file", accept: "image/jpeg,image/png,image/webp,image/*", capture: "environment", class: "ft-hidden", "aria-label": "Fotografar talão" });
    const fileLib = el("input", { type: "file", accept: "image/jpeg,image/png,image/webp,image/*", class: "ft-hidden", "aria-label": "Escolher da galeria" });
    const fileBatch = el("input", { type: "file", accept: "image/jpeg,image/png,image/webp,image/*", multiple: "true", class: "ft-hidden", "aria-label": "Escolher várias faturas" });
    root2.append(header, main, nav, fileCam, fileLib, fileBatch);
    let source = null;
    let rect = null;
    let cropFailed = false;
    let scan = null;
    let busy = false;
    let reading = false;
    let ocrToken = 0;
    const urls = [];
    const revoke = () => {
      for (const u of urls) URL.revokeObjectURL(u);
      urls.length = 0;

    const setTab = (next) => {
      for (const btn of nav.querySelectorAll("button")) {

    function showHome() {
      setTab("nova");
      nav.classList.remove("ft-hidden");
      main.replaceChildren();
      const card = el("section", { class: "ft-card" });
      card.innerHTML = '<h2 class="ft-lead">A foto fica como a câmara a viu.</h2><p class="ft-muted">Sem filtro. Sem ficar preta. Só corta à volta da folha, com os mesmos pixels.</p><ol class="ft-steps"><li><span class="ft-num">1</span><span>Fotografa com a câmara traseira.</span></li><li><span class="ft-num">2</span><span>Confirma a data de emissão e o total. Se não ler, escreve tu.</span></li><li><span class="ft-num">3</span><span>No arquivo, exporta o PDF do mês.</span></li></ol>';
      const shoot = el("button", { class: "ft-btn", type: "button" });
      shoot.textContent = "Fotografar talão";
      const gallery = el("button", { class: "ft-btn secondary", type: "button" });
      gallery.textContent = "Escolher da galeria";
      const batch = el("button", { class: "ft-btn secondary", type: "button" });
      batch.textContent = "Importar várias faturas";
      // Usa o seletor nativo de fotografia do sistema: funciona em Safari/iPhone
      // e Chrome/Android sem depender de getUserMedia ou de permissões WebRTC.
      shoot.addEventListener("click", () => fileCam.click());
      gallery.addEventListener("click", () => fileLib.click());
      batch.addEventListener("click", () => fileBatch.click());
      main.append(card, shoot, gallery, batch);
    }
    // A fotografia é aberta pelo input file com capture="environment".
    // Isto é deliberado: é a opção mais compatível entre iPhone/iPad e Android.
    async function beginReview(full) {
      source = full;
      ocrToken++;
      const myToken = ocrToken;
      reading = false;

      const ctx = full.getContext("2d", { willReadFrequently: true });
      const data = ctx?.getImageData(0, 0, full.width, full.height);
      const found = data ? findPage(data.data, full.width, full.height) : null;

      cropFailed = !found;
      rect = found ?? { x: 0, y: 0, w: full.width, h: full.height };
      scan = renderScan(full, rect);

      setTab("nova");
      nav.classList.remove("ft-hidden");
      paintReview();
      void runOcr(myToken);
    }
    function paintReview() {
      if (!scan || !rect || !source) return;
      main.replaceChildren();
      const figure = el("section", { class: "ft-card" });
      const view = el("canvas", { class: "ft-scan" });
      view.width = scan.width;
      view.height = scan.height;
      view.getContext("2d")?.drawImage(scan, 0, 0);
      const tools = el("div", { class: "ft-row" });
      const tighter = el("button", { class: "ft-btn ghost", type: "button" });
      tighter.textContent = "Apertar bordas";
      const wider = el("button", { class: "ft-btn ghost", type: "button" });
      wider.textContent = "Alargar bordas";
      const whole = el("button", { class: "ft-btn ghost", type: "button" });
      whole.textContent = "Usar foto inteira";
      tools.append(tighter, wider);
      const trim = el("div", { class: "ft-trim" });
      const makeRange = (label, value, min, max, axis) => {
        const row = el("label", { class: "ft-trim-row" });
        const title = el("span", {}); title.textContent = label;
        const input = el("input", { type: "range", min: String(min), max: String(max), step: "1", value: String(value) });
        const out = el("output", {}); out.textContent = value + "px";
        input.addEventListener("input", () => {
          out.textContent = input.value + "px";
          const n = Number(input.value);
          if (axis === "x1") rect.x = Math.min(n, rect.x + rect.w - 24);
          if (axis === "y1") rect.y = Math.min(n, rect.y + rect.h - 24);
          if (axis === "x2") { const right = Math.max(n, rect.x + 24); rect.w = Math.min(source.width - rect.x, right - rect.x); }
          if (axis === "y2") { const bottom = Math.max(n, rect.y + 24); rect.h = Math.min(source.height - rect.y, bottom - rect.y); }
          cropFailed = false; apply();
        });
        row.append(title, input, out); trim.append(row);
        return input;
      };
      makeRange("Esquerda", Math.round(rect.x), 0, Math.max(1, Math.floor(source.width - 24)), "x1");
      makeRange("Topo", Math.round(rect.y), 0, Math.max(1, Math.floor(source.height - 24)), "y1");
      makeRange("Direita", Math.round(rect.x + rect.w), 24, Math.max(24, source.width), "x2");
      makeRange("Fundo", Math.round(rect.y + rect.h), 24, Math.max(24, source.height), "y2");
      const trimHelp = el("p", { class: "ft-trim-help" });
      trimHelp.textContent = "Arrasta as 4 barras até a borda da folha. A imagem não recebe filtros nem fica preta.";
      figure.append(view, tools, whole, trim, trimHelp);
      if (cropFailed) {
        const warn = el("p", { class: "ft-warn" });
        warn.textContent = "Não isolei o talão com segurança. Está a foto inteira — aperta ou alarga as bordas se precisares.";
        figure.append(warn);
      }
      const again = el("button", { class: "ft-btn secondary", type: "button" });
      again.textContent = "Repetir foto";
      const form = el("section", { class: "ft-card" });
      form.innerHTML = '<p class="ft-status ft-muted" data-status>A preparar a leitura…</p><label>Data de emissão<input data-date type="date" inputmode="numeric" /></label><p class="ft-muted" data-date-hint>Tem de ser a data impressa no talão, não a de hoje.</p><label>Total pago (€)<input data-total inputmode="decimal" placeholder="ex.: 6,69" autocomplete="off" /></label><label>Categoria<select data-cat>' + CATEGORIES.map((c) => "<option" + (c === "Outros" ? " selected" : "") + ">" + c + "</option>").join("") + '</select></label><label>Notas<input data-notes maxlength="180" placeholder="opcional" /></label><label>Texto lido<textarea data-ocr readonly placeholder="O texto cru do OCR aparece aqui."></textarea></label>';
      const reread = el("button", { class: "ft-btn secondary", type: "button" });
      reread.textContent = "Ler outra vez";
      const save = el("button", { class: "ft-btn", type: "button" });
      save.textContent = "Guardar no telemóvel";
      main.append(figure, again, form, reread, save);
      const apply = () => {
        if (!source || !rect) return;
        scan = renderScan(source, rect);
        view.width = scan.width;
        view.height = scan.height;
        view.getContext("2d")?.drawImage(scan, 0, 0);
      };
      tighter.addEventListener("click", () => {
        if (!source || !rect) return;
        rect = shrinkRect(rect, source.width, source.height, 0.04);
        cropFailed = false;
        apply();
      });
      wider.addEventListener("click", () => {
        if (!source || !rect) return;
        rect = expandRect(rect, source.width, source.height, 0.06);
        apply();
      });
      whole.addEventListener("click", () => {
        if (!source) return;
        rect = { x: 0, y: 0, w: source.width, h: source.height };
        cropFailed = false;
        apply();
      });
      again.addEventListener("click", () => fileCam.click());
      reread.addEventListener("click", () => {
        if (reading) return;
        const f = reviewFields();
        if (f.date) f.date.value = "";
        if (f.total) f.total.value = "";
        if (f.ocr) f.ocr.value = "";
        ocrToken++;
        reading = false;
        void runOcr(ocrToken);
      });
      save.addEventListener("click", () => void onSave());
    }
    function reviewFields() {
      return {
        status: main.querySelector("[data-status]"),
        date: main.querySelector("[data-date]"),
        dateHint: main.querySelector("[data-date-hint]"),
        total: main.querySelector("[data-total]"),
        cat: main.querySelector("[data-cat]"),
        notes: main.querySelector("[data-notes]"),
        ocr: main.querySelector("[data-ocr]")
      };
    }
    async function runOcr(token = ocrToken) {
      if (!scan || reading) return;
      reading = true;
      const fields = reviewFields();
      const setStatus = (s) => {
        if (token !== ocrToken) return;
        if (fields.status) fields.status.textContent = s;
      };

      try {
        const text = await readReceipt(limitCanvas(scan, 1800), setStatus);
        if (token !== ocrToken) return;

        if (fields.ocr) fields.ocr.value = text.trim();

        const date = parseEmissionDate(text);
        const total = parseTotal(text);
        const cat = categorize(text);

        if (date && fields.date && !fields.date.value) {
          fields.date.value = date.iso;
          if (fields.dateHint) {
            fields.dateHint.textContent = "Lida no talão: " + date.display;
          }
        } else if (!date && fields.dateHint) {
          fields.dateHint.textContent =
            "Não li a data de emissão. Preenche à mão — não uso a data de hoje.";
        }

        if (total && fields.total && !fields.total.value) {
          fields.total.value = total.euros.toLocaleString("pt-PT", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });
        }

        if (fields.cat && cat !== "Outros") fields.cat.value = cat;

        setStatus(
          [
            date ? "Data " + date.display : "Data não lida",
            total ? "Total " + formatEuros(total.euros) : "Total não lido",
            cat
          ].join(" · ") + ". Confirma antes de guardar."
        );
      } catch (err) {
        if (token !== ocrToken) return;
        setStatus("Não consegui ler o talão. Preenche a data e o total à mão — não invento valores.");
      } finally {
        if (token === ocrToken) reading = false;
      }
    }
    async function onSave() {
      if (busy || !scan) return;
      const fields = reviewFields();
      const iso = fields.date?.value ?? "";
      const issuedDate = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso : null;
      const total = parseUserTotal(fields.total?.value ?? "");
      if ((fields.total?.value ?? "").trim() && total == null) {
        if (fields.status) fields.status.textContent = "Total inválido. Usa 6,69 ou deixa vazio.";
        return;
      }
      busy = true;
      try {
        await saveFatura({
          id: crypto.randomUUID(),
          createdAt: Date.now(),
          issuedDate,
          month: monthKeyFromIso(issuedDate),
          category: fields.cat?.value || "Outros",
          total,
          notes: fields.notes?.value.trim() ?? "",
          ocrText: fields.ocr?.value ?? "",
          // Guarda a imagem que está no ecrã de revisão, já recortada.
          cropApplied: true,
          image: await canvasToBlob(scan)
        });
        source = null;
        scan = null;
        rect = null;
        await showArchive();
      } catch {
        if (fields.status) fields.status.textContent = "Não consegui guardar no telemóvel. Tenta outra vez.";
      } finally {
        busy = false;
      }
    }
    async function showArchive() {
      setTab("arquivo");
      nav.classList.remove("ft-hidden");
      revoke();
      main.replaceChildren();
      let rows = [];
      try {
        rows = await listFaturas();
      } catch {
        const p = el("p", { class: "ft-warn" });
        p.textContent = "Não consegui abrir o arquivo neste browser.";
        main.append(p);
        return;
      }
      if (!rows.length) {
        const card = el("section", { class: "ft-card" });
        card.innerHTML = '<h2 class="ft-lead">Ainda não há faturas.</h2><p class="ft-muted">Fotografa um talão. Fica só neste iPhone, sem conta.</p>';
        main.append(card);
        return;
      }
      const groups = new Map();
      for (const row of rows) {
        const key = row.month || "sem-data";
        const list = groups.get(key) ?? [];
        list.push(row);
        groups.set(key, list);
      }
      const keys = [...groups.keys()].sort((a, b) => {
        if (a === "sem-data") return 1;
        if (b === "sem-data") return -1;
        return a < b ? 1 : -1;
      });
      for (const key of keys) {
        const items = groups.get(key) ?? [];
        const card = el("section", { class: "ft-card" });
        const sums = new Map();
        let grand = 0;
        for (const item of items) {
          if (item.total == null) continue;
          sums.set(item.category, (sums.get(item.category) ?? 0) + item.total);
          grand += item.total;
        }
        const head = el("div", { class: "ft-month" });
        head.innerHTML = "<div><h2>" + formatMonthKey(key) + '</h2><p class="ft-muted">Total gasto no mês</p></div><p class="ft-sum">' + formatEuros(grand) + "</p>";
        card.append(head);
        for (const cat of CATEGORIES) {
          if (!sums.has(cat)) continue;
          const line = el("div", { class: "ft-sub" });
          line.innerHTML = "<span>" + cat + "</span><strong>" + formatEuros(sums.get(cat) ?? 0) + "</strong>";
          card.append(line);
        }
        const pdfControls = el("div", { class: "ft-pdf-controls" });
        const pdfLabel = el("label", {});
        pdfLabel.textContent = "Faturas por página";
        const pdfSelect = el("select", { "data-per-page": key });
        pdfSelect.innerHTML = '<option value="1">1 — maior</option><option value="2">2</option><option value="4" selected>4 — recomendado</option><option value="6">6 — poupa mais papel</option>';
        pdfLabel.append(pdfSelect);
        const pdfBtn = el("button", { class: "ft-btn", type: "button" });
        pdfBtn.textContent = "Imprimir / PDF";
        pdfBtn.addEventListener("click", () => {
          const count = Number(pdfSelect.value) || 4;
          pdfBtn.disabled = true;
          pdfBtn.textContent = "A criar PDF…";
          void exportMonthPdf(key, items, count).catch(() => {
            pdfBtn.textContent = "Falhou. Tentar outra vez";
          }).finally(() => {
            pdfBtn.disabled = false;
            if (pdfBtn.textContent === "A criar PDF…") pdfBtn.textContent = "Imprimir / PDF";
          });
        });
        pdfControls.append(pdfLabel, pdfBtn);
        card.append(pdfControls);
        for (const item of items) {
          const url = URL.createObjectURL(item.image);
          urls.push(url);
          const box = el("article", { class: "ft-item" });
          const when = item.issuedDate ? item.issuedDate.split("-").reverse().join("/") : "Sem data";
          box.innerHTML = '<img alt="Talão" src="' + url + '" /><div><h3>' + when + "</h3><p>" + item.category + " · " + formatEuros(item.total) + "</p>" + (item.notes ? '<p class="ft-muted">' + escapeHtml(item.notes) + "</p>" : "") + '<div class="ft-row" style="margin-top:8px"><button type="button" class="ft-btn ghost" data-edit="' + item.id + '">Corrigir</button><button type="button" class="ft-btn danger" data-del="' + item.id + '">Apagar</button></div></div>';
          card.append(box);
        }
        main.append(card);
      }
      main.querySelectorAll("[data-del]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del");
          if (!id || !confirm("Apagar esta fatura deste iPhone?")) return;
          void deleteFatura(id).then(() => showArchive());
        });
      });
      main.querySelectorAll("[data-edit]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-edit");
          const item = rows.find((r) => r.id === id);
          if (item) openEdit(item);
        });
      });
    }
    function openEdit(item) {
      main.replaceChildren();
      const card = el("section", { class: "ft-card" });
      const url = URL.createObjectURL(item.image);
      urls.push(url);
      const totalValue = item.total == null ? "" : item.total.toLocaleString("pt-PT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      card.innerHTML = '<img class="ft-scan" alt="Talão" src="' + url + '" /><label>Data de emissão<input data-date type="date" value="' + (item.issuedDate ?? "") + '" /></label><label>Total pago (€)<input data-total inputmode="decimal" value="' + totalValue + '" /></label><label>Categoria<select data-cat>' + CATEGORIES.map((c) => "<option " + (c === item.category ? "selected" : "") + ">" + c + "</option>").join("") + '</select></label><label>Notas<input data-notes maxlength="180" value="' + escapeAttr(item.notes) + '" /></label><label>Texto lido<textarea readonly>' + escapeHtml(item.ocrText) + "</textarea></label>";
      const save = el("button", { class: "ft-btn", type: "button" });
      save.textContent = "Atualizar";
      const back = el("button", { class: "ft-btn secondary", type: "button" });
      back.textContent = "Voltar ao arquivo";
      const status = el("p", { class: "ft-muted" });
      main.append(card, save, back, status);
      back.addEventListener("click", () => void showArchive());
      save.addEventListener("click", () => {
        const date = card.querySelector("[data-date]").value;
        const totalRaw = card.querySelector("[data-total]").value;
        const total = parseUserTotal(totalRaw);
        if (totalRaw.trim() && total == null) {
          status.textContent = "Total inválido. Usa 6,69 ou deixa vazio.";
          return;
        }
        const issuedDate = /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : null;
        void saveFatura({
          ...item,
          issuedDate,
          month: monthKeyFromIso(issuedDate),
          total,
          category: card.querySelector("[data-cat]").value,
          notes: card.querySelector("[data-notes]").value.trim()
        }).then(() => showArchive()).catch(() => {
          status.textContent = "Não consegui atualizar.";
        });
      });
    }
    async function processBatch(files) {
      if (!files?.length) return;
      nav.classList.add("ft-hidden");
      main.replaceChildren();
      const card = el("section", { class: "ft-card" });
      card.innerHTML = '<h2 class="ft-lead">A importar faturas…</h2><p class="ft-muted" data-batch-status>0 de ' + files.length + ' processadas.</p><div class="ft-status" data-batch-list></div>';
      main.append(card);
      const list = card.querySelector("[data-batch-list]");
      let ok = 0, failed = 0, missingDate = 0;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const line = el("p", { class: "ft-muted" });
        line.textContent = (i + 1) + "/" + files.length + " — " + file.name + " — a ler…";
        list.append(line);
        try {
          const full = await canvasFromFile(file);
          const ctx = full.getContext("2d", { willReadFrequently: true });
          const pixels = ctx?.getImageData(0, 0, full.width, full.height);
          const found = pixels ? findPage(pixels.data, full.width, full.height) : null;
          const r = found ?? { x: 0, y: 0, w: full.width, h: full.height };
          const cropped = renderScan(full, r);
          const text = await readReceipt(limitCanvas(cropped, 1800), (msg) => { line.textContent = (i + 1) + "/" + files.length + " — " + file.name + " — " + msg; });
          const date = parseEmissionDate(text);
          const total = parseTotal(text);
          const category = categorize(text);
          await saveFatura({
            id: crypto.randomUUID(), createdAt: Date.now(),
            issuedDate: date?.iso ?? null,
            month: monthKeyFromIso(date?.iso ?? null),
            category: category || "Outros", total: total?.euros ?? null,
            notes: "Importada automaticamente", ocrText: text,
            cropApplied: true, image: await canvasToBlob(cropped)
          });
          ok++;
          if (!date) missingDate++;
          line.textContent = (i + 1) + "/" + files.length + " — " + file.name + " — " + (date ? date.display : "data por confirmar") + " · " + (total ? formatEuros(total.euros) : "total por confirmar") + " · " + category;
        } catch (err) {
          failed++;
          line.textContent = (i + 1) + "/" + files.length + " — " + file.name + " — não foi possível processar";
        }
        const status = card.querySelector("[data-batch-status]");
        if (status) status.textContent = ok + " guardadas · " + failed + " falharam · " + missingDate + " sem data para rever.";
      }
      const done = el("button", { class: "ft-btn", type: "button" });
      done.textContent = "Abrir arquivo";
      done.addEventListener("click", () => void showArchive());
      main.append(done);
    }
    nav.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button");
      const next = btn?.getAttribute("data-tab");
      if (next === "nova") showHome();
      if (next === "arquivo") void showArchive();
    });
    fileCam.addEventListener("change", () => {
      const file = fileCam.files?.[0];
      fileCam.value = "";
      if (file) void canvasFromFile(file).then((c) => beginReview(c)).catch((err) => alert(err?.message === "formato" ? "Escolhe uma fotografia JPG, PNG ou WebP." : "Não consegui abrir essa imagem. Tenta uma fotografia JPG ou PNG."));
    });
    fileLib.addEventListener("change", () => {
      const file = fileLib.files?.[0];
      fileLib.value = "";
      if (file) void canvasFromFile(file).then((c) => beginReview(c)).catch((err) => alert(err?.message === "formato" ? "Escolhe uma fotografia JPG, PNG ou WebP." : "Não consegui abrir essa imagem. Tenta uma fotografia JPG ou PNG."));
    });
    fileBatch.addEventListener("change", () => {
      const files = [...(fileBatch.files || [])];
      fileBatch.value = "";
      if (files.length) void processBatch(files);
    });
    showHome();
  }
  function escapeHtml(s) {
    return s.replace(/\u0026/g, "&amp;").replace(/\u003c/g, "&lt;").replace(/\u003e/g, "&gt;");
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/\u0022/g, "&quot;");
  }
  var root = document.getElementById("app");
  if (root) mountFaturas(root);
})();
</script>
</body>
</html>
