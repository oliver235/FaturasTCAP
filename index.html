  /* =========================================================
     UTILITÁRIOS
  ========================================================= */

  function ensureStyle() {
    if (document.getElementById("ft-style")) return;

    const style = document.createElement("style");
    style.id = "ft-style";
    style.textContent = CSS;
    document.head.appendChild(style);
  }

  function el(tag, attrs = {}, html = null) {
    const node = document.createElement(tag);

    for (const [key, value] of Object.entries(attrs)) {
      node.setAttribute(key, value);
    }

    if (html !== null) {
      node.innerHTML = html;
    }

    return node;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function escapeAttr(value) {
    return escapeHtml(value)
      .replace(/"/g, "&quot;");
  }

  function fold(s) {
    return String(s ?? "")
      .normalize("NFD")
      .replace(/\p{M}/gu, "")
      .toLowerCase();
  }

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function formatEuros(value) {
    if (value == null || !Number.isFinite(value)) {
      return "—";
    }

    return value.toLocaleString("pt-PT", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + " €";
  }

  function monthKeyFromIso(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
      return "sem-data";
    }

    return iso.slice(0, 7);
  }

  function formatMonthKey(key) {
    if (key === "sem-data") {
      return "Sem data";
    }

    const parts = key.split("-");
    const month = MONTH_LABELS[Number(parts[1]) - 1];

    return month
      ? month + " " + parts[0]
      : key;
  }

  /* =========================================================
     IMAGEM
  ========================================================= */

  function limitCanvas(src, maxSide) {
    const scale =
      Math.min(1, maxSide / Math.max(src.width, src.height));

    if (scale === 1) {
      return src;
    }

    const c = document.createElement("canvas");

    c.width = Math.max(
      1,
      Math.round(src.width * scale)
    );

    c.height = Math.max(
      1,
      Math.round(src.height * scale)
    );

    const ctx = c.getContext("2d");

    if (!ctx) {
      return src;
    }

    ctx.drawImage(
      src,
      0,
      0,
      c.width,
      c.height
    );

    return c;
  }

  function renderScan(src, rect) {
    /*
      IMPORTANTE:
      Aqui apenas recortamos a fotografia.
      Não aplicamos filtro, preto/branco ou contraste.
    */

    const c = document.createElement("canvas");

    c.width = Math.max(
      1,
      Math.round(rect.w)
    );

    c.height = Math.max(
      1,
      Math.round(rect.h)
    );

    const ctx = c.getContext("2d", {
      alpha: false
    });

    if (!ctx) {
      return c;
    }

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    ctx.drawImage(
      src,
      rect.x,
      rect.y,
      rect.w,
      rect.h,
      0,
      0,
      c.width,
      c.height
    );

    return c;
  }

  /*
    NOVO:
    Guardamos JPEG de alta qualidade em vez de PNG.
    Isto reduz bastante o tamanho e é muito mais compatível
    com iPhone/Safari + IndexedDB.
  */

  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => {

      if (
        !canvas ||
        !canvas.width ||
        !canvas.height
      ) {
        reject(new Error("canvas inválido"));
        return;
      }

      canvas.toBlob(
        blob => {

          if (!blob) {
            reject(new Error("não foi possível criar a imagem"));
            return;
          }

          if (!blob.size) {
            reject(new Error("imagem vazia"));
            return;
          }

          if (!blob.type.startsWith("image/")) {
            reject(new Error("formato de imagem inválido"));
            return;
          }

          resolve(blob);
        },
        "image/jpeg",
        0.94
      );
    });
  }

  async function canvasFromFile(file) {

    if (
      !file ||
      !file.type ||
      !file.type.startsWith("image/")
    ) {
      throw new Error("formato");
    }

    /*
      Primeiro tenta createImageBitmap.
      Se Safari não aceitar, usa <img>.
    */

    if (typeof createImageBitmap === "function") {

      try {

        let bitmap;

        try {
          bitmap = await createImageBitmap(file);
        } catch {
          bitmap = await createImageBitmap(
            file,
            {
              imageOrientation: "from-image"
            }
          );
        }

        const c = document.createElement("canvas");

        c.width = bitmap.width;
        c.height = bitmap.height;

        const ctx = c.getContext("2d", {
          alpha: false
        });

        if (!ctx) {
          bitmap.close?.();
          throw new Error("canvas");
        }

        ctx.drawImage(
          bitmap,
          0,
          0
        );

        bitmap.close?.();

        return c;

      } catch {
        /* Continua para o método <img>. */
      }
    }

    /*
      Fallback compatível com Safari.
    */

    const url = URL.createObjectURL(file);

    try {

      const img = await new Promise(
        (resolve, reject) => {

          const image = new Image();

          image.onload = () => resolve(image);

          image.onerror = () =>
            reject(new Error("imagem"));

          image.src = url;
        }
      );

      const width =
        img.naturalWidth ||
        img.width;

      const height =
        img.naturalHeight ||
        img.height;

      if (!width || !height) {
        throw new Error("dimensao");
      }

      const c = document.createElement("canvas");

      c.width = width;
      c.height = height;

      const ctx = c.getContext("2d", {
        alpha: false
      });

      if (!ctx) {
        throw new Error("canvas");
      }

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );

      return c;

    } finally {

      URL.revokeObjectURL(url);
    }
  }

  /* =========================================================
     DETEÇÃO DA FOLHA
  ========================================================= */

  function clampRect(
    x,
    y,
    w,
    h,
    iw,
    ih
  ) {

    const x0 = Math.max(
      0,
      Math.min(
        iw - 1,
        Math.floor(x)
      )
    );

    const y0 = Math.max(
      0,
      Math.min(
        ih - 1,
        Math.floor(y)
      )
    );

    const x1 = Math.max(
      x0 + 1,
      Math.min(
        iw,
        Math.ceil(x + w)
      )
    );

    const y1 = Math.max(
      y0 + 1,
      Math.min(
        ih,
        Math.ceil(y + h)
      )
    );

    const rw = x1 - x0;
    const rh = y1 - y0;

    if (rw < 8 || rh < 8) {
      return null;
    }

    return {
      x: x0,
      y: y0,
      w: rw,
      h: rh
    };
  }

  function findPage(rgba, width, height) {

    if (
      !rgba ||
      width < 40 ||
      height < 40
    ) {
      return null;
    }

    /*
      Para fotografias enormes usamos uma versão reduzida
      apenas para detetar as bordas.
    */

    const maxW = 500;

    if (width > maxW) {

      const scale = maxW / width;
      const nh = Math.max(
        1,
        Math.round(height * scale)
      );

      const small =
        document.createElement("canvas");

      small.width = maxW;
      small.height = nh;

      const ctx =
        small.getContext("2d");

      if (!ctx) {
        return null;
      }

      /*
        Reconstrói imagem reduzida a partir do RGBA.
      */

      const source =
        new ImageData(
          new Uint8ClampedArray(rgba),
          width,
          height
        );

      const original =
        document.createElement("canvas");

      original.width = width;
      original.height = height;

      const originalCtx =
        original.getContext("2d");

      if (!originalCtx) {
        return null;
      }

      originalCtx.putImageData(
        source,
        0,
        0
      );

      ctx.drawImage(
        original,
        0,
        0,
        maxW,
        nh
      );

      const reduced =
        ctx.getImageData(
          0,
          0,
          maxW,
          nh
        );

      const found =
        findPage(
          reduced.data,
          maxW,
          nh
        );

      if (!found) {
        return null;
      }

      return clampRect(
        found.x / scale,
        found.y / scale,
        found.w / scale,
        found.h / scale,
        width,
        height
      );
    }

    const gray =
      new Uint8Array(
        width * height
      );

    for (
      let i = 0;
      i < gray.length;
      i++
    ) {

      const o = i * 4;

      gray[i] =
        (
          77 * rgba[o] +
          150 * rgba[o + 1] +
          29 * rgba[o + 2]
        ) >> 8;
    }

    /*
      Estimamos a luminosidade dos cantos.
    */

    const patch =
      Math.max(
        3,
        Math.round(
          Math.min(width, height) * .08
        )
      );

    function cornerMean(
      x0,
      y0,
      x1,
      y1
    ) {

      let sum = 0;
      let count = 0;

      for (
        let y = y0;
        y < y1;
        y++
      ) {

        for (
          let x = x0;
          x < x1;
          x++
        ) {

          sum +=
            gray[y * width + x];

          count++;
        }
      }

      return count
        ? sum / count
        : 0;
    }

    const bg =
      (
        cornerMean(
          0,
          0,
          patch,
          patch
        ) +
        cornerMean(
          width - patch,
          0,
          width,
          patch
        ) +
        cornerMean(
          0,
          height - patch,
          patch,
          height
        ) +
        cornerMean(
          width - patch,
          height - patch,
          width,
          height
        )
      ) / 4;

    /*
      Procura zonas claras.
    */

    const threshold =
      Math.max(
        155,
        Math.min(
          225,
          bg + 22
        )
      );

    const paper =
      new Uint8Array(
        width * height
      );

    for (
      let i = 0;
      i < paper.length;
      i++
    ) {
      paper[i] =
        gray[i] >= threshold
          ? 1
          : 0;
    }

    /*
      Em vez de algoritmos pesados,
      procuramos a maior zona clara interior.
    */

    let minX = width;
    let minY = height;
    let maxX = -1;
    let maxY = -1;
    let count = 0;

    const step =
      Math.max(
        1,
        Math.floor(
          Math.min(width, height) / 300
        )
      );

    for (
      let y = 0;
      y < height;
      y += step
    ) {

      for (
        let x = 0;
        x < width;
        x += step
      ) {

        if (!paper[y * width + x]) {
          continue;
        }

        count++;

        minX =
          Math.min(minX, x);

        minY =
          Math.min(minY, y);

        maxX =
          Math.max(maxX, x);

        maxY =
          Math.max(maxY, y);
      }
    }

    if (count < 50) {
      return null;
    }

    const rw =
      maxX - minX + 1;

    const rh =
      maxY - minY + 1;

    /*
      Se a zona encontrada ocupa quase a fotografia toda,
      preferimos a fotografia inteira.
    */

    if (
      rw < width * .18 ||
      rh < height * .18
    ) {
      return null;
    }

    if (
      rw > width * .995 &&
      rh > height * .995
    ) {
      return null;
    }

    const pad =
      Math.max(
        2,
        Math.round(
          Math.min(width, height) * .01
        )
      );

    return clampRect(
      minX - pad,
      minY - pad,
      rw + pad * 2,
      rh + pad * 2,
      width,
      height
    );
  }

  function expandRect(
    rect,
    iw,
    ih,
    fraction
  ) {

    const dx =
      rect.w * fraction;

    const dy =
      rect.h * fraction;

    return clampRect(
      rect.x - dx,
      rect.y - dy,
      rect.w + dx * 2,
      rect.h + dy * 2,
      iw,
      ih
    ) || rect;
  }

  function shrinkRect(
    rect,
    iw,
    ih,
    fraction
  ) {

    const dx =
      rect.w * fraction;

    const dy =
      rect.h * fraction;

    return clampRect(
      rect.x + dx,
      rect.y + dy,
      rect.w - dx * 2,
      rect.h - dy * 2,
      iw,
      ih
    ) || rect;
  }

  /* =========================================================
     OCR / DATAS
  ========================================================= */

  function validDate(
    year,
    month,
    day
  ) {

    if (
      year < 1990 ||
      year > 2099 ||
      month < 1 ||
      month > 12 ||
      day < 1 ||
      day > 31
    ) {
      return false;
    }

    const d =
      new Date(
        Date.UTC(
          year,
          month - 1,
          day
        )
      );

    return (
      d.getUTCFullYear() === year &&
      d.getUTCMonth() === month - 1 &&
      d.getUTCDate() === day
    );
  }

  function expandYear(year) {

    if (year >= 100) {
      return year;
    }

    return year >= 70
      ? 1900 + year
      : 2000 + year;
  }

  function pushDate(
    list,
    year,
    month,
    day,
    score
  ) {

    year = expandYear(year);

    if (
      !validDate(
        year,
        month,
        day
      )
    ) {
      return;
    }

    const iso =
      year +
      "-" +
      pad(month) +
      "-" +
      pad(day);

    if (
      list.some(
        x => x.iso === iso
      )
    ) {
      return;
    }

    list.push({
      iso,
      display:
        pad(day) +
        "/" +
        pad(month) +
        "/" +
        year,
      score
    });
  }

  function parseEmissionDate(text) {

    if (!text) {
      return null;
    }

    const source =
      fold(text);

    const found = [];

    let m;

    /*
      YYYY-MM-DD
    */

    const ymd =
      /(\d{4})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{1,2})/g;

    while ((m = ymd.exec(source))) {

      pushDate(
        found,
        Number(m[1]),
        Number(m[2]),
        Number(m[3]),
        100
      );
    }

    /*
      DD/MM/YYYY
    */

    const dmy =
      /(\d{1,2})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{2,4})/g;

    while ((m = dmy.exec(source))) {

      const day = Number(m[1]);
      const month = Number(m[2]);
      const year = Number(m[3]);

      pushDate(
        found,
        year,
        month,
        day,
        source.includes("emiss")
          ? 100
          : 70
      );
    }

    /*
      12 de março de 2026
    */

    const written =
      new RegExp(
        "(\\\\d{1,2})\\\\s+de\\\\s+(" +
        Object.keys(MONTHS).join("|") +
        ")\\\\.?\\\\s+de\\\\s+(\\\\d{4})",
        "g"
      );

    while ((m = written.exec(source))) {

      pushDate(
        found,
        Number(m[3]),
        MONTHS[m[2]],
        Number(m[1]),
        105
      );
    }

    /*
      Preferimos datas perto de "emissão".
    */

    found.sort(
      (a, b) =>
        b.score - a.score
    );

    return found[0] || null;
  }

  /* =========================================================
     VALOR
  ========================================================= */

  function parseEuroAmount(value) {

    let text =
      String(value ?? "")
        .replace(/\s/g, "")
        .replace(/€/g, "")
        .replace(/eur/gi, "");

    if (!text) {
      return null;
    }

    /*
      1.234,56
    */

    if (
      /^\d{1,3}(?:\.\d{3})+,\d{1,2}$/
        .test(text)
    ) {

      return Number(
        text
          .replace(/\./g, "")
          .replace(",", ".")
      );
    }

    /*
      1234,56
    */

    if (
      /^\d+,\d{1,2}$/.test(text)
    ) {

      return Number(
        text.replace(",", ".")
      );
    }

    /*
      1234.56
    */

    if (
      /^\d+\.\d{1,2}$/.test(text)
    ) {

      return Number(text);
    }

    /*
      Inteiro.
    */

    if (/^\d+$/.test(text)) {
      return Number(text);
    }

    return null;
  }

  function parseUserTotal(value) {

    const text =
      String(value ?? "")
        .trim()
        .replace(/\s/g, "")
        .replace(/€/g, "")
        .replace(/eur/gi, "");

    if (!text) {
      return null;
    }

    return parseEuroAmount(text);
  }

  function parseTotal(text) {

    if (!text) {
      return null;
    }

    const lines =
      text.split(/\r?\n/);

    const found = [];

    const regex =
      /\b(total\s+a\s+pagar|valor\s+a\s+pagar|total\s+geral|total\s+pago|valor\s+pago|a\s+pagar|importe|montante|total)\b[^\d]{0,20}(\d{1,3}(?:[.,]\d{3})*[.,]\d{1,2}|\d+[.,]\d{1,2}|\d+)/gi;

    for (let i = 0; i < lines.length; i++) {

      const line =
        lines[i];

      let match;

      while ((match = regex.exec(line))) {

        const euros =
          parseEuroAmount(match[2]);

        if (
          euros == null ||
          !Number.isFinite(euros) ||
          euros > 1000000
        ) {
          continue;
        }

        const label =
          fold(match[1]);

        let score = 60;

        if (
          /valor\s+a\s+pagar|total\s+a\s+pagar|total\s+geral/
            .test(label)
        ) {
          score = 120;
        }

        if (
          /valor\s+pago|total\s+pago|a\s+pagar/
            .test(label)
        ) {
          score = 100;
        }

        found.push({
          euros,
          score,
          index: i
        });
      }
    }

    /*
      OCR às vezes devolve:

      TOTAL
      6,69
    */

    if (!found.length) {

      for (let i = 0; i < lines.length - 1; i++) {

        if (
          /\btotal\b|\bpagar\b|\bimporte\b|\bmontante\b/i
            .test(lines[i])
        ) {

          const euros =
            parseEuroAmount(
              lines[i + 1]
            );

          if (
            euros != null &&
            euros >= 0 &&
            euros < 1000000
          ) {

            found.push({
              euros,
              score: 80,
              index: i
            });
          }
        }
      }
    }

    found.sort(
      (a, b) =>
        b.score - a.score ||
        b.index - a.index
    );

    return found[0] || null;
  }

  /* =========================================================
     CATEGORIA
  ========================================================= */

  function categorize(text) {

    const s = fold(text);

    if (
      /\b(galp|repsol|cepsa|prio|gasoleo|gasolina|combustivel|diesel|q8|posto|bp)\b/
        .test(s)
    ) {
      return "Combustível";
    }

    if (
      /\b(hotel|hostel|airbnb|pousada|alojamento|dormida|pensao|ibis|pestana|marriott|booking|resort|campanile)\b/
        .test(s)
    ) {
      return "Estadias";
    }

    if (
      /\b(continente|pingo doce|pingodoce|auchan|lidl|mercadona|minipreco|intermarche|padaria|pastelaria|restaurante|cafe|mcdonald|burger|pizza|supermercado|talho|peixaria|mercearia|aldi|spar)\b/
        .test(s)
    ) {
      return "Alimentação";
    }

    return "Outros";
  }

  /* =========================================================
     TESSERACT
  ========================================================= */

  let workerPromise = null;

  function loadScript(src) {

    return new Promise(
      (resolve, reject) => {

        const old =
          document.querySelector(
            'script[data-ft-src="' +
            src +
            '"]'
          );

        if (old) {

          if (
            old.dataset.loaded === "1"
          ) {
            resolve();
            return;
          }

          old.addEventListener(
            "load",
            resolve,
            { once: true }
          );

          old.addEventListener(
            "error",
            () =>
              reject(
                new Error(
                  "falha ao carregar script"
                )
              ),
            { once: true }
          );

          return;
        }

        const script =
          document.createElement("script");

        script.src = src;
        script.async = true;
        script.dataset.ftSrc = src;

        script.onload = () => {
          script.dataset.loaded = "1";
          resolve();
        };

        script.onerror = () =>
          reject(
            new Error(
              "Não foi possível carregar o leitor."
            )
          );

        document.head.appendChild(script);
      }
    );
  }

  async function makeWorker(
    language,
    onStatus
  ) {

    await loadScript(TESS_SRC);

    if (!window.Tesseract) {
      throw new Error(
        "Tesseract indisponível."
      );
    }

    onStatus(
      language === "por"
        ? "A preparar leitura em português…"
        : "A preparar leitura…"
    );

    const worker =
      await window.Tesseract.createWorker(
        language,
        1,
        {
          workerPath:
            "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",

          corePath:
            "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",

          langPath:
            "https://tessdata.projectnaptha.com/4.0.0",

          logger: message => {

            if (
              message.status ===
                "recognizing text" &&
              typeof message.progress ===
                "number"
            ) {

              onStatus(
                "A ler o talão… " +
                Math.round(
                  message.progress * 100
                ) +
                "%"
              );
            }
          }
        }
      );

    await worker.setParameters({
      tessedit_pageseg_mode: "6",
      preserve_interword_spaces: "1"
    });

    return worker;
  }

  async function getWorker(onStatus) {

    if (!workerPromise) {

      workerPromise =
        makeWorker(
          "por",
          onStatus
        ).catch(() => {

          onStatus(
            "Português indisponível. A tentar inglês…"
          );

          return makeWorker(
            "eng",
            onStatus
          );

        }).catch(error => {

          workerPromise = null;
          throw error;
        });
    }

    return workerPromise;
  }

  function prepareOcrCanvas(
    src
  ) {

    const maxWidth = 1800;

    const factor =
      Math.min(
        1.5,
        maxWidth /
          Math.max(1, src.width)
      );

    const c =
      document.createElement(
        "canvas"
      );

    c.width =
      Math.max(
        1,
        Math.round(
          src.width * factor
        )
      );

    c.height =
      Math.max(
        1,
        Math.round(
          src.height * factor
        )
      );

    const ctx =
      c.getContext("2d");

    if (!ctx) {
      return src;
    }

    ctx.drawImage(
      src,
      0,
      0,
      c.width,
      c.height
    );

    return c;
  }

  async function recognize(
    worker,
    canvas
  ) {

    const result =
      await worker.recognize(
        canvas
      );

    return result?.data?.text || "";
  }

  async function readReceipt(
    canvas,
    onStatus
  ) {

    const worker =
      await getWorker(
        onStatus
      );

    onStatus(
      "A ler o talão…"
    );

    const prepared =
      prepareOcrCanvas(
        limitCanvas(
          canvas,
          1800
        )
      );

    let text =
      await recognize(
        worker,
        prepared
      );

    return text;
  }

  /* =========================================================
     INDEXED DB
  ========================================================= */

  function openDb() {

    return new Promise(
      (resolve, reject) => {

        const request =
          indexedDB.open(
            DB_NAME,
            1
          );

        request.onupgradeneeded =
          () => {

            const db =
              request.result;

            if (
              !db.objectStoreNames
                .contains(STORE)
            ) {

              db.createObjectStore(
                STORE,
                {
                  keyPath: "id"
                }
              );
            }
          };

        request.onsuccess =
          () => resolve(
            request.result
          );

        request.onerror =
          () =>
            reject(
              request.error ||
              new Error(
                "IndexedDB"
              )
            );
      }
    );
  }

  function txDone(tx) {

    return new Promise(
      (resolve, reject) => {

        tx.oncomplete =
          () => resolve();

        tx.onerror =
          () =>
            reject(
              tx.error ||
              new Error(
                "IndexedDB"
              )
            );

        tx.onabort =
          () =>
            reject(
              tx.error ||
              new Error(
                "IndexedDB abortado"
              )
            );
      }
    );
  }

  async function saveFatura(
    fatura
  ) {

    const db =
      await openDb();

    try {

      const tx =
        db.transaction(
          STORE,
          "readwrite"
        );

      tx.objectStore(
        STORE
      ).put(fatura);

      await txDone(tx);

    } finally {

      db.close();
    }
  }

  async function listFaturas() {

    const db =
      await openDb();

    try {

      const tx =
        db.transaction(
          STORE,
          "readonly"
        );

      const request =
        tx.objectStore(
          STORE
        ).getAll();

      const rows =
        await new Promise(
          (resolve, reject) => {

            request.onsuccess =
              () =>
                resolve(
                  request.result || []
                );

            request.onerror =
              () =>
                reject(
                  request.error
                );
          }
        );

      return rows.sort(
        (a, b) =>
          (b.createdAt || 0) -
          (a.createdAt || 0)
      );

    } finally {

      db.close();
    }
  }

  async function deleteFatura(
    id
  ) {

    const db =
      await openDb();

    try {

      const tx =
        db.transaction(
          STORE,
          "readwrite"
        );

      tx.objectStore(
        STORE
      ).delete(id);

      await txDone(tx);

    } finally {

      db.close();
    }
  }

  /* =========================================================
     PDF
  ========================================================= */

  async function exportMonthPdf(
    month,
    items,
    perPage
  ) {

    await loadScript(
      PDF_SRC
    );

    const JsPDF =
      window.jspdf?.jsPDF;

    if (!JsPDF) {
      throw new Error(
        "PDF indisponível."
      );
    }

    const count =
      [1, 2, 4, 6].includes(
        Number(perPage)
      )
        ? Number(perPage)
        : 4;

    const doc =
      new JsPDF({
        unit: "mm",
        format: "a4",
        orientation: "portrait"
      });

    const pageW =
      doc.internal.pageSize.getWidth();

    const pageH =
      doc.internal.pageSize.getHeight();

    const margin = 8;
    const gap = 4;
    const headerH = 13;

    const usableW =
      pageW - margin * 2;

    const usableH =
      pageH -
      margin * 2 -
      headerH;

    const cols =
      count === 1
        ? 1
        : 2;

    const rows =
      count === 1
        ? 1
        : count === 2
          ? 2
          : count === 4
            ? 2
            : 3;

    const cellW =
      (
        usableW -
        gap * (cols - 1)
      ) / cols;

    const cellH =
      (
        usableH -
        gap * (rows - 1)
      ) / rows;

    const sorted =
      items.slice().sort(
        (a, b) =>
          String(a.issuedDate || "")
            .localeCompare(
              String(b.issuedDate || "")
            )
      );

    function header() {

      doc.setFillColor(
        17,
        17,
        17
      );

      doc.rect(
        0,
        0,
        pageW,
        headerH,
        "F"
      );

      doc.setTextColor(
        255,
        255,
        255
      );

      doc.setFont(
        "helvetica",
        "bold"
      );

      doc.setFontSize(9);

      doc.text(
        "Faturas pela TCAP",
        margin,
        8.5
      );

      doc.setFont(
        "helvetica",
        "normal"
      );

      doc.text(
        formatMonthKey(month) +
        " · " +
        count +
        " por página",
        pageW - margin,
        8.5,
        {
          align: "right"
        }
      );

      doc.setTextColor(
        17,
        17,
        17
      );
    }

    for (
      let i = 0;
      i < sorted.length;
      i++
    ) {

      if (i % count === 0) {

        doc.addPage();

        header();
      }

      const slot =
        i % count;

      const col =
        slot % cols;

      const row =
        Math.floor(
          slot / cols
        );

      const x =
        margin +
        col *
          (cellW + gap);

      const y =
        margin +
        headerH +
        row *
          (cellH + gap);

      const item =
        sorted[i];

      /*
        Converte o Blob para data URL.
      */

      const dataUrl =
        await blobToDataUrl(
          item.image
        );

      const size =
        await imageSize(
          dataUrl
        );

      const labelH = 8;

      const maxW =
        cellW;

      const maxH =
        Math.max(
          20,
          cellH - labelH
        );

      const ratio =
        Math.min(
          maxW / size.w,
          maxH / size.h
        );

      const drawW =
        size.w * ratio;

      const drawH =
        size.h * ratio;

      const ix =
        x +
        (cellW - drawW) / 2;

      const iy =
        y +
        (maxH - drawH) / 2;

      doc.setFillColor(
        255,
        255,
        255
      );

      doc.rect(
        x,
        y,
        cellW,
        maxH,
        "F"
      );

      doc.setDrawColor(
        220,
        220,
        220
      );

      doc.rect(
        x,
        y,
        cellW,
        maxH,
        "S"
      );

      /*
        Todas as novas fotos são JPEG.
      */

      doc.addImage(
        dataUrl,
        "JPEG",
        ix,
        iy,
        drawW,
        drawH,
        undefined,
        "FAST"
      );

      const dateText =
        item.issuedDate
          ? item.issuedDate
              .split("-")
              .reverse()
              .join("/")
          : "Sem data";

      const totalText =
        item.total == null
          ? "Sem total"
          : formatEuros(
              item.total
            );

      doc.setFont(
        "helvetica",
        "normal"
      );

      doc.setFontSize(7);

      doc.setTextColor(
        45,
        45,
        45
      );

      doc.text(
        dateText +
        " · " +
        item.category,
        x,
        y + maxH + 5
      );

      doc.text(
        totalText,
        x + cellW,
        y + maxH + 5,
        {
          align: "right"
        }
      );
    }

    if (!sorted.length) {

      doc.addPage();

      header();

      doc.setFontSize(11);

      doc.text(
        "Não existem faturas neste mês.",
        margin,
        margin +
          headerH +
          12
      );
    }

    /*
      Remove primeira página vazia.
    */

    if (
      doc.getNumberOfPages() > 1
    ) {
      doc.deletePage(1);
    }

    const blob =
      doc.output("blob");

    const filename =
      "faturas-" +
      month +
      "-" +
      count +
      "por-pagina.pdf";

    const file =
      new File(
        [blob],
        filename,
        {
          type: "application/pdf"
        }
      );

    if (
      navigator.canShare?.({
        files: [file]
      }) &&
      navigator.share
    ) {

      try {

        await navigator.share({
          files: [file],
          title:
            "Faturas " +
            formatMonthKey(month)
        });

        return;

      } catch (error) {

        if (
          error?.name ===
          "AbortError"
        ) {
          return;
        }
      }
    }

    const url =
      URL.createObjectURL(
        blob
      );

    const a =
      document.createElement("a");

    a.href = url;
    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
      () =>
        URL.revokeObjectURL(url),
      4000
    );
  }

  function blobToDataUrl(blob) {

    return new Promise(
      (resolve, reject) => {

        if (!blob) {
          reject(
            new Error(
              "imagem inexistente"
            )
          );

          return;
        }

        const reader =
          new FileReader();

        reader.onload =
          () =>
            resolve(
              String(
                reader.result
              )
            );

        reader.onerror =
          () =>
            reject(
              reader.error ||
              new Error(
                "imagem"
              )
            );

        reader.readAsDataURL(
          blob
        );
      }
    );
  }

  function imageSize(
    dataUrl
  ) {

    return new Promise(
      (resolve, reject) => {

        const img =
          new Image();

        img.onload =
          () =>
            resolve({
              w:
                img.naturalWidth ||
                img.width,

              h:
                img.naturalHeight ||
                img.height
            });

        img.onerror =
          () =>
            reject(
              new Error(
                "imagem inválida"
              )
            );

        img.src =
          dataUrl;
      }
    );
  }

    async function beginReview(
      full
    ) {

      source = full;

      ocrToken++;

      const token =
        ocrToken;

      reading = false;

      const ctx =
        full.getContext(
          "2d",
          {
            willReadFrequently:
              true
          }
        );

      const pixels =
        ctx
          ? ctx.getImageData(
              0,
              0,
              full.width,
              full.height
            )
          : null;

      const found =
        pixels
          ? findPage(
              pixels.data,
              full.width,
              full.height
            )
          : null;

      cropFailed =
        !found;

      rect =
        found || {
          x: 0,
          y: 0,
          w: full.width,
          h: full.height
        };

      scan =
        renderScan(
          full,
          rect
        );

      paintReview();

      void runOcr(
        token
      );
    }

      ) {

      }

      main.replaceChildren();

      const figure =

          {

      const view =

          }

      view.width =

      view.height =

      view

        ?.drawImage(
          scan,
          0,
          0
        );

      const tools =
        el(
          "div",
          {
            class: "ft-row"
          }
        );

      const tighter =
        el(
          "button",
          {
            class: "ft-btn ghost",
            type: "button"
          }
        );

      tighter.textContent =
        "Apertar bordas";

      const wider =
        el(
          "button",
          {
            class: "ft-btn ghost",
            type: "button"
          }
        );

      wider.textContent =
        "Alargar bordas";

      const whole =
        el(
          "button",
          {
            class: "ft-btn ghost",
            type: "button"
          }
        );

      whole.textContent =
        "Usar foto inteira";

      tools.append(
        tighter,
        wider
      );

      const trim =
        el(
          "div",
          {
            class: "ft-trim"
          }
        );

      function range(
        label,
        value,
        min,
        max,
        axis
      ) {

        const row =
          el(
            "label",
            {
              class:
                "ft-trim-row"
            }
          );

        const title =
          el(
            "span"
          );

        title.textContent =
          label;

        const input =
          el(
            "input",
            {
              type: "range",
              min: String(min),
              max: String(max),
              step: "1",
              value: String(value)
            }
          );

        const output =
          el(
            "output"
          );

        output.textContent =
          value + "px";

        input.addEventListener(
          "input",
          () => {

            const n =
              Number(
                input.value
              );

            output.textContent =
              n + "px";

            if (
              axis === "left"
            ) {

              rect.x =
                Math.min(
                  n,
                  rect.x +
                    rect.w -
                    24
                );
            }

            if (
              axis === "top"
            ) {

              rect.y =
                Math.min(
                  n,
                  rect.y +
                    rect.h -
                    24
                );
            }

            if (
              axis === "right"
            ) {

              const right =
                Math.max(
                  n,
                  rect.x + 24
                );

              rect.w =
                Math.min(
                  source.width -
                    rect.x,
                  right -
                    rect.x
                );
            }

            if (
              axis === "bottom"
            ) {

              const bottom =
                Math.max(
                  n,
                  rect.y + 24
                );

              rect.h =
                Math.min(
                  source.height -
                    rect.y,
                  bottom -
                    rect.y
                );
            }

            cropFailed = false;

            applyCrop();
          }
        );

        row.append(
          title,
          input,
          output
        );

        trim.append(
          row
        );
      }

      range(
        "Esquerda",
        Math.round(rect.x),
        0,
        Math.max(
          1,
          source.width - 24
        ),
        "left"
      );

      range(
        "Topo",
        Math.round(rect.y),
        0,
        Math.max(
          1,
          source.height - 24
        ),
        "top"
      );

      range(
        "Direita",
        Math.round(

        ),
        24,

        ),

      );

      const reread =

      function applyCrop() {

        scan =
          renderScan(
            source,
            rect
          );

        view.width =

        view.height =

        view

      tighter.addEventListener(

        () => {

        }
      );

      wider.addEventListener(

      whole.addEventListener(
        "click",
        () => {

          };

          cropFailed = false;

          applyCrop();
        }
      );

      again.addEventListener(
        "click",
        () =>
          fileCam.click()
      );

      reread.addEventListener(
        "click",
        () => {

          if (reading) {
            return;
          }

          const fields =
            reviewFields();

          if (fields.date) {
            fields.date.value = "";
          }

          if (fields.total) {
            fields.total.value = "";
          }

          if (fields.ocr) {
            fields.ocr.value = "";
          }

          ocrToken++;

          void runOcr(
            ocrToken
          );
        }
      );

      save.addEventListener(
        "click",
        () =>
          void onSave()
      );
    }

    async function runOcr(
      token
    ) {

      if (
        !scan ||
        reading
      ) {
        return;
      }

      reading = true;

      const fields =
        reviewFields();

      function status(
        text
      ) {

        if (
          token !== ocrToken
        ) {
          return;
        }

        if (
          fields.status
        ) {
          fields.status.textContent =
            text;
        }
      }

      try {

        const text =
          await readReceipt(
            scan,
            status
          );

        if (
          token !== ocrToken
        ) {
          return;
        }

        if (fields.ocr) {
          fields.ocr.value =
            text.trim();
        }

        const date =
          parseEmissionDate(
            text
          );

        const total =
          parseTotal(
            text
          );

        const category =
          categorize(
            text
          );

        if (
          date &&
          fields.date &&
          !fields.date.value
        ) {

          fields.date.value =
            date.iso;

          if (
            fields.dateHint
          ) {

            fields.dateHint.textContent =
              "Lida no talão: " +
              date.display;
          }
        }

        if (
          total &&
          fields.total &&
          !fields.total.value
        ) {

          fields.total.value =
            total.euros.toLocaleString(
              "pt-PT",
              {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              }
            );
        }

        if (
          fields.cat &&
          category !== "Outros"
        ) {

          fields.cat.value =
            category;
        }

        status(
          [
            date
              ? "Data " + date.display
              : "Data não lida",

            total
              ? "Total " +
                formatEuros(
                  total.euros
                )
              : "Total não lido",

            category
          ].join(" · ") +
          ". Confirma antes de guardar."
        );

      } catch {

        if (
          token !== ocrToken
        ) {
          return;
        }

        status(
          "Não consegui ler o talão. Preenche os dados manualmente."
        );

      } finally {

        if (
          token === ocrToken
        ) {
          reading = false;
        }
      }
    }

    async function onSave() {

      if (
        busy ||
        !scan
      ) {
        return;
      }

      const fields =
        reviewFields();

      const dateValue =
        fields.date?.value || "";

      const issuedDate =
        /^\d{4}-\d{2}-\d{2}$/
          .test(dateValue)
          ? dateValue
          : null;

      const totalRaw =
        fields.total?.value || "";

      const total =
        parseUserTotal(
          totalRaw
        );

      if (
        totalRaw.trim() &&
        total == null
      ) {

        if (fields.status) {

          fields.status.textContent =
            "Total inválido. Usa, por exemplo, 6,69.";
        }

        return;
      }

      busy = true;

      try {

        /*
          AQUI ESTÁ A CORREÇÃO PRINCIPAL:
          a imagem guardada é um JPEG válido.
        */

        const imageBlob =
          await canvasToBlob(
            scan
          );

        await saveFatura({

          id:
            crypto.randomUUID(),

          createdAt:
            Date.now(),

          issuedDate,

          month:
            monthKeyFromIso(
              issuedDate
            ),

          category:
            fields.cat?.value ||
            "Outros",

          total,

          notes:
            fields.notes?.value
              ?.trim() || "",

          ocrText:
            fields.ocr?.value || "",

          cropApplied:
            true,

          image:
            imageBlob,

          imageType:
            imageBlob.type,

          imageSize:
            imageBlob.size
        });

        source = null;
        scan = null;
        rect = null;

        await showArchive();

      } catch (error) {

        console.error(
          "Erro ao guardar:",
          error
        );

        if (fields.status) {

          fields.status.textContent =
            "Não consegui guardar a fotografia. Tenta novamente.";
        }

      } finally {

        busy = false;
      }
    }

    async function showArchive() {

      setTab("arquivo");

      nav.classList.remove(
        "ft-hidden"
      );

      revokeUrls();

      main.replaceChildren();

      let rows = [];

      try {

        rows =
          await listFaturas();

      } catch (error) {

        console.error(
          error
        );

        const warning =
          el(
            "p",
            {
              class: "ft-warn"
            }
          );

        warning.textContent =
          "Não consegui abrir o arquivo neste browser.";

        main.append(
          warning
        );

        return;
      }

      if (!rows.length) {

        const card =
          el(
            "section",
            {
              class: "ft-card"
            }
          );

        card.innerHTML = `
          <h2 class="ft-lead">
            Ainda não há faturas.
          </h2>

          <p class="ft-muted">
            Fotografa um talão para começar.
          </p>
        `;

        main.append(
          card
        );

        return;
      }

      const groups =
        new Map();

      for (const row of rows) {

        const key =
          row.month ||
          "sem-data";

        const list =
          groups.get(key) ||
          [];

        list.push(row);

        groups.set(
          key,
          list
        );
      }

      const keys =
        [...groups.keys()].sort(
          (a, b) => {

            if (
              a === "sem-data"
            ) {
              return 1;
            }

            if (
              b === "sem-data"
            ) {
              return -1;
            }

            return a < b
              ? 1
              : -1;
          }
        );

      for (const key of keys) {

        const items =
          groups.get(key) ||
          [];

        const card =
          el(
            "section",
            {
              class: "ft-card"
            }
          );

        let grand = 0;

        const sums =
          new Map();

        for (
          const item of items
        ) {

          if (
            item.total == null
          ) {
            continue;
          }

          grand +=
            item.total;

          sums.set(
            item.category,
            (
              sums.get(
                item.category
              ) || 0
            ) + item.total
          );
        }

        const head =
          el(
            "div",
            {
              class: "ft-month"
            }
          );

        head.innerHTML = `
          <div>
            <h2>
              ${formatMonthKey(key)}
            </h2>

            <p class="ft-muted">
              Total gasto no mês
            </p>
          </div>

          <p class="ft-sum">
            ${formatEuros(grand)}
          </p>
        `;

        card.append(
          head
        );

        for (
          const category of CATEGORIES
        ) {

          if (
            !sums.has(category)
          ) {
            continue;
          }

          const line =
            el(
              "div",
              {
                class: "ft-sub"
              }
            );

          line.innerHTML = `
            <span>
              ${category}
            </span>

            <strong>
              ${formatEuros(
                sums.get(
                  category
                )
              )}
            </strong>
          `;

          card.append(
            line
          );
        }

        /* PDF */

        const pdfControls =
          el(
            "div",
            {
              class:
                "ft-pdf-controls"
            }
          );

        const label =
          el(
            "label"
          );

        label.textContent =
          "Faturas por página";

        const select =
          el(
            "select"
          );

        select.innerHTML = `
          <option value="1">
            1 — maior
          </option>

          <option value="2">
            2
          </option>

          <option
            value="4"
            selected
          >
            4 — recomendado
          </option>

          <option value="6">
            6 — mais compacto
          </option>
        `;

        label.append(
          select
        );

        const pdfButton =
          el(
            "button",
            {
              class:
                "ft-btn",
              type: "button"
            }
          );

        pdfButton.textContent =
          "Imprimir / PDF";

        pdfButton.addEventListener(
          "click",
          async () => {

            pdfButton.disabled =
              true;

            pdfButton.textContent =
              "A criar PDF…";

            try {

              await exportMonthPdf(
                key,
                items,
                Number(
                  select.value
                )
              );

            } catch (error) {

              console.error(
                error
              );

              alert(
                "Não foi possível criar o PDF."
              );

            } finally {

              pdfButton.disabled =
                false;

              pdfButton.textContent =
                "Imprimir / PDF";
            }
          }
        );

        pdfControls.append(
          label,
          pdfButton
        );

        card.append(
          pdfControls
        );

        /* Faturas */

        for (
          const item of items
        ) {

          const box =
            el(
              "article",
              {
                class:
                  "ft-item"
              }
            );

          let imageUrl = null;

          try {

            if (
              item.image instanceof Blob
            ) {

              imageUrl =
                URL.createObjectURL(
                  item.image
                );

            } else {

              throw new Error(
                "Imagem não é Blob"
              );
            }

          } catch (error) {

            console.error(
              "Imagem inválida:",
              error
            );
          }

          const img =
            el(
              "img",
              {
                alt: "Talão"
              }
            );

          if (imageUrl) {

            img.src =
              imageUrl;

            urls.push(
              imageUrl
            );

          } else {

            img.alt =
              "Imagem indisponível";

            img.style.objectFit =
              "contain";
          }

          /*
            NOVO:
            se a imagem estiver corrompida,
            não fica silenciosamente partida.
          */

          img.addEventListener(
            "error",
            () => {

              img.removeAttribute(
                "src"
              );

              img.alt =
                "Imagem indisponível";

              img.style.objectFit =
                "contain";
            }
          );

          const info =
            el("div");

          const dateText =
            item.issuedDate
              ? item.issuedDate
                  .split("-")
                  .reverse()
                  .join("/")
              : "Sem data";

          info.innerHTML = `
            <h3>
              ${dateText}
            </h3>

            <p>
              ${escapeHtml(
                item.category
              )}
              ·
              ${formatEuros(
                item.total
              )}
            </p>

            ${
              item.notes
                ? `
                  <p class="ft-muted">
                    ${escapeHtml(
                      item.notes
                    )}
                  </p>
                `
                : ""
            }

            <div
              class="ft-row"
              style="margin-top:8px"
            >

              <button
                type="button"
                class="ft-btn ghost"
                data-edit="${escapeAttr(
                  item.id
                )}"
              >
                Corrigir
              </button>

              <button
                type="button"
                class="ft-btn danger"
                data-del="${escapeAttr(
                  item.id
                )}"
              >
                Apagar
              </button>

            </div>
          `;

          box.append(
            img,
            info
          );

          card.append(
            box
          );
        }

        main.append(
          card
        );
      }

      main
        .querySelectorAll(
          "[data-del]"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              async () => {

                const id =
                  button.dataset.del;

                if (!id) {
                  return;
                }

                if (
                  !confirm(
                    "Apagar esta fatura deste telemóvel?"
                  )
                ) {
                  return;
                }

                await deleteFatura(
                  id
                );

                await showArchive();
              }
            );
          }
        );

      main
        .querySelectorAll(
          "[data-edit]"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                const item =
                  rows.find(
                    row =>
                      row.id ===
                      button.dataset.edit
                  );

                if (item) {
                  openEdit(
                    item
                  );
                }
              }
            );
          }
        );
    }

    /* =======================================================
       EDITAR
    ======================================================= */

    function openEdit(
      item
    ) {

      main.replaceChildren();

      const card =
        el(
          "section",
          {
            class: "ft-card"
          }
        );

      let url = null;

      try {

        if (
          item.image instanceof Blob
        ) {

          url =
            URL.createObjectURL(
              item.image
            );

          urls.push(
            url
          );
        }

      } catch {}

      const img =
        el(
          "img",
          {
            class: "ft-scan",
            alt: "Talão"
          }
        );

      if (url) {

        img.src =
          url;

      } else {

        img.alt =
          "Imagem indisponível";
      }

      img.addEventListener(
        "error",
        () => {

          img.removeAttribute(
            "src"
          );

          img.alt =
            "Imagem indisponível";
        }
      );

      const date =
        el(
          "input",
          {
            type: "date"
          }
        );

      date.value =
        item.issuedDate || "";

      const total =
        el(
          "input",
          {
            inputmode:
              "decimal"
          }
        );

      total.value =
        item.total == null
          ? ""
          : item.total.toLocaleString(
              "pt-PT",
              {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              }
            );

      const category =
        el(
          "select"
        );

      category.innerHTML =
        CATEGORIES
          .map(
            value =>
              `
              <option
                ${value ===
                  item.category
                  ? "selected"
                  : ""}
              >
                ${value}
              </option>
              `
          )
          .join("");

      const notes =
        el(
          "input",
          {
            maxlength: "180"
          }
        );

      notes.value =
        item.notes || "";

      const ocr =
        el(
          "textarea",
          {
            readonly: ""
          }
        );

      ocr.value =
        item.ocrText || "";

      function labelled(
        text,
        field
      ) {

        const label =
          el("label");

        label.textContent =
          text;

        label.append(
          field
        );

        return label;
      }

      card.append(
        img,

        labelled(
          "Data de emissão",
          date
        ),

        labelled(
          "Total pago (€)",
          total
        ),

        labelled(
          "Categoria",
          category
        ),

        labelled(
          "Notas",
          notes
        ),

        labelled(
          "Texto lido",
          ocr
        )
      );

      const save =
        el(
          "button",
          {
            class: "ft-btn",
            type: "button"
          }
        );

      save.textContent =
        "Atualizar";

      const back =
        el(
          "button",
          {
            class:
              "ft-btn secondary",
            type: "button"
          }
        );

      back.textContent =
        "Voltar ao arquivo";

      const status =
        el(
          "p",
          {
            class:
              "ft-muted"
          }
        );

      main.append(
        card,
        save,
        back,
        status
      );

      back.addEventListener(
        "click",
        () =>
          void showArchive()
      );

      save.addEventListener(
        "click",
        async () => {

          const raw =
            total.value;

          const parsed =
            parseUserTotal(
              raw
            );

          if (
            raw.trim() &&
            parsed == null
          ) {

            status.textContent =
              "Total inválido.";

            return;
          }

          const issuedDate =
            /^\d{4}-\d{2}-\d{2}$/
              .test(date.value)
              ? date.value
              : null;

          try {

            await saveFatura({

              ...item,

              issuedDate,

              month:
                monthKeyFromIso(
                  issuedDate
                ),

              total:
                parsed,

              category:
                category.value,

              notes:
                notes.value.trim()
            });

            await showArchive();

          } catch (error) {

            console.error(
              error
            );

            status.textContent =
              "Não consegui atualizar.";
          }
        }
      );
    }

    /* =======================================================
       IMPORTAR VÁRIAS
    ======================================================= */

    async function processBatch(
      files
    ) {

      if (!files?.length) {
        return;
      }

      nav.classList.add(
        "ft-hidden"
      );

      main.replaceChildren();

      const card =
        el(
          "section",
          {
            class: "ft-card"
          }
        );

      card.innerHTML = `
        <h2 class="ft-lead">
          A importar faturas…
        </h2>

        <p
          class="ft-muted"
          data-batch-status
        >
          0 de ${files.length}
        </p>

        <div
          data-batch-list
        ></div>
      `;

      main.append(
        card
      );

      const list =
        card.querySelector(
          "[data-batch-list]"
        );

      let ok = 0;
      let failed = 0;
      let missingDate = 0;

      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        const file =
          files[i];

        const line =
          el(
            "p",
            {
              class:
                "ft-muted"
            }
          );

        line.textContent =
          (
            i + 1
          ) +
          "/" +
          files.length +
          " — " +
          file.name +
          " — a processar…";

        list.append(
          line
        );

        try {

          const full =
            await canvasFromFile(
              file
            );

          const ctx =
            full.getContext(
              "2d",
              {
                willReadFrequently:
                  true
              }
            );

          const pixels =
            ctx.getImageData(
              0,
              0,
              full.width,
              full.height
            );

          const found =
            findPage(
              pixels.data,
              full.width,
              full.height
            );

          const r =
            found || {
              x: 0,
              y: 0,
              w: full.width,
              h: full.height
            };

          const cropped =
            renderScan(
              full,
              r
            );

          const text =
            await readReceipt(
              cropped,
              message => {

                line.textContent =
                  (
                    i + 1
                  ) +
                  "/" +
                  files.length +
                  " — " +
                  file.name +
                  " — " +
                  message;
              }
            );

          const date =
            parseEmissionDate(
              text
            );

          const parsedTotal =
            parseTotal(
              text
            );

          const category =
            categorize(
              text
            );

          const imageBlob =
            await canvasToBlob(
              cropped
            );

          await saveFatura({

            id:
              crypto.randomUUID(),

            createdAt:
              Date.now(),

            issuedDate:
              date?.iso ||
              null,

            month:
              monthKeyFromIso(
                date?.iso ||
                null
              ),

            category,

            total:
              parsedTotal?.euros ??
              null,

            notes:
              "Importada automaticamente",

            ocrText:
              text,

            cropApplied:
              true,

            image:
              imageBlob,

            imageType:
              imageBlob.type,

            imageSize:
              imageBlob.size
          });

          ok++;

          if (!date) {
            missingDate++;
          }

          line.textContent =
            (
              i + 1
            ) +
            "/" +
            files.length +
            " — " +
            file.name +
            " — " +
            (
              date
                ? date.display
                : "data por confirmar"
            ) +
            " · " +
            (
              parsedTotal
                ? formatEuros(
                    parsedTotal.euros
                  )
                : "total por confirmar"
            ) +
            " · " +
            category;

        } catch (error) {

          console.error(
            error
          );

          failed++;

          line.textContent =
            (
              i + 1
            ) +
            "/" +
            files.length +
            " — " +
            file.name +
            " — não foi possível processar";
        }

        const status =
          card.querySelector(
            "[data-batch-status]"
          );

        if (status) {

          status.textContent =
            ok +
            " guardadas · " +
            failed +
            " falharam · " +
            missingDate +
            " sem data para rever.";
        }
      }

      const done =
        el(
          "button",
          {
            class: "ft-btn",
            type: "button"
          }
        );

      done.textContent =
        "Abrir arquivo";

      done.addEventListener(
        "click",
        () =>
          void showArchive()
      );

      main.append(
        done
      );
    }

    /* =======================================================
       EVENTOS
    ======================================================= */

    nav.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            "button"
          );

        if (!button) {
          return;
        }

        if (
          button.dataset.tab ===
          "nova"
        ) {

          showHome();
        }

        if (
          button.dataset.tab ===
          "arquivo"
        ) {

          void showArchive();
        }
      }
    );

    fileCam.addEventListener(
      "change",
      () => {

        const file =
          fileCam.files?.[0];

        fileCam.value = "";

        if (!file) {
          return;
        }

        void canvasFromFile(
          file
        )
          .then(
            canvas =>
              beginReview(
                canvas
              )
          )
          .catch(
            error => {

              console.error(
                error
              );

              alert(
                error?.message ===
                  "formato"
                  ? "Escolhe uma fotografia JPG, PNG ou WebP."
                  : "Não consegui abrir essa fotografia. Tenta JPG ou PNG."
              );
            }
          );
      }
    );

    fileLib.addEventListener(
      "change",
      () => {

        const file =
          fileLib.files?.[0];

        fileLib.value = "";

        if (!file) {
          return;
        }

        void canvasFromFile(
          file
        )
          .then(
            canvas =>
              beginReview(
                canvas
              )
          )
          .catch(
            error => {

              console.error(
                error
              );

              alert(
                "Não consegui abrir essa imagem."
              );
            }
          );
      }
    );

    fileBatch.addEventListener(
      "change",
      () => {

        const files =
          [
            ...(fileBatch.files || [])
          ];

        fileBatch.value = "";

        if (files.length) {
          void processBatch(
            files
          );
        }
      }
    );

    showHome();
  }

  /* =========================================================
     INICIAR
  ========================================================= */

  const root =
    document.getElementById(
      "app"
    );

  if (root) {
    mountFaturas(root);
  }

})();
</script>
</body>
</html>
