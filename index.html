}

  width:100%;

}

  inset:0;
  pointer-events:none;
}

  left:7%;
  right:7%;
  top:17%;
  bottom:19%;
  border:2px solid rgba(255,255,255,.92);
  border-radius:18px;
  box-shadow:
    0 0 0 9999px rgba(0,0,0,.38),

  position:absolute;
  inset:-2px;
  border:2px solid var(--red);
  border-radius:18px;
  clip-path:polygon(0 0,20% 0,20% 3%,3% 3%,3% 20%,0 20%,

.camera-hint{

/* =========================================================

/* =========================================================

/* =========================================================
   UTIL
========================================================= */

function el(tag,attrs={},html=""){
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  if(html!==undefined)e.innerHTML=html;
  return e;
}

function normalize(s){
  return String(s||"")
    .replace(/[‐-‒–—−]/g,"-")
    .replace(/\u00a0/g," ")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase();
}

function euroNumber(value){
  if(value===null || value===undefined)return null;

  let s=String(value)
    .replace(/[€$£]/g,"")
    .replace(/\s/g,"")
    .trim();

  if(!s)return null;

  /*
    1.234,56 -> 1234.56
    1234,56 -> 1234.56
    1234.56 -> 1234.56
  */

  if(s.includes(",") && s.includes(".")){
    if(s.lastIndexOf(",")>s.lastIndexOf(".")){
      s=s.replace(/\./g,"").replace(",",".");
    }else{
      s=s.replace(/,/g,"");
    }
  }else if(s.includes(",")){
    s=s.replace(/\./g,"").replace(",",".");
  }

  const n=Number(s);
  return Number.isFinite(n)?n:null;
}

function formatEuro(n){
  if(n===null || !Number.isFinite(n))return "—";
  return n.toLocaleString("pt-PT",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  })+" €";
}

function escapeHTML(s){
  return String(s??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function validDate(y,m,d){
  const date=new Date(Date.UTC(y,m-1,d));
  return y>=1990 &&
         y<=2100 &&
         date.getUTCFullYear()===y &&
         date.getUTCMonth()===m-1 &&
         date.getUTCDate()===d;
}

function dateISO(y,m,d){
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}

/* =========================================================
   DATABASE
========================================================= */

function openDB(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open("toyota-faturas",1);

    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains("faturas")){
        db.createObjectStore("faturas",{keyPath:"id"});
      }
    };

    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}

async function saveInvoice(invoice){
  const db=await openDB();
  const tx=db.transaction("faturas","readwrite");
  tx.objectStore("faturas").put(invoice);

  await new Promise((resolve,reject)=>{
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });

  db.close();
}

async function getInvoices(){
  const db=await openDB();
  const tx=db.transaction("faturas","readonly");
  const request=tx.objectStore("faturas").getAll();

  const result=await new Promise((resolve,reject)=>{
    request.onsuccess=()=>resolve(request.result||[]);
    request.onerror=()=>reject(request.error);
  });

  db.close();

  return result.sort((a,b)=>b.createdAt-a.createdAt);
}

async function deleteInvoice(id){
  const db=await openDB();
  const tx=db.transaction("faturas","readwrite");
  tx.objectStore("faturas").delete(id);

  await new Promise((resolve,reject)=>{
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });

  db.close();
}

/* =========================================================
   IMAGE
========================================================= */

function resizeCanvas(source,max=2200){
  const scale=Math.min(
    1,
    max/Math.max(source.width,source.height)
  );

  if(scale>=1)return source;

  const canvas=document.createElement("canvas");

  canvas.width=Math.round(source.width*scale);
  canvas.height=Math.round(source.height*scale);

  const ctx=canvas.getContext("2d");
  ctx.drawImage(
    source,
    0,
    0,
    canvas.width,
    canvas.height
  );

  return canvas;
}

async function fileToCanvas(file){

  if("createImageBitmap" in window){

    try{
      const bitmap=await createImageBitmap(
        file,
        {imageOrientation:"from-image"}
      );

      const canvas=document.createElement("canvas");

      canvas.width=bitmap.width;
      canvas.height=bitmap.height;

      canvas
        .getContext("2d")
        .drawImage(bitmap,0,0);

      bitmap.close();

      return resizeCanvas(canvas);
    }catch{}
  }

  return new Promise((resolve,reject)=>{

    const url=URL.createObjectURL(file);

    const image=new Image();

    image.onload=()=>{

      const canvas=document.createElement("canvas");

      canvas.width=image.naturalWidth;
      canvas.height=image.naturalHeight;

      canvas
        .getContext("2d")
        .drawImage(image,0,0);

      URL.revokeObjectURL(url);

      resolve(resizeCanvas(canvas));
    };

    image.onerror=reject;
    image.src=url;
  });
}

function canvasBlob(canvas){
  return new Promise((resolve,reject)=>{
    canvas.toBlob(
      blob=>blob?resolve(blob):reject(new Error("Não foi possível criar imagem")),
      "image/jpeg",
      .9
    );
  });
}

/* =========================================================
   DETEÇÃO DO DOCUMENTO
========================================================= */

/*
  Não tenta fazer uma "IA de visão" falsa.
  Procura a área clara da folha contra o fundo.
*/

function detectDocument(canvas){

  const maxW=900;
  const scale=Math.min(1,maxW/canvas.width);

  const w=Math.round(canvas.width*scale);
  const h=Math.round(canvas.height*scale);

  const small=document.createElement("canvas");
  small.width=w;
  small.height=h;

  const ctx=small.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(canvas,0,0,w,h);

  const data=ctx.getImageData(0,0,w,h).data;

  let minX=w;
  let minY=h;
  let maxX=0;
  let maxY=0;
  let count=0;

  /*
    Procuramos pixels suficientemente claros.
  */

  for(let y=0;y<h;y++){

    for(let x=0;x<w;x++){

      const i=(y*w+x)*4;

      const r=data[i];
      const g=data[i+1];
      const b=data[i+2];

      const brightness=(r+g+b)/3;
      const saturation=
        Math.max(r,g,b)-Math.min(r,g,b);

      const paper=
        brightness>145 &&
        saturation<65;

      if(paper){

        count++;

        if(x<minX)minX=x;
        if(y<minY)minY=y;
        if(x>maxX)maxX=x;
        if(y>maxY)maxY=y;
      }
    }
  }

  const area=w*h;

  /*
    Se quase tudo for papel, provavelmente a fotografia
    já está bem enquadrada.
  */

  if(count>area*.55){

    return {
      x:0,
      y:0,
      w:canvas.width,
      h:canvas.height
    };
  }

  if(count<area*.08)return null;

  const padX=Math.round((maxX-minX)*.035);
  const padY=Math.round((maxY-minY)*.035);

  minX=Math.max(0,minX-padX);
  minY=Math.max(0,minY-padY);
  maxX=Math.min(w-1,maxX+padX);
  maxY=Math.min(h-1,maxY+padY);

  const sx=canvas.width/w;
  const sy=canvas.height/h;

  return {
    x:Math.round(minX*sx),
    y:Math.round(minY*sy),
    w:Math.round((maxX-minX+1)*sx),
    h:Math.round((maxY-minY+1)*sy)
  };
}

/* =========================================================
   SCANNER
========================================================= */

function createScan(source,rect){

  const canvas=document.createElement("canvas");

  canvas.width=Math.max(
    1,
    Math.round(rect.w)
  );

  canvas.height=Math.max(
    1,
    Math.round(rect.h)
  );

  const ctx=canvas.getContext("2d");

  ctx.drawImage(
    source,
    rect.x,
    rect.y,
    rect.w,
    rect.h,
    0,
    0,
    canvas.width,
    canvas.height
  );

  /*
    Processamento tipo scanner:
    - branco mais limpo
    - contraste aumentado
    - texto mais escuro
  */

  const image=ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const d=image.data;

  for(let i=0;i<d.length;i+=4){

    let r=d[i];
    let g=d[i+1];
    let b=d[i+2];

    let gray=
      0.299*r+
      0.587*g+
      0.114*b;

    /*
      Auto-contraste leve
    */

    gray=(gray-118)*1.22+128;

    gray=Math.max(0,Math.min(255,gray));

    /*
      Mantém vermelho muito ligeiramente,
      mas torna a página predominantemente branca.
    */

    d[i]=gray;
    d[i+1]=gray;
    d[i+2]=gray;
  }

  ctx.putImageData(image,0,0);

  return canvas;
}

/* =========================================================
   OCR PARSING
========================================================= */

function cleanOCR(text){

  return String(text||"")
    .replace(/\r/g,"\n")
    .replace(/[|]/g,"I")
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

/* ---------- DATA ---------- */

function parseDate(text){

  const s=normalize(text);
  const candidates=[];

  function add(y,m,d,score){

    y=Number(y);
    m=Number(m);
    d=Number(d);

    if(y<100){
      y=y>=70?1900+y:2000+y;
    }

    if(validDate(y,m,d)){
      candidates.push({
        iso:dateISO(y,m,d),
        score
      });
    }
  }

  /*
    YYYY-MM-DD
  */

  for(const m of s.matchAll(
    /\b(20\d{2})[./-](\d{1,2})[./-](\d{1,2})\b/g
  )){
    add(m[1],m[2],m[3],90);
  }

  /*
    DD-MM-YYYY
  */

  for(const m of s.matchAll(
    /\b(\d{1,2})[./-](\d{1,2})[./-](20\d{2}|\d{2})\b/g
  )){

    const before=s.slice(
      Math.max(0,m.index-50),
      m.index
    );

    let score=40;

    if(
      /data|emissao|emissão|emitida|fatura|documento/.test(before)
    ){
      score+=40;
    }

    add(m[3],m[2],m[1],score);
  }

  candidates.sort((a,b)=>b.score-a.score);

  return candidates[0]||null;
}

/* ---------- MONEY ---------- */

function moneyMatches(text){

  const result=[];

  const regex=
    /(?:€\s*)?(\d{1,3}(?:[.\s]\d{3})*,\d{2}|\d+,\d{2})(?:\s*€)?/g;

  for(const m of text.matchAll(regex)){

    const value=euroNumber(m[1]);

    if(
      value!==null &&
      value>=0 &&
      value<10000000
    ){
      result.push({
        value,
        index:m.index
      });
    }
  }

  return result;
}

function parseTotal(text){

  const lines=text.split(/\n/);

  const strong=[];
  const normal=[];

  for(let i=0;i<lines.length;i++){

    const line=normalize(
      lines[i]+" "+(lines[i+1]||"")
    );

    const money=moneyMatches(line);

    for(const item of money){

      if(
        /total a pagar|total pagar|valor a pagar|montante a pagar|total final|total liquido/.test(line)
      ){
        strong.push(item.value);
      }

      else if(
        /\btotal\b/.test(line)
      ){
        normal.push(item.value);
      }
    }
  }

  if(strong.length){

    return {
      value:strong[strong.length-1],
      confidence:"alta"
    };
  }

  if(normal.length){

    return {
      value:Math.max(...normal),
      confidence:"média"
    };
  }

  /*
    Fallback:
    em muitos talões o maior valor monetário é o total.
  */

  const all=moneyMatches(text)
    .map(x=>x.value)
    .filter(x=>x>0);

  if(all.length){

    return {
      value:Math.max(...all),
      confidence:"baixa"
    };
  }

  return null;
}

/* ---------- IVA ---------- */

function parseVAT(text){

  const lines=text.split(/\n/);

  for(let i=0;i<lines.length;i++){

    const line=normalize(
      lines[i]+" "+(lines[i+1]||"")
    );

    if(!/\biva\b/.test(line))continue;

    const values=moneyMatches(line);

    if(values.length){

      return values[values.length-1].value;
    }
  }

  return null;
}

/* ---------- NIF ---------- */

function validNIF(nif){

  if(!/^\d{9}$/.test(nif))return false;

  let sum=0;

  for(let i=0;i<8;i++){
    sum+=Number(nif[i])*(9-i);
  }

  const mod=sum%11;
  const check=mod<2?0:11-mod;

  return check===Number(nif[8]);
}

function parseNIF(text){

  const lines=text.split(/\n/);

  for(const line of lines){

    const f=normalize(line);

    if(
      !/\b(nif|nipc|contribuinte)\b/.test(f)
    )continue;

    const candidates=
      line.match(/\d[\d .-]{7,16}\d/g)||[];

    for(const c of candidates){

      const digits=c.replace(/\D/g,"");

      if(
        digits.length===9 &&
        validNIF(digits)
      ){
        return digits;
      }
    }
  }

  /*
    fallback: procura qualquer sequência de 9
    dígitos válida
  */

  const candidates=text.match(/\b\d{9}\b/g)||[];

  for(const n of candidates){

    if(validNIF(n))return n;
  }

  return null;
}

/* ---------- DOCUMENT NUMBER ---------- */

function parseDocumentNumber(text){

  const patterns=[

    /\b(?:fatura|factura|documento)\s*(?:n[ºo°.]*)?\s*[:#-]?\s*([A-Z]{0,4}\s*\d{1,8}(?:[\/-]\d{1,8})?)/i,

    /\b(FT\s*\d{1,8}(?:[\/-]\d{1,8})?)/i,

    /\b(FR\s*\d{1,8}(?:[\/-]\d{1,8})?)/i,

    /\b(FS\s*\d{1,8}(?:[\/-]\d{1,8})?)/i,

    /\b(NC\s*\d{1,8}(?:[\/-]\d{1,8})?)/i
  ];

  for(const regex of patterns){

    const match=text.match(regex);

    if(match){

      return (match[1]||match[0])
        .replace(/\s+/g," ")
        .trim()
        .slice(0,40);
    }
  }

  return null;
}

/* ---------- SUPPLIER ---------- */

const KNOWN_SUPPLIERS=[

  ["toyota","Toyota"],
  ["toyota portugal","Toyota Portugal"],
  ["galp","Galp"],
  ["repsol","Repsol"],
  ["prio","Prio"],
  ["cepsa","Cepsa"],
  ["bp","BP"],
  ["continente","Continente"],
  ["pingo doce","Pingo Doce"],
  ["lidl","Lidl"],
  ["auchan","Auchan"],
  ["mercadona","Mercadona"],
  ["pestana","Pestana"],
  ["ibis","Ibis"],
  ["campanile","Campanile"],
  ["mcdonald","McDonald's"],
  ["burger king","Burger King"]
];

function parseSupplier(text){

  const normalized=normalize(text);

  for(const [key,name] of KNOWN_SUPPLIERS){

    if(normalized.includes(key)){
      return name;
    }
  }

  const lines=text
    .split(/\n/)
    .map(x=>x.trim())
    .filter(Boolean);

  /*
    Normalmente o fornecedor aparece no topo.
  */

  for(const line of lines.slice(0,12)){

    const f=normalize(line);

    if(
      f.length<3 ||
      f.length>60 ||
      /\b(nif|nipc|iva|total|fatura|factura|data|morada|telefone|www|http)\b/.test(f)
    ){
      continue;
    }

    if(
      /^[A-Za-zÀ-ÿ0-9 .&'-]+$/.test(line) &&
      /[A-Za-zÀ-ÿ]{3,}/.test(line)
    ){
      return line.slice(0,60);
    }
  }

  return null;
}

/* ---------- CATEGORY ---------- */

function categoryFromText(text){

  const s=normalize(text);

  if(
    /\b(galp|repsol|prio|bp|cepsa|gasolina|gasoleo|diesel|combustivel|combustivel)\b/.test(s)
  ){
    return "Combustível";
  }

  if(
    /\b(hotel|hotelaria|ibis|pestana|campanile|pousada|alojamento|quarto)\b/.test(s)
  ){
    return "Estadias";
  }

  if(
    /\b(restaurante|restaurant|cafe|café|pastelaria|pizza|burger|mcdonald|padaria)\b/.test(s)
  ){
    return "Restauração";
  }

  if(
    /\b(continente|pingo doce|lidl|auchan|mercadona|supermercado)\b/.test(s)
  ){
    return "Alimentação";
  }

  return "Outros";
}

/* =========================================================
   OCR
========================================================= */

function preprocessForOCR(source,mode){

  const canvas=document.createElement("canvas");

  canvas.width=source.width;
  canvas.height=source.height;

  const ctx=canvas.getContext("2d");

  ctx.drawImage(source,0,0);

  const image=ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const d=image.data;

  for(let i=0;i<d.length;i+=4){

    let r=d[i];
    let g=d[i+1];
    let b=d[i+2];

    let gray=
      .299*r+
      .587*g+
      .114*b;

    if(mode==="strong"){

      gray=(gray-128)*1.55+128;

      if(gray>205)gray=255;
      if(gray<90)gray=0;

    }else{

      gray=(gray-128)*1.25+128;

    }

    gray=Math.max(0,Math.min(255,gray));

    d[i]=gray;
    d[i+1]=gray;
    d[i+2]=gray;
  }

  ctx.putImageData(image,0,0);

  return canvas;
}

async function runOCR(){

  if(!scannedCanvas || ocrRunning)return;

  ocrRunning=true;

  const form=document.querySelector("[data-form]");

  if(!form){
    ocrRunning=false;
    return;
  }

  const status=document.querySelector("[data-ocr-status]");
  const progress=document.querySelector("[data-progress]");

  function setStatus(text,p=0){

    if(status)status.textContent=text;

    if(progress){
      progress.style.width=Math.round(p*100)+"%";
    }
  }

  try{

    setStatus("A preparar a digitalização…",.05);

    if(!window.Tesseract){
      throw new Error(
        "O motor OCR não carregou. Verifica a ligação à internet."
      );
    }

    /*
      Criamos duas versões:
      1. normal
      2. contraste forte
    */

    const image1=preprocessForOCR(
      scannedCanvas,
      "normal"
    );

    setStatus(
      "A carregar o motor de leitura…",
      .10
    );

    const worker=await Tesseract.createWorker(
      "por",
      1,
      {
        logger:m=>{

          if(
            m.status==="recognizing text" &&
            typeof m.progress==="number"
          ){

            setStatus(
              "A ler a fatura… "+
              Math.round(m.progress*100)+"%",
              .15+m.progress*.65
            );
          }
        }
      }
    );

    let result1=await worker.recognize(
      await canvasBlob(image1)
    );

    let text=result1?.data?.text||"";

    /*
      Se o primeiro OCR produzir pouco texto,
      fazemos segunda leitura com contraste forte.
    */

    if(text.replace(/\s/g,"").length<30){

      setStatus(
        "A melhorar a imagem para outra leitura…",
        .78
      );

      const image2=preprocessForOCR(
        scannedCanvas,
        "strong"
      );

      const result2=await worker.recognize(
        await canvasBlob(image2)
      );

      const text2=result2?.data?.text||"";

      if(text2.length>text.length){
        text=text2;
      }
    }

    await worker.terminate();

    text=cleanOCR(text);

    setStatus(
      "A interpretar os dados encontrados…",
      .88
    );

    const parsed={

      supplier:parseSupplier(text),

      nif:parseNIF(text),

      date:parseDate(text),

      total:parseTotal(text),

      vat:parseVAT(text),

      documentNumber:parseDocumentNumber(text),

      category:categoryFromText(text)
    };

    fillForm(parsed,text);

    setStatus(
      "Leitura concluída. Confirma os dados antes de guardar.",
      1
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Não consegui concluir a leitura. Podes preencher os campos manualmente.",
      1
    );

  }finally{

    ocrRunning=false;
  }
}

/* =========================================================
   FORM
========================================================= */

function fillForm(data,text){

  const form=document.querySelector("[data-form]");

  if(!form)return;

  const set=(selector,value)=>{

    const input=form.querySelector(selector);

    if(
      input &&
      value!==null &&
      value!==undefined &&
      value!==""
    ){
      input.value=value;
    }
  };

  set(
    "[data-supplier]",
    data.supplier
  );

  set(
    "[data-nif]",
    data.nif
  );

  set(
    "[data-date]",
    data.date?.iso
  );

  if(data.total){
    set(
      "[data-total]",
      data.total.value
        .toLocaleString("pt-PT",{
          minimumFractionDigits:2,
          maximumFractionDigits:2
        })
    );
  }

  if(data.vat!==null){
    set(
      "[data-vat]",
      data.vat.toLocaleString("pt-PT",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      })
    );
  }

  set(
    "[data-doc]",
    data.documentNumber
  );

  if(
    data.category &&
    data.category!=="Outros"
  ){
    set(
      "[data-category]",
      data.category
    );
  }

  const ocr=form.querySelector("[data-ocr-text]");

  if(ocr){
    ocr.value=text;
  }

  /*
    Chips de confirmação
  */

  const chips=form.querySelector("[data-chips]");

  if(chips){

    chips.innerHTML="";

    function chip(label,ok){

      const c=document.createElement("span");

      c.className=
        "chip "+(ok?"ok":"warn");

      c.textContent=label;

      chips.appendChild(c);
    }

    chip(
      data.supplier?
        "✓ Fornecedor":
        "⚠ Fornecedor",
      !!data.supplier
    );

    chip(
      data.nif?
        "✓ NIF":
        "⚠ NIF",
      !!data.nif
    );

    chip(
      data.date?
        "✓ Data":
        "⚠ Data",
      !!data.date
    );

    chip(
      data.total?
        "✓ Total":
        "⚠ Total",
      !!data.total
    );

    chip(
      data.vat!==null?
        "✓ IVA":
        "IVA não detetado",
      data.vat!==null
    );

    chip(
      data.documentNumber?
        "✓ Documento":
        "N.º não detetado",
      !!data.documentNumber
    );
  }
}

async function openCamera(){

  if(!navigator.mediaDevices?.getUserMedia){

    const input=document.createElement("input");

    input.type="file";
    input.accept="image/*";
    input.capture="environment";

    input.onchange=async()=>{

      const file=input.files?.[0];

      if(file){
        const canvas=await fileToCanvas(file);
        processImage(canvas);
      }
    };

    input.click();

    return;
  }

  try{

    cameraStream=await navigator.mediaDevices.getUserMedia({

      audio:false,

      video:{
        facingMode:{
          ideal:"environment"
        },

        width:{
          ideal:1920
        },

        height:{
          ideal:2560
        }
      }
    });

  }catch{

    const input=document.createElement("input");

    input.type="file";
    input.accept="image/*";
    input.capture="environment";

    input.onchange=async()=>{

      const file=input.files?.[0];

      if(file){
        const canvas=await fileToCanvas(file);
        processImage(canvas);
      }
    };

    input.click();

    return;
  }

  const overlay=el(
    "div",
    {class:"camera"}
  );

  const video=el(
    "video",
    {
      autoplay:"true",
      playsinline:"true"
    }
  );

  video.autoplay=true;
  video.playsInline=true;
  video.srcObject=cameraStream;

  const ui=el(
    "div",
    {class:"camera-ui"}
  );

  ui.innerHTML=`
    <div class="camera-hint">
      Enquadra a fatura dentro da moldura
    </div>

    <div class="camera-frame"></div>
  `;

  const bottom=el(
    "div",
    {class:"camera-bottom"}
  );

  const close=el(
    "button",
    {class:"camera-link",type:"button"},
    "Fechar"
  );

  const shutter=el(
    "button",
    {
      class:"shutter",
      type:"button",
      "aria-label":"Fotografar"
    }
  );

  const gallery=el(
    "button",
    {class:"camera-link",type:"button"},
    "Galeria"
  );

  bottom.append(
    close,
    shutter,
    gallery
  );

  overlay.append(
    video,
    ui,
    bottom
  );

  document.body.appendChild(overlay);

  await video.play().catch(()=>{});

  function closeCamera(){

    if(cameraStream){

      cameraStream
        .getTracks()
        .forEach(track=>track.stop());

      cameraStream=null;
    }

    overlay.remove();
  }

  close.onclick=closeCamera;

  gallery.onclick=()=>{

    closeCamera();

    const input=document.createElement("input");

    input.type="file";
    input.accept="image/*";

    input.onchange=async()=>{

      const file=input.files?.[0];

      if(file){
        const canvas=await fileToCanvas(file);
        processImage(canvas);
      }
    };

    input.click();
  };

  shutter.onclick=()=>{

    if(!video.videoWidth)return;

    const canvas=document.createElement("canvas");

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    canvas
      .getContext("2d")
      .drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

    closeCamera();

    processImage(
      resizeCanvas(canvas)
    );
  };
}

/* =========================================================
   PROCESS IMAGE
========================================================= */

async function processImage(canvas){

  originalCanvas=canvas;

  showProcessing(canvas);

  /*
    Pequena pausa para a animação parecer natural.
  */

  await new Promise(r=>setTimeout(r,250));

  const rect=detectDocument(canvas);

  cropRect=rect || {
    x:0,
    y:0,
    w:canvas.width,
    h:canvas.height
  };

  scannedCanvas=createScan(
    canvas,
    cropRect
  );

  const processing=document.querySelector(".processing");

  if(processing){

    processing.querySelector(
      '[data-step="1"]'
    )?.classList.add("done");

    processing.querySelector(
      '[data-step="2"]'
    )?.classList.add("active");

    await new Promise(r=>setTimeout(r,350));

    processing.querySelector(
      '[data-step="2"]'
    )?.classList.add("done");

    processing.querySelector(
      '[data-step="3"]'
    )?.classList.add("active");

    await new Promise(r=>setTimeout(r,300));

    processing.remove();
  }

  openReview({
    manual:false
  });

  runOCR();
}

/* =========================================================
   PROCESSING UI
========================================================= */

function showProcessing(canvas){

  const overlay=el(
    "div",
    {class:"processing"}
  );

  const card=el(
    "div",
    {class:"processing-card"}
  );

  const preview=el(
    "div",
    {class:"processing-preview"}
  );

  const mini=document.createElement("canvas");

  const scale=Math.min(
    1,
    450/Math.max(
      canvas.width,
      canvas.height
    )
  );

  mini.width=Math.round(canvas.width*scale);
  mini.height=Math.round(canvas.height*scale);

  mini
    .getContext("2d")
    .drawImage(
      canvas,
      0,
      0,
      mini.width,
      mini.height
    );

  preview.append(
    mini,
    el("div",{class:"laser"})
  );

  card.innerHTML+=`
    <h2>A digitalizar</h2>

    <p>
      Estamos a transformar a fotografia
      numa digitalização limpa.
    </p>

    <div class="processing-step active" data-step="1">
      ⟳ Detetar folha
    </div>

    <div class="processing-step" data-step="2">
      ⟳ Recortar e limpar documento
    </div>

    <div class="processing-step" data-step="3">
      ⟳ Ler dados da fatura
    </div>
  `;

  card.prepend(preview);

  overlay.appendChild(card);

  document.body.appendChild(overlay);
}

/* =========================================================
   PREVIEW
========================================================= */

function drawScanPreview(original=false){

  const canvas=document.querySelector(
    "[data-scan-preview]"
  );

  if(!canvas)return;

  const source=
    original?
      originalCanvas:
      scannedCanvas;

  if(!source)return;

  canvas.width=source.width;
  canvas.height=source.height;

  canvas
    .getContext("2d")
    .drawImage(source,0,0);
}

function adjustCrop(factor){

  if(!originalCanvas || !cropRect)return;

  const old=cropRect;

  const nw=Math.min(
    originalCanvas.width,
    old.w*factor
  );

  const nh=Math.min(
    originalCanvas.height,
    old.h*factor
  );

  const cx=old.x+old.w/2;
  const cy=old.y+old.h/2;

  cropRect={
    x:Math.max(
      0,
      Math.min(
        originalCanvas.width-nw,
        cx-nw/2
      )
    ),

    y:Math.max(
      0,
      Math.min(
        originalCanvas.height-nh,
        cy-nh/2
      )
    ),

    w:nw,
    h:nh
  };

  scannedCanvas=createScan(
    originalCanvas,
    cropRect
  );

  drawScanPreview();

  /*
    Se o utilizador alterar o recorte,
    fazemos nova leitura.
  */

  if(!ocrRunning){
    runOCR();
  }
}

/* =========================================================
   SAVE
========================================================= */

function parseUserMoney(value){
  return euroNumber(value);
}

async function saveCurrentInvoice(form){

  const supplier=
    form.querySelector("[data-supplier]").value.trim();

  const nif=
    form.querySelector("[data-nif]").value
      .replace(/\D/g,"");

  const date=
    form.querySelector("[data-date]").value;

  const docNumber=
    form.querySelector("[data-doc]").value.trim();

  const total=
    parseUserMoney(
      form.querySelector("[data-total]").value
    );

  const vat=
    parseUserMoney(
      form.querySelector("[data-vat]").value
    );

  const category=
    form.querySelector("[data-category]").value;

  const vehicle=
    form.querySelector("[data-vehicle]").value.trim();

  const km=
    form.querySelector("[data-km]").value.trim();

  const project=
    form.querySelector("[data-project]").value.trim();

  const notes=
    form.querySelector("[data-notes]").value.trim();

  const status=
    form.querySelector("[data-ocr-status]");

  if(
    form.querySelector("[data-total]").value.trim() &&
    total===null
  ){
    status.textContent=
      "O total introduzido não é válido.";
    return;
  }

  if(
    form.querySelector("[data-vat]").value.trim() &&
    vat===null
  ){
    status.textContent=
      "O IVA introduzido não é válido.";
    return;
  }

  if(
    nif &&
    nif.length!==9
  ){
    status.textContent=
      "O NIF deve ter 9 dígitos.";
    return;
  }

  let image=null;

  if(scannedCanvas){

    image=await canvasBlob(
      scannedCanvas
    );
  }

  /*
    Evita guardar duas vezes exatamente
    a mesma fatura.
  */

  const invoices=await getInvoices();

  const duplicate=invoices.some(item=>
    item.nif &&
    nif &&
    item.nif===nif &&
    item.issuedDate===date &&
    item.total===total
  );

  if(
    duplicate &&
    !confirm(
      "Já existe uma fatura com o mesmo NIF, data e total.\n\nGuardar novamente?"
    )
  ){
    return;
  }

  const invoice={

    id:
      crypto.randomUUID?
      crypto.randomUUID():
      String(Date.now()),

    createdAt:Date.now(),

    issuedDate:
      /^\d{4}-\d{2}-\d{2}$/.test(date)?
      date:
      null,

    month:
      date?
      date.slice(0,7):
      "sem-data",

    supplier,

    nif,

    documentNumber:docNumber,

    vat,

    total,

    category,

    vehicle,

    km,

    project,

    notes,

    ocrText:
      form.querySelector("[data-ocr-text]")?.value||"",

    image
  };

  try{

    await saveInvoice(invoice);

    originalCanvas=null;
    scannedCanvas=null;
    cropRect=null;

    showDocuments();

  }catch(error){

    console.error(error);

    status.textContent=
      "Não foi possível guardar a fatura.";
  }
}

/* =========================================================
   DOCUMENTS
========================================================= */

function monthLabel(key){

  if(key==="sem-data"){
    return "Sem data";
  }

  const [
    year,
    month
  ]=key.split("-");

  const names=[
    "Janeiro",
    "Fevereiro",
    "Março",
    "Abril",
    "Maio",
    "Junho",
    "Julho",
    "Agosto",
    "Setembro",
    "Outubro",
    "Novembro",
    "Dezembro"
  ];

  return `${names[Number(month)-1]} ${year}`;
}

function showDocuments(){

  const shell=renderShell();

  activateTab("documents");

  const main=shell.main;

  main.innerHTML=`
    <p class="kicker">
      Arquivo
    </p>

    <h1 class="page-title">
      Faturas
    </h1>
  `;

  const search=el(
    "input",
    {
      class:"search",
      type:"search",
      placeholder:"Pesquisar fornecedor, NIF ou documento"
    }
  );

  const list=el(
    "div"
  );

  main.append(
    search,
    list
  );

  let invoices=[];

  getInvoices()
    .then(result=>{

      invoices=result;

      paint();
    })
    .catch(()=>{

      list.innerHTML=`
        <div class="warn">
          Não foi possível abrir o arquivo.
        </div>
      `;
    });

  function paint(){

    list.innerHTML="";

    const query=normalize(
      search.value
    );

    const filtered=invoices.filter(item=>{

      const hay=normalize(`
        ${item.supplier||""}
        ${item.nif||""}
        ${item.documentNumber||""}
        ${item.notes||""}
        ${item.category||""}
      `);

      return !query || hay.includes(query);
    });

    if(!filtered.length){

      list.innerHTML=`
        <p class="status">
          Não existem documentos para apresentar.
        </p>
      `;

      return;
    }

    const groups=new Map();

    filtered.forEach(item=>{

      const key=
        item.month||
        "sem-data";

      if(!groups.has(key)){
        groups.set(key,[]);
      }

      groups.get(key).push(item);
    });

    const keys=[...groups.keys()]
      .sort((a,b)=>{

        if(a==="sem-data")return 1;
        if(b==="sem-data")return -1;

        return a<b?1:-1;
      });

    keys.forEach(month=>{

      const items=groups.get(month);

      let total=0;
      let vat=0;

      const categories=new Map();

      items.forEach(item=>{

        if(item.total!==null){
          total+=item.total;

          categories.set(
            item.category,
            (categories.get(item.category)||0)+item.total
          );
        }

        if(item.vat!==null){
          vat+=item.vat;
        }
      });

      const card=el(
        "section",
        {class:"card"}
      );

      card.innerHTML=`

        <div class="month-head">
          <h2>
            ${monthLabel(month)}
          </h2>

          <div class="total">
            ${formatEuro(total)}
          </div>
        </div>

        <p class="status">
          ${items.length} documento(s)
          · IVA ${formatEuro(vat)}
        </p>

        ${
          [...categories.entries()]
            .map(([cat,value])=>`
              <div class="sub">
                <span>${escapeHTML(cat)}</span>
                <strong>${formatEuro(value)}</strong>
              </div>
            `)
            .join("")
        }

      `;

      items.forEach(item=>{

        const article=el(
          "article",
          {class:"item"}
        );

        const imageUrl=
          URL.createObjectURL(item.image);

        objectUrls.push(imageUrl);

        const date=item.issuedDate?
          item.issuedDate
            .split("-")
            .reverse()
            .join("/"):
          "Sem data";

        article.innerHTML=`

          <img
            src="${imageUrl}"
            alt="Digitalização da fatura"
          >

          <div>

            <h3>
              ${escapeHTML(
                item.supplier||"Fornecedor não identificado"
              )}
            </h3>

            <p>
              ${date}
              ·
              ${escapeHTML(item.category)}
              ·
              ${formatEuro(item.total)}
            </p>

            ${
              item.nif?
              `<p>NIF ${escapeHTML(item.nif)}</p>`:
              ""
            }

            ${
              item.documentNumber?
              `<p>${escapeHTML(item.documentNumber)}</p>`:
              ""
            }

            <div class="row" style="margin-top:8px">

              <button
                class="btn secondary small"
                data-edit="${item.id}"
              >
                Corrigir
              </button>

              <button
                class="btn danger small"
                data-delete="${item.id}"
              >
                Apagar
              </button>

            </div>

          </div>
        `;

        card.append(article);
      });

      list.append(card);
    });

    list
      .querySelectorAll("[data-delete]")
      .forEach(button=>{

        button.onclick=async()=>{

          if(
            !confirm(
              "Apagar esta fatura?"
            )
          )return;

          await deleteInvoice(
            button.dataset.delete
          );

          showDocuments();
        };
      });

    list
      .querySelectorAll("[data-edit]")
      .forEach(button=>{

        button.onclick=async()=>{

          const item=invoices.find(
            x=>x.id===button.dataset.edit
          );

          if(item){
            editInvoice(item);
          }
        };
      });
  }

  search.oninput=paint;
}

async function showAnalysis(exportMode=false){

  const shell=renderShell();

  activateTab(
    exportMode?
    "export":
    "analysis"
  );

  const main=shell.main;

  main.innerHTML=`

    <p class="kicker">
      ${exportMode?"Partilhar":"Resumo"}
    </p>

    <h1 class="page-title">
      ${exportMode?"Exportar":"Análise"}
    </h1>
  `;

  const invoices=await getInvoices();

  if(!invoices.length){

    main.innerHTML+=`
      <p class="status">
        Ainda não existem faturas.
      </p>
    `;

    return;
  }

  const months=[
    ...new Set(
      invoices.map(
        x=>x.month||"sem-data"
      )
    )
  ].sort((a,b)=>a<b?1:-1);

  const card=el(
    "section",
    {class:"card"}
  );

  const select=el(
    "select"
  );

  months.forEach(month=>{

    const option=el("option");

    option.value=month;
    option.textContent=monthLabel(month);

    select.append(option);
  });

  const stats=el(
    "div",
    {style:"margin-top:14px"}
  );

  const buttons=el(
    "div",
    {class:"row"}
  );

  const csv=el(
    "button",
    {
      class:"btn secondary",
      type:"button"
    },
    "CSV / Excel"
  );

  const pdf=el(
    "button",
    {
      class:"btn primary",
      type:"button"
    },
    "PDF"
  );

  buttons.append(
    csv,
    pdf
  );

  card.append(
    select,
    stats,
    buttons
  );

  main.append(card);

  function monthItems(){

    return invoices.filter(
      item=>
        (item.month||"sem-data")===
        select.value
    );
  }

  function paintStats(){

    const items=monthItems();

    let total=0;
    let vat=0;

    const categories=new Map();

    items.forEach(item=>{

      if(item.total!==null){

        total+=item.total;

        categories.set(
          item.category,
          (categories.get(item.category)||0)+item.total
        );
      }

      if(item.vat!==null){
        vat+=item.vat;
      }
    });

    stats.innerHTML=`

      <div class="month-head">
        <h2>
          ${items.length} documentos
        </h2>

        <div class="total">
          ${formatEuro(total)}
        </div>
      </div>

      <p class="status">
        IVA: ${formatEuro(vat)}
      </p>

      ${
        [...categories.entries()]
          .map(([cat,value])=>`
            <div class="sub">
              <span>${escapeHTML(cat)}</span>
              <strong>${formatEuro(value)}</strong>
            </div>
          `)
          .join("")
      }
    `;
  }

  select.onchange=paintStats;

  paintStats();

  csv.onclick=async()=>{

    const items=monthItems();

    const headers=[
      "Data",
      "Fornecedor",
      "NIF",
      "Documento",
      "Categoria",
      "IVA",
      "Total",
      "Notas"
    ];

    const rows=[
      headers.join(";")
    ];

    function csvCell(value){

      return `"${String(value??"")
        .replace(/"/g,'""')}"`;
    }

    items.forEach(item=>{

      rows.push([
        item.issuedDate||"",
        item.supplier||"",
        item.nif||"",
        item.documentNumber||"",
        item.category||"",
        item.vat??"",
        item.total??"",
        item.notes||""
      ].map(csvCell).join(";"));
    });

    const blob=new Blob(
      ["\uFEFF"+rows.join("\r\n")],
      {
        type:"text/csv;charset=utf-8"
      }
    );

    downloadBlob(
      blob,
      `faturas-${select.value}.csv`
    );
  };

  pdf.onclick=()=>{

    /*
      PDF simples sem biblioteca externa.
      Abre uma página imprimível e o utilizador
      pode escolher "Guardar como PDF".
    */

    const items=monthItems();

    const total=items.reduce(
      (sum,item)=>
        sum+(item.total||0),
      0
    );

    const html=`

      <!DOCTYPE html>

      <html lang="pt-PT">

      <head>

        <meta charset="utf-8">

        <title>
          Faturas ${select.value}
        </title>

        <style>

          body{
            font-family:Arial,sans-serif;
            color:#111;
            padding:30px;
          }

          header{
            display:flex;
            justify-content:space-between;
            border-bottom:4px solid #EB0A1E;
            padding-bottom:12px;
            margin-bottom:20px;
          }

          h1{
            margin:0;
          }

          table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
          }

          th,td{
            padding:8px;
            border-bottom:1px solid #ddd;
            text-align:left;
          }

          th:last-child,
          td:last-child{
            text-align:right;
          }

          .total{
            font-size:22px;
            font-weight:bold;
            margin-top:20px;
          }

        </style>

      </head>

      <body>

        <header>

          <h1>
            TOYOTA FATURAS
          </h1>

          <strong>
            ${monthLabel(select.value)}
          </strong>

        </header>

        <table>

          <thead>

            <tr>
              <th>Data</th>
              <th>Fornecedor</th>
              <th>NIF</th>
              <th>Categoria</th>
              <th>Total</th>
            </tr>

          </thead>

          <tbody>

            ${items.map(item=>`

              <tr>

                <td>
                  ${
                    item.issuedDate?
                    item.issuedDate.split("-").reverse().join("/"):
                    ""
                  }
                </td>

                <td>
                  ${escapeHTML(item.supplier||"")}
                </td>

                <td>
                  ${escapeHTML(item.nif||"")}
                </td>

                <td>
                  ${escapeHTML(item.category||"")}
                </td>

                <td>
                  ${formatEuro(item.total)}
                </td>

              </tr>

            `).join("")}

          </tbody>

        </table>

        <div class="total">
          Total: ${formatEuro(total)}
        </div>

        <script>
          window.onload=()=>{
            setTimeout(()=>{
              window.print();
            },400);
          };
        <\/script>

      </body>

      </html>
    `;

    const popup=window.open(
      "",
      "_blank"
    );

    if(popup){

      popup.document.open();
      popup.document.write(html);
      popup.document.close();

    }else{

      alert(
        "O navegador bloqueou a janela do PDF. Permite pop-ups para esta aplicação."
      );
    }
  };
}

/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(blob,name){

  const url=
    URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=name;

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);
}

/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{
    objectUrls.forEach(
      url=>URL.revokeObjectURL(url)
    );

    if(cameraStream){

      cameraStream
        .getTracks()
        .forEach(track=>track.stop());
    }
  }
);

showHome();

</script>
