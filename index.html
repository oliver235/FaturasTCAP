    function showHome() {
      setTab("nova");
      nav.classList.remove("ft-hidden");
      main.replaceChildren();
      const card = el("section", { class: "ft-card" });
      card.innerHTML = `
      <h2 class="ft-lead">O talão inteiro, fundo branco.</h2>
      <p class="ft-muted">A data está no topo. O total e o QR estão em baixo. Enquadra o papel todo, em cima da mesa.</p>
      <ol class="ft-steps">
        <li><span class="ft-num">1</span><span>Fotografa com a câmara traseira.</span></li>
        <li><span class="ft-num">2</span><span>Confirma a data de emissão e o total. Se não ler, escreve tu — a app não inventa.</span></li>
        <li><span class="ft-num">3</span><span>No arquivo, exporta o PDF do mês.</span></li>
      </ol>`;
      const shoot = el("button", { class: "ft-btn", type: "button" });
      shoot.textContent = "Fotografar talão";
      const gallery = el("button", { class: "ft-btn secondary", type: "button" });
      gallery.textContent = "Escolher da galeria";
      shoot.addEventListener("click", () => void openCamera());
      gallery.addEventListener("click", () => fileLib.click());
      main.append(card, shoot, gallery);
    }
    async function openCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        fileCam.click();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 2560 }
          }
        });
      } catch {
        fileCam.click();
        return;
      }
      nav.classList.add("ft-hidden");
      const wrap = el("div", { class: "ft-cam" });
      const video = el("video", { playsinline: "true", autoplay: "true", muted: "true" });
      video.playsInline = true;
      video.muted = true;
      video.autoplay = true;
      video.srcObject = stream;
      const bar = el("div", { class: "ft-cam-bar" });
      const cancel = el("button", { class: "link", type: "button" });
      cancel.textContent = "Fechar";
      const shutter = el("button", { class: "ft-shutter", type: "button", "aria-label": "Disparar" });
      const spacer = el("button", { class: "link", type: "button" });
      spacer.textContent = "Galeria";
      bar.append(cancel, shutter, spacer);
      wrap.append(video, bar);
      root2.append(wrap);
      await video.play().catch(() => undefined);
      const close = () => {
        stream.getTracks().forEach((t) => t.stop());
        wrap.remove();
        nav.classList.remove("ft-hidden");
      };
      cancel.addEventListener("click", close);
      spacer.addEventListener("click", () => {
        close();
        fileLib.click();
      });
      shutter.addEventListener("click", () => {
        const w = video.videoWidth;
        const h = video.videoHeight;
        if (!w || !h) return;
        const shot = document.createElement("canvas");
        shot.width = w;
        shot.height = h;
        shot.getContext("2d")?.drawImage(video, 0, 0);
        close();
        void beginReview(limitCanvas(shot, 1800));
      });
    }
    async function beginReview(full) {
      source = full;
      const ctx = full.getContext("2d", { willReadFrequently: true });
      const data = ctx?.getImageData(0, 0, full.width, full.height);
      const found = data ? detectReceiptCropFromRGBA(data.data, full.width, full.height) : null;
      cropFailed = !found;
      rect = found ?? { x: 0, y: 0, w: full.width, h: full.height };
      scan = renderScan(full, rect);
      setTab("nova");
      nav.classList.remove("ft-hidden");
      paintReview();
      void runOcr();
    }
    function paintReview() {
      if (!scan || !rect || !source) return;
      main.replaceChildren();
      const figure = el("section", { class: "ft-card" });
      const view = el("canvas", { class: "ft-scan" });
      view.width = scan.width;
      view.height = scan.height;
      view.getContext("2d")?.drawImage(scan, 0, 0);
      const tools = el("div", { class: "ft-row" });
      const tighter = el("button", { class: "ft-btn ghost", type: "button" });
      tighter.textContent = "Apertar bordas";
      const wider = el("button", { class: "ft-btn ghost", type: "button" });
      wider.textContent = "Alargar bordas";
      const whole = el("button", { class: "ft-btn ghost", type: "button" });
      whole.textContent = "Usar foto inteira";
      tools.append(tighter, wider);
      figure.append(view, tools, whole);
      if (cropFailed) {
        const warn = el("p", { class: "ft-warn" });
        warn.textContent = "Não isolei o talão com segurança. Está a foto inteira — aperta ou alarga as bordas se precisares.";
        figure.append(warn);
      }
      const again = el("button", { class: "ft-btn secondary", type: "button" });
      again.textContent = "Repetir foto";
      const form = el("section", { class: "ft-card" });
      form.innerHTML = `
      <p class="ft-status ft-muted" data-status>A preparar a leitura…</p>
      <label>Data de emissão
        <input data-date type="date" inputmode="numeric" />
      </label>
      <p class="ft-muted" data-date-hint>Tem de ser a data impressa no talão, não a de hoje.</p>
      <label>Total pago (€)
        <input data-total inputmode="decimal" placeholder="ex.: 6,69" autocomplete="off" />
      </label>
      <label>Categoria
        <select data-cat>${CATEGORIES.map((c) => `<option${c === "Outros" ? " selected" : ""}>${c}</option>`).join("")}</select>
      </label>
      <label>Notas
        <input data-notes maxlength="180" placeholder="opcional" />
      </label>
      <label>Texto lido
        <textarea data-ocr readonly placeholder="O texto cru do OCR aparece aqui."></textarea>
      </label>`;
      const reread = el("button", { class: "ft-btn secondary", type: "button" });
      reread.textContent = "Ler outra vez";
      const save = el("button", { class: "ft-btn", type: "button" });
      save.textContent = "Guardar no telemóvel";
      main.append(figure, again, form, reread, save);
      const apply = () => {
        if (!source || !rect) return;
        scan = renderScan(source, rect);
        view.width = scan.width;
        view.height = scan.height;
        view.getContext("2d")?.drawImage(scan, 0, 0);
      };
      tighter.addEventListener("click", () => {
        if (!source || !rect) return;
        rect = shrinkRect(rect, source.width, source.height, 0.04);
        cropFailed = false;
        apply();
      });
      wider.addEventListener("click", () => {
        if (!source || !rect) return;
        rect = expandRect(rect, source.width, source.height, 0.06);
        apply();
      });
      whole.addEventListener("click", () => {
        if (!source) return;
        rect = { x: 0, y: 0, w: source.width, h: source.height };
        cropFailed = false;
        apply();
      });
      again.addEventListener("click", () => void openCamera());
      reread.addEventListener("click", () => {
        if (fieldsBusy()) return;
        const f = reviewFields();
        if (f.date) f.date.value = "";
        if (f.total) f.total.value = "";
        if (f.ocr) f.ocr.value = "";
        void runOcr();
      });
      save.addEventListener("click", () => void onSave());
    }
    function reviewFields() {
      return {
        status: main.querySelector("[data-status]"),
        date: main.querySelector("[data-date]"),
        dateHint: main.querySelector("[data-date-hint]"),
        total: main.querySelector("[data-total]"),
        cat: main.querySelector("[data-cat]"),
        notes: main.querySelector("[data-notes]"),
        ocr: main.querySelector("[data-ocr]")
      };
    }
    function fieldsBusy() {
      return reading;
    }
    async function runOcr() {
      if (!scan || reading) return;
      reading = true;
      const fields = reviewFields();
      const setStatus = (s) => {
        if (fields.status) fields.status.textContent = s;
      };
      try {
        const text = await readReceipt(scan, setStatus);
        if (fields.ocr) fields.ocr.value = text.trim();
        const date = parseEmissionDate(text);
        const total = parseTotal(text);
        const cat = categorize(text);
        if (date && fields.date && !fields.date.value) {
          fields.date.value = date.iso;
          if (fields.dateHint) fields.dateHint.textContent = `Lida no talão: ${date.display}`;
        } else if (!date && fields.dateHint) {
          fields.dateHint.textContent = "Não li a data de emissão. Preenche à mão — não uso a data de hoje.";
        }
        if (total && fields.total && !fields.total.value) {
          fields.total.value = total.euros.toLocaleString("pt-PT", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });
        }
        if (fields.cat && cat !== "Outros") fields.cat.value = cat;
        const bits = [
          date ? `Data ${date.display}` : "Data não lida",
          total ? `Total ${formatEuros(total.euros)}` : "Total não lido",
          cat
        ];
        setStatus(bits.join(" · ") + ". Confirma antes de guardar.");
      } catch {
        setStatus("Não consegui ler o talão. Preenche a data e o total à mão — não invento valores.");
      } finally {
        reading = false;
      }
    }
    async function onSave() {
      if (busy || !scan) return;
      const fields = reviewFields();
      const iso = fields.date?.value ?? "";
      const issuedDate = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso : null;
      const total = parseUserTotal(fields.total?.value ?? "");
      if ((fields.total?.value ?? "").trim() && total == null) {
        if (fields.status) fields.status.textContent = "Total inválido. Usa 6,69 ou deixa vazio.";
        return;
      }
      busy = true;
      try {
        const image = await canvasToBlob(scan);
        const fatura = {
          id: crypto.randomUUID(),
          createdAt: Date.now(),
          issuedDate,
          month: monthKeyFromIso(issuedDate),
          category: fields.cat?.value || "Outros",
          total,
          notes: fields.notes?.value.trim() ?? "",
          ocrText: fields.ocr?.value ?? "",
          image
        };
        await saveFatura(fatura);
        source = null;
        scan = null;
        rect = null;
        await showArchive();
      } catch {
        if (fields.status) {
          fields.status.textContent = "Não consegui guardar no telemóvel. Tenta outra vez.";
        }
      } finally {
        busy = false;
      }
    }
    async function showArchive() {
      setTab("arquivo");
      nav.classList.remove("ft-hidden");
      revoke();
      main.replaceChildren();
      let rows = [];
      try {
        rows = await listFaturas();
      } catch {
        const p = el("p", { class: "ft-warn" });
        p.textContent = "Não consegui abrir o arquivo neste browser.";
        main.append(p);
        return;
      }
      if (!rows.length) {
        const card = el("section", { class: "ft-card" });
        card.innerHTML = `<h2 class="ft-lead">Ainda não há faturas.</h2><p class="ft-muted">Fotografa um talão. Fica só neste iPhone, sem conta.</p>`;
        main.append(card);
        return;
      }
      const groups = new Map();
      for (const row of rows) {
        const key = row.month || "sem-data";
        const list = groups.get(key) ?? [];
        list.push(row);
        groups.set(key, list);
      }
      const keys = [...groups.keys()].sort((a, b) => {
        if (a === "sem-data") return 1;
        if (b === "sem-data") return -1;
        return a < b ? 1 : -1;
      });
      for (const key of keys) {
        const items = groups.get(key) ?? [];
        const card = el("section", { class: "ft-card" });
        const sums = new Map();
        let grand = 0;
        for (const item of items) {
          if (item.total == null) continue;
          sums.set(item.category, (sums.get(item.category) ?? 0) + item.total);
          grand += item.total;
        }
        const head = el("div", { class: "ft-month" });
        head.innerHTML = `<h2>${formatMonthKey(key)}</h2><p class="ft-sum">${formatEuros(grand)}</p>`;
        card.append(head);
        for (const cat of CATEGORIES) {
          if (!sums.has(cat)) continue;
          const line = el("div", { class: "ft-sub" });
          line.innerHTML = `<span>${cat}</span><strong>${formatEuros(sums.get(cat) ?? 0)}</strong>`;
          card.append(line);
        }
        const pdfBtn = el("button", { class: "ft-btn", type: "button" });
        pdfBtn.textContent = "PDF deste mês";
        pdfBtn.addEventListener("click", () => {
          pdfBtn.disabled = true;
          pdfBtn.textContent = "A criar PDF…";
          void exportMonthPdf(key, items).catch(() => {
            pdfBtn.textContent = "Falhou. Tentar outra vez";
          }).finally(() => {
            pdfBtn.disabled = false;
            if (pdfBtn.textContent === "A criar PDF…") pdfBtn.textContent = "PDF deste mês";
          });
        });
        card.append(pdfBtn);
        for (const item of items) {
          const url = URL.createObjectURL(item.image);
          urls.push(url);
          const box = el("article", { class: "ft-item" });
          const when = item.issuedDate ? item.issuedDate.split("-").reverse().join("/") : "Sem data";
          box.innerHTML = `
          <img alt="Talão" src="${url}" />
          <div>
            <h3>${when}</h3>
            <p>${item.category} · ${formatEuros(item.total)}</p>
            ${item.notes ? `<p class="ft-muted">${escapeHtml(item.notes)}</p>` : ""}
            <div class="ft-row" style="margin-top:8px">
              <button type="button" class="ft-btn ghost" data-edit="${item.id}">Corrigir</button>
              <button type="button" class="ft-btn danger" data-del="${item.id}">Apagar</button>
            </div>
          </div>`;
          card.append(box);
        }
        main.append(card);
      }
      main.querySelectorAll("[data-del]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del");
          if (!id || !confirm("Apagar esta fatura deste iPhone?")) return;
          void deleteFatura(id).then(() => showArchive());
        });
      });
      main.querySelectorAll("[data-edit]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-edit");
          const item = rows.find((r) => r.id === id);
          if (!item) return;
          openEdit(item);
        });
      });
    }
    function openEdit(item) {
      main.replaceChildren();
      const card = el("section", { class: "ft-card" });
      const url = URL.createObjectURL(item.image);
      urls.push(url);
      card.innerHTML = `
      <img class="ft-scan" alt="Talão" src="${url}" />
      <label>Data de emissão
        <input data-date type="date" value="${item.issuedDate ?? ""}" />
      </label>
      <label>Total pago (€)
        <input data-total inputmode="decimal" value="${item.total == null ? "" : item.total.toLocaleString("pt-PT", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}" />
      </label>
      <label>Categoria
        <select data-cat>${CATEGORIES.map((c) => `<option ${c === item.category ? "selected" : ""}>${c}</option>`).join("")}</select>
      </label>
      <label>Notas
        <input data-notes maxlength="180" value="${escapeAttr(item.notes)}" />
      </label>
      <label>Texto lido
        <textarea readonly>${escapeHtml(item.ocrText)}</textarea>
      </label>`;
      const save = el("button", { class: "ft-btn", type: "button" });
      save.textContent = "Atualizar";
      const back = el("button", { class: "ft-btn secondary", type: "button" });
      back.textContent = "Voltar ao arquivo";
      const status = el("p", { class: "ft-muted" });
      main.append(card, save, back, status);
      back.addEventListener("click", () => void showArchive());
      save.addEventListener("click", () => {
        const date = card.querySelector("[data-date]").value;
        const totalRaw = card.querySelector("[data-total]").value;
        const total = parseUserTotal(totalRaw);
        if (totalRaw.trim() && total == null) {
          status.textContent = "Total inválido. Usa 6,69 ou deixa vazio.";
          return;
        }
        const issuedDate = /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : null;
        const next = {
          ...item,
          issuedDate,
          month: monthKeyFromIso(issuedDate),
          total,
          category: card.querySelector("[data-cat]").value,
          notes: card.querySelector("[data-notes]").value.trim()
        };
        void saveFatura(next).then(() => showArchive()).catch(() => {
          status.textContent = "Não consegui atualizar.";
        });
      });
    }
    nav.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button");
      const next = btn?.getAttribute("data-tab");
      if (next === "nova") showHome();
      if (next === "arquivo") void showArchive();
    });
    fileCam.addEventListener("change", () => {
      const file = fileCam.files?.[0];
      fileCam.value = "";
      if (file) void canvasFromFile(file).then((c) => beginReview(c));
    });
    fileLib.addEventListener("change", () => {
      const file = fileLib.files?.[0];
      fileLib.value = "";
      if (file) void canvasFromFile(file).then((c) => beginReview(c));
    });
    showHome();
  }
  function escapeHtml(s) {
    return s.replace(/\u0026/g, "&amp;").replace(/\u003c/g, "&lt;").replace(/\u003e/g, "&gt;");
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/\u0022/g, "&quot;");
  }

  var root = document.getElementById("app");
  if (root) mountFaturas(root);
})();
</script>
</body>
</html>
