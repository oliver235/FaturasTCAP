<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0B0B0C"/>
<title>Faturas pela TCAP</title>
<style>
:root{
  --bg:#070708; --card:#151518; --lift:#1C1C20; --line:rgba(255,255,255,.09);
  --ink:#F5F5F6; --mute:#8D8E92; --red:#EB0A1E; --red2:#FF2A3C;
  --ok:#3DDC97; --warn:#F5C542; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer;background:none}
.ft{min-height:100dvh;padding-bottom:calc(92px + var(--safe))}
.main{padding:18px 18px 28px}
.kicker{margin:8px 0 0;color:var(--mute);font-size:14px;font-weight:600}
.page-title{margin:4px 0 16px;font-size:40px;letter-spacing:-.045em;line-height:1}
.workspace{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;
  border:1px solid rgba(90,160,255,.35);color:#C9DCFF;font-size:13px;font-weight:700;margin-bottom:18px}
.workspace i{width:7px;height:7px;border-radius:50%;background:#5AA0FF}
.cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:18px 18px;border-radius:22px;margin-bottom:12px}
.cta.hot{background:linear-gradient(180deg,#FF4A3A,var(--red));color:#fff;
  box-shadow:0 14px 36px rgba(235,10,30,.32)}
.cta.cold{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.cta .orb{width:46px;height:46px;border-radius:50%;flex:none;
  display:grid;place-items:center;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.12)}
.cta.cold .orb{background:#0C0C0E}
.cta b{display:block;font-size:18px;letter-spacing:-.02em}
.cta span{display:block;margin-top:3px;font-size:13px;line-height:1.35;opacity:.82;font-weight:500}
.cta.cold span{color:var(--mute);opacity:1}
.fab{position:fixed;right:18px;bottom:calc(86px + var(--safe));z-index:8;
  width:62px;height:62px;border-radius:50%;background:linear-gradient(180deg,#FF4A3A,var(--red));
  color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px rgba(235,10,30,.4)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;
  display:flex;padding:6px 8px calc(8px + var(--safe));
  background:rgba(10,10,12,.94);border-top:1px solid var(--line);backdrop-filter:blur(18px)}
.nav button{flex:1;min-height:54px;color:#7A7B80;font-size:11px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav button[aria-current="page"]{color:#fff}
.nav svg{width:20px;height:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.scan-wrap{position:relative;background:#0A0A0C;border-radius:18px;overflow:hidden;margin-bottom:12px}
.scan-wrap canvas,.scan-wrap img{display:block;width:100%;height:auto;max-height:46vh;object-fit:contain;background:#0A0A0C}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:6px 10px;border-radius:999px;background:var(--lift);border:1px solid var(--line);
  font-size:12px;font-weight:700;color:#D6D6D8}
.chip.ok{background:rgba(61,220,151,.1);border-color:rgba(61,220,151,.28);color:#9BF0C9}
.chip.warn{background:rgba(245,197,66,.1);border-color:rgba(245,197,66,.28);color:#F8D97A}
.status{margin:0 0 12px;color:var(--mute);font-size:13px;line-height:1.4}
label{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;font-size:12px;font-weight:700;color:var(--mute)}
input,select,textarea{background:#0C0C0E;border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-height:48px;outline:none}
input:focus,select:focus,textarea:focus{border-color:rgba(235,10,30,.5);box-shadow:0 0 0 3px rgba(235,10,30,.12)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
details{margin:4px 0 12px} summary{font-weight:800;cursor:pointer;margin-bottom:10px}
.item{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item img{width:72px;height:72px;object-fit:cover;border-radius:12px;background:#000}
.item h3{margin:0 0 4px;font-size:16px;letter-spacing:-.02em}
.item p{margin:0;color:var(--mute);font-size:13px}
.month{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.month h2{margin:0;font-size:22px;letter-spacing:-.03em}
.sum{margin:0;font-size:22px;font-weight:800;color:var(--red)}
.sub{display:flex;justify-content:space-between;padding:8px 0;color:var(--mute);font-size:14px}
.sub strong{color:var(--ink)}
.warn{background:rgba(245,197,66,.08);border:1px solid rgba(245,197,66,.22);color:#F8D97A;border-radius:14px;padding:10px 12px;font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:999px;font-weight:800}
.btn.primary{background:linear-gradient(180deg,#FF4A3A,var(--red));color:#fff;box-shadow:0 10px 24px rgba(235,10,30,.28)}
.btn.ghost{background:var(--lift);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--lift);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#2A1215;color:#FFB4BB;border:1px solid rgba(235,10,30,.3)}
.btn.tiny{min-height:40px;font-size:13px;padding:0 12px}
.search{width:100%;margin-bottom:12px}
.cam{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover}
.cam-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px calc(18px + var(--safe))}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:6px solid #3a3a3a}
.link{color:#fff;font-weight:700;min-width:72px}
.overlay{position:fixed;inset:0;z-index:35;background:#070708;display:flex;flex-direction:column;padding:18px 18px calc(24px + var(--safe))}
.ov-card{margin:auto 0;background:#121214;border:1px solid var(--line);border-radius:28px;padding:16px}
.ov-preview{position:relative;height:210px;border-radius:20px;overflow:hidden;background:#000;display:grid;place-items:center}
.ov-preview canvas{max-width:58%;max-height:100%;object-fit:contain}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--red);top:50%;
  box-shadow:0 0 18px var(--red);animation:sweep 1.6s ease-in-out infinite}
@keyframes sweep{0%{top:12%}50%{top:86%}100%{top:12%}}
.ov-card h2{margin:18px 0 6px;text-align:center;font-size:28px;letter-spacing:-.04em}
.ov-card p.lead{margin:0 0 16px;text-align:center;color:var(--mute)}
.step-row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;
  border:1px solid var(--line);background:#0C0C0E;margin-bottom:8px;color:#C9C9CC;font-weight:700;font-size:15px}
.step-row.on{border-color:rgba(235,10,30,.55);color:#fff;box-shadow:0 0 0 1px rgba(235,10,30,.2) inset}
.step-row.done{color:#B7B8BC}
.step-row .tick{margin-left:auto;color:var(--red);font-weight:900}
.review-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:#1A1A1D;color:#fff;display:grid;place-items:center}
.mini{display:flex;gap:8px;margin:10px 0 16px;overflow:auto}
.mini button{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);
  background:#121214;color:#CFCFD2;font-size:13px;font-weight:700}
.mini button[aria-pressed="true"]{border-color:rgba(235,10,30,.5);color:#fff}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const CATS=["Combustível","Alimentação","Restauração","Estadias","Outros"];
const ico={
 home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,
 docs:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v6h6"/></svg>`,
 chart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>`,
 down:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>`,
 cam:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4V8z"/><circle cx="12" cy="13" r="3.2"/></svg>`,
 up:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></svg>`,
 form:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`
};
function $(t,a={},html){const n=document.createElement(t);for(const k in a)n.setAttribute(k,a[k]);if(html!=null)n.innerHTML=html;return n}
function fold(s){return s.replace(/[\u2010-\u2015\u2212]/g,"-").replace(/[\u00a0\u202f]/g," ").normalize("NFD").replace(/\p{M}/gu,"").toLowerCase()}
function pad(n){return String(n).padStart(2,"0")}
function validDate(y,m,d){if(y<1990||y>2099||m<1||m>12||d<1||d>31)return false;const t=new Date(Date.UTC(y,m-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d}
function expandY(y){return y>=100?y:y>=70?1900+y:2000+y}
function parseDate(text){
  const s=fold(text);const found=[];
  const push=(y,m,d,score)=>{y=expandY(y);if(!validDate(y,m,d))return;found.push({iso:`${y}-${pad(m)}-${pad(d)}`,display:`${pad(d)}/${pad(m)}/${y}`,score})};
  for(const m of s.matchAll(/(\d{4})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{1,2})/g)) push(+m[1],+m[2],+m[3],/emiss/.test(s.slice(Math.max(0,m.index-24),m.index+24))?110:20);
  for(const m of s.matchAll(/(\d{1,2})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{2,4})/g)) push(+m[3],+m[2],+m[1],/emiss/.test(s.slice(Math.max(0,m.index-24),m.index+24))?110:18);
  found.sort((a,b)=>b.score-a.score);return found[0]||null;
}
function euro(s){if(!s)return null;const x=s.replace(/\./g,"").replace(",",".");const n=Number(x);return Number.isFinite(n)?n:null}
function parseTotal(text){
  const lines=text.split(/\r?\n/);const found=[];
  const re=/\b(valor a pagar|total a pagar|valor pago|total pago|importe|a pagar|total)\b[^0-9]{0,40}(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/g;
  const prep=l=>fold(l).replace(/t[o0]ta[l1]/g,"total").replace(/(\d)\s*[,.]\s*(\d{2})\b/g,"$1,$2");
  const skip=l=>/deposito|sub\s*total|total\s+(de\s+)?(iva|imposto)|total\s+liquido/.test(l);
  for(let i=0;i<lines.length;i++){
    const blob=prep(lines[i]+" "+(lines[i+1]||""));
    if(skip(blob))continue;
    for(const m of blob.matchAll(re)){const v=euro(m[2]);if(v!=null)found.push({euros:v,index:i,score:/pagar|pago/.test(m[1])?100:50})}
  }
  found.sort((a,b)=>b.score-a.score||b.index-a.index);return found[0]||null;
}
function parseVat(text){let last=null;for(const m of fold(text).matchAll(/\biva\b(?:[^0-9\n]{0,6}\d{1,2}\s*%)?[^0-9\n]{0,14}(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/g)){const v=euro(m[1]);if(v!=null&&v>0)last=v}return last}
function nifOk(n){if(!/^\d{9}$/.test(n))return false;let s=0;for(let i=0;i<8;i++)s+=Number(n[i])*(9-i);const mod=s%11;return (mod<2?0:11-mod)===Number(n[8])}
function parseNif(text){
  for(const line of text.split(/\n/)){
    const f=fold(line);if(!/\b(nif|nipc|contribuinte)\b/.test(f)||/\b(adquirente|cliente|hospede)\b/.test(f))continue;
    for(const m of line.matchAll(/\d[\d\s.]{7,14}\d/g)){const d=m[0].replace(/\D/g,"");if(d.length===9&&nifOk(d))return d}
  }
  return null;
}
function parseSupplier(text){
  const map=[["galp","Galp"],["repsol","Repsol"],["campanile","Campanile"],["continente","Continente"],["pingo doce","Pingo Doce"],["lidl","Lidl"],["ibis","Ibis"],["pestana","Pestana"]];
  const s=fold(text);for(const [k,v] of map) if(s.includes(k)) return v;
  for(const line of text.split(/\n/).map(x=>x.trim()).slice(0,10)){
    const f=fold(line);if(f.length<5||f.length>42||/\d{2}[./-]\d{2}/.test(f)||/\b(nif|total|iva|data|original)\b/.test(f))continue;
    if(f.replace(/[^a-z]/g,"").length>=5) return line.slice(0,48);
  }
  return null;
}
function parseDoc(text){const m=text.match(/\b(?:FT|FS|FR|NC|FAT)\s*(?:Nr\.?|N[ºo.]?)?\s*[:.]?\s*[A-Z0-9][A-Z0-9./-]{2,}/i);return m?m[0].replace(/\s+/g," ").slice(0,32):null}
function categorize(text){
  const s=fold(text);
  if(/\b(galp|repsol|cepsa|prio|gasolina|gasoleo|combustivel|diesel)\b/.test(s))return "Combustível";
  if(/\b(hotel|hostel|airbnb|pousada|ibis|pestana|campan|alojamento)\b/.test(s))return "Estadias";
  if(/\b(restaurante|pastelaria|cafe|mcdonald|burger|pizza|padaria)\b/.test(s))return "Restauração";
  if(/\b(continente|pingo doce|lidl|auchan|mercadona|supermercado)\b/.test(s))return "Alimentação";
  return "Outros";
}
function monthKey(iso){return iso&&/^\d{4}-\d{2}-\d{2}$/.test(iso)?iso.slice(0,7):"sem-data"}
function monthLabel(k){if(k==="sem-data")return "Sem data";const [y,m]=k.split("-");return `${["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"][+m-1]} ${y}`}
function euros(v){return v==null||!Number.isFinite(v)?"—":v.toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"}
function userMoney(s){if(!s||!s.trim())return null;const n=Number(s.trim().replace(/\s/g,"").replace(/\./g,"").replace(",","."));return Number.isFinite(n)?n:null}
function luma(r,g,b){return (77*r+150*g+29*b)>>8}
function sat(r,g,b){const M=Math.max(r,g,b),m=Math.min(r,g,b);return M?(M-m)/M:0}
function detectRect(rgba,w,h){
  const ink=[],paper=[];
  for(let i=0;i<w*h;i++){const o=i*4,y=luma(rgba[o],rgba[o+1],rgba[o+2]),s=sat(rgba[o],rgba[o+1],rgba[o+2]);ink[i]=y<145&&s<.45;paper[i]=y>148&&s<.2}
  if(ink.filter(Boolean).length<12)return null;
  let x0=w,y0=h,x1=0,y1=0,hits=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!paper[y*w+x]&&!ink[y*w+x])continue;hits++;if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y}
  if(hits<80)return null;
  const padX=Math.round((x1-x0)*.04)+6,padY=Math.round((y1-y0)*.04)+6;
  x0=Math.max(0,x0-padX);y0=Math.max(0,y0-padY);x1=Math.min(w-1,x1+padX);y1=Math.min(h-1,y1+padY);
  const rect={x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};if(rect.h<rect.w*.28&&rect.h<h*.22)return null;return rect;
}
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open("faturas-tcap",2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("faturas"))r.result.createObjectStore("faturas",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveF(f){const db=await openDb();const tx=db.transaction("faturas","readwrite");tx.objectStore("faturas").put(f);await new Promise((a,b)=>{tx.oncomplete=a;tx.onerror=()=>b(tx.error)});db.close()}
async function listF(){const db=await openDb();const tx=db.transaction("faturas","readonly");const req=tx.objectStore("faturas").getAll();const rows=await new Promise((a,b)=>{req.onsuccess=()=>a(req.result||[]);req.onerror=()=>b(req.error)});db.close();return rows.sort((a,b)=>b.createdAt-a.createdAt)}
async function delF(id){const db=await openDb();const tx=db.transaction("faturas","readwrite");tx.objectStore("faturas").delete(id);await new Promise((a,b)=>{tx.oncomplete=a;tx.onerror=()=>b(tx.error)});db.close()}

const root=document.getElementById("app");root.className="ft";
const main=$("main",{class:"main"});
const nav=$("nav",{class:"nav"});
nav.innerHTML=`<button type="button" data-tab="nova">${ico.home}Início</button>
<button type="button" data-tab="faturas">${ico.docs}Documentos</button>
<button type="button" data-tab="resumo">${ico.chart}Análise</button>
<button type="button" data-tab="exportar">${ico.down}Exportar</button>`;
const fileCam=$("input",{type:"file",accept:"image/*",capture:"environment",class:"hidden"});
const fileLib=$("input",{type:"file",accept:"image/*",class:"hidden"});
const fab=$("button",{class:"fab","aria-label":"Fotografar",type:"button"},ico.cam);
root.append(main,nav,fab,fileCam,fileLib);

let tab="nova",source=null,rect=null,scan=null,busy=false,reading=false,urls=[],showOriginal=false;
function setTab(n){tab=n;nav.querySelectorAll("button").forEach(b=>{if(b.getAttribute("data-tab")===n)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});fab.classList.toggle("hidden",n!=="nova")}
function revoke(){urls.forEach(u=>URL.revokeObjectURL(u));urls.length=0}
function limit(src,max=1800){const s=Math.min(1,max/Math.max(src.width,src.height));if(s===1)return src;const c=document.createElement("canvas");c.width=Math.round(src.width*s);c.height=Math.round(src.height*s);c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c}
function renderScan(src,r){const sc=Math.min(1,1400/r.w);const c=document.createElement("canvas");c.width=Math.max(1,Math.round(r.w*sc));c.height=Math.max(1,Math.round(r.h*sc));const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(src,r.x,r.y,r.w,r.h,0,0,c.width,c.height);return c}
async function fromFile(file){const c=document.createElement("canvas");try{const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});c.width=bmp.width;c.height=bmp.height;c.getContext("2d").drawImage(bmp,0,0);bmp.close();return limit(c)}catch{const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext("2d").drawImage(img,0,0);return limit(c)}finally{URL.revokeObjectURL(url)}}}
function toBlob(c){return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("sem imagem")),"image/jpeg",.84))}

function showHome(){
  setTab("nova");main.replaceChildren();
  main.append(
    $("p",{class:"kicker"},"Novo registo"),
    $("h1",{class:"page-title"},"Adicionar"),
    $("div",{class:"workspace"},"<i></i> Faturas pela TCAP")
  );
  const hot=$("button",{class:"cta hot",type:"button"},`<div class="orb">${ico.cam}</div><div><b>Abrir câmara</b><span>Captura com recorte à volta da folha e leitura no telemóvel.</span></div>`);
  const native=$("button",{class:"cta cold",type:"button"},`<div class="orb">${ico.cam}</div><div><b>Câmara nativa</b><span>Abre a câmara do iPhone no modo padrão.</span></div>`);

function setStep(node,which){
  node.querySelectorAll(".step-row").forEach((el,i)=>{
    el.classList.toggle("on",i===which);
    el.classList.toggle("done",i<which);
    const t=el.querySelector(".tick");if(t)t.textContent=i<which?"✓":"";
  });
}

async function beginReview(full){
  source=full;showOriginal=false;
  nav.classList.add("hidden");fab.classList.add("hidden");
  const ov=$("div",{class:"overlay"});
  const card=$("div",{class:"ov-card"});
  const prev=$("div",{class:"ov-preview"});
  const mini=document.createElement("canvas");
  const s=Math.min(1,420/Math.max(full.width,full.height));
  mini.width=Math.round(full.width*s);mini.height=Math.round(full.height*s);
  mini.getContext("2d").drawImage(full,0,0,mini.width,mini.height);
  prev.append(mini,$("div",{class:"scanline"}));
  card.append(prev,
    $("h2",{},"A digitalizar"),
    $("p",{class:"lead"},"A endireitar e a recortar a folha."),
    $("div",{class:"step-row on"},"A recortar documento<span class='tick'></span>"),
    $("div",{class:"step-row"},"A limpar fundo<span class='tick'></span>"),
    $("div",{class:"step-row"},"A ler data e total<span class='tick'></span>")
  );
  ov.append(card);root.append(ov);
  await new Promise(r=>setTimeout(r,220));
  const ctx=full.getContext("2d",{willReadFrequently:true});
  const data=ctx.getImageData(0,0,full.width,full.height);
  const found=detectRect(data.data,full.width,full.height);
  rect=found||{x:0,y:0,w:full.width,h:full.height};
  scan=renderScan(full,rect);
  setStep(card,1);
  await new Promise(r=>setTimeout(r,280));
  setStep(card,2);
  ov.remove();
  paintReview(!found);
  runOcr();
}

    <details><summary>Viatura, km e projeto</summary>
      <label>Viatura<input data-vehicle maxlength="40"/></label>
      <label>Quilómetros<input data-km inputmode="decimal" maxlength="12"/></label>
      <label>Projeto<input data-project maxlength="60"/></label>
      <label>Notas<input data-notes maxlength="180"/></label>
    </details>
    ${manual?"":`<label>Texto lido<textarea data-ocr readonly placeholder="O texto lido aparece aqui."></textarea></label>`}`;

function fields(node){
  const q=s=>node.querySelector(s);
  return {status:q("[data-status]"),chips:q("[data-chips]"),supplier:q("[data-supplier]"),nif:q("[data-nif]"),
    date:q("[data-date]"),vat:q("[data-vat]"),total:q("[data-total]"),cat:q("[data-cat]"),doc:q("[data-doc]"),
    vehicle:q("[data-vehicle]"),km:q("[data-km]"),project:q("[data-project]"),notes:q("[data-notes]"),ocr:q("[data-ocr]")}
}

async function runOcr(){
  if(!scan||reading)return;reading=true;
  const f=fields(main);const st=s=>{if(f.status)f.status.textContent=s};
  try{
    if(!window.Tesseract) throw new Error("O leitor não carregou. Liga a internet e tenta outra vez.");
    st("A descarregar o português…");
    const worker=await Tesseract.createWorker("por",1,{logger:m=>{if(m.status==="recognizing text")st(`A ler o talão… ${Math.round((m.progress||0)*100)}%`)}});
    const blob=await toBlob(scan);
    const res=await worker.recognize(blob);
    await worker.terminate();
    const text=res.data.text||"";
    if(f.ocr)f.ocr.value=text.trim();
    const date=parseDate(text),total=parseTotal(text),vat=parseVat(text),sup=parseSupplier(text),nif=parseNif(text),doc=parseDoc(text),cat=categorize(text);
    if(sup&&f.supplier&&!f.supplier.value)f.supplier.value=sup;
    if(nif&&f.nif&&!f.nif.value)f.nif.value=nif;
    if(doc&&f.doc&&!f.doc.value)f.doc.value=doc;
    if(date&&f.date&&!f.date.value)f.date.value=date.iso;
    if(total&&f.total&&!f.total.value)f.total.value=total.euros.toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2});
    if(vat&&f.vat&&!f.vat.value)f.vat.value=vat.toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2});
    if(f.cat&&cat!=="Outros")f.cat.value=cat;
    if(f.chips){f.chips.innerHTML="";
      const add=(t,k)=>{const s=document.createElement("span");s.className="chip "+(k||"");s.textContent=t;f.chips.append(s)};
      if(date)add("Data "+date.display,"ok");else add("Data por preencher","warn");
      if(total)add("Total "+euros(total.euros),"ok");else add("Total por preencher","warn");
      if(nif)add("NIF "+nif,"ok");
      add(cat);
    }
    st([sup||"Fornecedor por confirmar",date?("Data "+date.display):"Data não encontrada",total?("Total "+euros(total.euros)):"Total não encontrado"].join(" · ")+". Confirma antes de guardar.");
  }catch(err){st("Não consegui ler. "+(err.message||err));if(f.ocr&&!f.ocr.value)f.ocr.value=String(err.message||err)}
  finally{reading=false}
}

async function onSave(form){
  if(busy||!scan)return;const f=fields(form);
  const iso=f.date.value,issued=/^\d{4}-\d{2}-\d{2}$/.test(iso)?iso:null;
  const total=userMoney(f.total.value),vat=userMoney(f.vat.value),nif=(f.nif.value||"").replace(/\D/g,"");
  if(f.total.value.trim()&&total==null){f.status.textContent="Total inválido. Usa 6,69 ou deixa em branco.";return}
  if(f.vat.value.trim()&&vat==null){f.status.textContent="IVA inválido.";return}
  try{
    const existing=await listF();
    if(existing.some(r=>nif&&r.nif===nif&&r.issuedDate===issued&&r.total===total)&&!confirm("Já tens uma fatura com o mesmo NIF, data e total. Guardar outra?"))return;
  }catch{}
  busy=true;
  try{
    const image=await toBlob(scan);
    await saveF({id:crypto.randomUUID(),createdAt:Date.now(),issuedDate:issued,month:monthKey(issued),
      category:f.cat.value,total,supplier:f.supplier.value.trim(),nif,vat,docNumber:f.doc.value.trim(),
      vehicle:f.vehicle?f.vehicle.value.trim():"",km:f.km?f.km.value.trim():"",project:f.project?f.project.value.trim():"",
      notes:f.notes?f.notes.value.trim():"",ocrText:f.ocr?f.ocr.value:"",image});
    source=scan=rect=null;await showFaturas();
  }catch{f.status.textContent="Não consegui guardar. Tenta outra vez."}
  finally{busy=false}
}

async function showFaturas(){
  setTab("faturas");revoke();main.replaceChildren();
  main.append($("p",{class:"kicker"},"Arquivo"),$("h1",{class:"page-title"},"Documentos"));
  let rows=[];try{rows=await listF()}catch{main.append($("p",{class:"warn"},"Não consegui abrir as faturas."));return}
  if(!rows.length){main.append($("p",{class:"status"},"Ainda não há documentos. Fotografa um talão."));return}
  const search=$("input",{class:"search",type:"search",placeholder:"Procurar fornecedor, NIF ou notas"});
  const list=$("div");main.append(search,list);
  const paint=()=>{
    const q=fold(search.value);list.replaceChildren();revoke();
    const vis=rows.filter(r=>!q||fold(`${r.supplier||""} ${r.nif||""} ${r.notes} ${r.category} ${r.docNumber||""}`).includes(q));
    if(!vis.length){list.append($("p",{class:"status"},"Nenhuma fatura com essa pesquisa."));return}
    const groups=new Map();for(const r of vis){const k=r.month||"sem-data";const a=groups.get(k)||[];a.push(r);groups.set(k,a)}
    const keys=[...groups.keys()].sort((a,b)=>a==="sem-data"?1:b==="sem-data"?-1:a<b?1:-1);
    for(const key of keys){
      const items=groups.get(key);let grand=0,vat=0;const sums=new Map();
      for(const it of items){if(it.total!=null){grand+=it.total;sums.set(it.category,(sums.get(it.category)||0)+it.total)}if(it.vat!=null)vat+=it.vat}
      const card=$("section",{class:"card"});
      card.innerHTML=`<div class="month"><h2>${monthLabel(key)}</h2><p class="sum">${euros(grand)}</p></div>
        <p class="status">${items.length} documentos · IVA ${euros(vat)}</p>`;
      for(const c of CATS){if(!sums.has(c))continue;card.append($("div",{class:"sub"},`<span>${c}</span><strong>${euros(sums.get(c))}</strong>`))}
      for(const it of items){
        const url=URL.createObjectURL(it.image);urls.push(url);
        const when=it.issuedDate?it.issuedDate.split("-").reverse().join("/"):"Sem data";
        const box=$("article",{class:"item"});
        box.innerHTML=`<img alt="" src="${url}"/><div>
          <h3>${(it.supplier||when).replace(/[<>]/g,"")}</h3>
          <p>${when} · ${it.category} · ${euros(it.total)}</p>
          ${it.nif?`<p>NIF ${it.nif}</p>`:""}
          <div class="row" style="margin-top:8px">
            <button class="btn soft tiny" data-edit="${it.id}" type="button">Corrigir</button>
            <button class="btn danger tiny" data-del="${it.id}" type="button">Apagar</button>
          </div></div>`;
        card.append(box);
      }
      list.append(card);
    }
    list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Apagar esta fatura?"))delF(b.dataset.del).then(showFaturas)});
    list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const it=rows.find(r=>r.id===b.dataset.edit);if(it)openEdit(it)});
  };
  search.oninput=paint;paint();
}

fileCam.onchange=()=>{const f=fileCam.files?.[0];fileCam.value="";if(f)fromFile(f).then(beginReview)};
fileLib.onchange=()=>{const f=fileLib.files?.[0];fileLib.value="";if(f)fromFile(f).then(beginReview)};
showHome();
</script>
