<!-- OCR -->

<!-- OpenCV para detecção da folha -->
<script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>

<script>
/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const APP_NAME = "Faturas TOYOTA";
const AUTHOR = "Desenvolvido por José Sousa";

const CATEGORIES = [
  "Combustível",
  "Alimentação",
  "Restauração",
  "Estadias",
  "Portagens",
  "Material",
  "Outros"
];

/* =========================================================
   HELPERS
========================================================= */

const $ = (sel,root=document) => root.querySelector(sel);

function el(tag,attrs={},html=""){
  const n=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="class") n.className=v;
    else if(k==="text") n.textContent=v;
    else n.setAttribute(k,v);
  });
  if(html) n.innerHTML=html;
  return n;
}

function escapeHTML(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function fold(s){
  return String(s||"")
    .normalize("NFD")
    .replace(/\p{M}/gu,"")
    .toLowerCase()
    .replace(/\s+/g," ");
}

function euros(v){
  if(v===null || v===undefined || !Number.isFinite(Number(v)))
    return "—";

  return Number(v).toLocaleString("pt-PT",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  })+" €";
}

function parseMoney(v){
  if(v===null || v===undefined || !String(v).trim())
    return null;

  let s=String(v)
    .replace(/\s/g,"")
    .replace("€","");

  /*
    Aceita:
    6,50
    6.50
    1.234,50
    1234,50
  */

  if(s.includes(","))
    s=s.replace(/\./g,"").replace(",",".");
  else{
    const dots=(s.match(/\./g)||[]).length;

    if(dots>1)
      s=s.replace(/\./g,"");
  }

  const n=Number(s);

  return Number.isFinite(n)?n:null;
}

function pad(n){
  return String(n).padStart(2,"0");
}

function validDate(y,m,d){
  if(y<1990 || y>2099 || m<1 || m>12 || d<1 || d>31)
    return false;

  const x=new Date(Date.UTC(y,m-1,d));

  return x.getUTCFullYear()===y &&
         x.getUTCMonth()===m-1 &&
         x.getUTCDate()===d;
}

function expandYear(y){
  if(y>=100) return y;
  return y>=70 ? 1900+y : 2000+y;
}

function parseDate(text){

  const s=fold(text);
  const candidates=[];

  const add=(y,m,d,score)=>{
    y=expandYear(y);

    if(!validDate(y,m,d))
      return;

    candidates.push({
      iso:`${y}-${pad(m)}-${pad(d)}`,
      score
    });
  };

  /*
    yyyy-mm-dd
  */

  for(const m of s.matchAll(
    /(\d{4})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{1,2})/g
  )){
    add(+m[1],+m[2],+m[3],100);
  }

  /*
    dd-mm-yyyy
  */

  for(const m of s.matchAll(
    /(\d{1,2})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{2,4})/g
  )){
    const before=s.slice(Math.max(0,m.index-30),m.index);

    add(
      +m[3],
      +m[2],
      +m[1],
      /emissao|emissão|data|documento/.test(before) ? 120 : 50
    );
  }

  candidates.sort((a,b)=>b.score-a.score);

  return candidates[0] || null;
}

/* =========================================================
   NIF
========================================================= */

function nifValid(nif){

  nif=String(nif).replace(/\D/g,"");

  if(!/^\d{9}$/.test(nif))
    return false;

  let sum=0;

  for(let i=0;i<8;i++)
    sum += Number(nif[i])*(9-i);

  const mod=sum%11;
  const digit=mod<2?0:11-mod;

  return digit===Number(nif[8]);
}

function parseNIF(text){

  const lines=text.split(/\n/);

  for(const line of lines){

    const f=fold(line);

    if(
      !/\b(nif|nipc|contribuinte|tax\s*id)\b/.test(f)
    )
      continue;

    /*
      Evita apanhar o NIF do cliente
      quando estiver claramente identificado.
    */

    if(
      /\b(adquirente|cliente|consumidor|destinatario)\b/.test(f)
    )
      continue;

    const nums=line.match(/\d[\d\s.-]{7,18}\d/g)||[];

    for(const n of nums){

      const clean=n.replace(/\D/g,"");

      if(nifValid(clean))
        return clean;
    }
  }

  /*
    segunda tentativa:
    procura qualquer NIF válido nas primeiras linhas
  */

  for(const n of text.match(/\b\d[\d .-]{7,18}\d\b/g)||[]){

    const clean=n.replace(/\D/g,"");

    if(nifValid(clean))
      return clean;
  }

  return "";
}

/* =========================================================
   TOTAL / IVA
========================================================= */

function numberPattern(){
  return "(\\d{1,3}(?:[. ]\\d{3})*(?:,\\d{2})|\\d+(?:,\\d{2})|\\d+\\.\\d{2})";
}

function parseTotal(text){

  const lines=text.split(/\n/);
  const found=[];

  const patterns=[
    new RegExp(
      "\\b(total\\s+a\\s+pagar|valor\\s+a\\s+pagar|montante\\s+a\\s+pagar|importe\\s+a\\s+pagar)\\b[^0-9]{0,30}"+numberPattern(),
      "i"
    ),

    new RegExp(
      "\\b(total|valor\\s+total|total\\s+documento)\\b[^0-9]{0,30}"+numberPattern(),
      "i"
    )
  ];

  for(let i=0;i<lines.length;i++){

    const line=fold(
      lines[i]+" "+(lines[i+1]||"")
    );

    if(
      /\bsubtotal\b|\btotal\s+iva\b|\biva\s+total\b|\bdesconto\b/.test(line)
    )
      continue;

    for(const re of patterns){

      const m=line.match(re);

      if(!m)
        continue;

      const value=parseMoney(m[m.length-1]);

      if(value!==null)
        found.push({
          value,
          score:/a pagar/.test(m[1])?120:80
        });
    }
  }

  found.sort((a,b)=>b.score-a.score);

  return found[0]?.value ?? null;
}

function parseVAT(text){

  const lines=text.split(/\n/);

  for(const line of lines){

    if(!/\biva\b/i.test(line))
      continue;

    const matches=line.match(
      /\d{1,3}(?:[. ]\d{3})*(?:,\d{2})|\d+,\d{2}|\d+\.\d{2}/g
    );

    if(!matches)
      continue;

    /*
      Normalmente o último valor da linha IVA
      é o valor do imposto.
    */

    const values=matches
      .map(parseMoney)
      .filter(v=>v!==null);

    if(values.length)
      return values[values.length-1];
  }

  return null;
}

/* =========================================================
   FORNECEDOR
========================================================= */

const KNOWN_SUPPLIERS=[
  ["galp","Galp"],
  ["repsol","Repsol"],
  ["prio","PRIO"],
  ["bp ","BP"],
  ["cepsa","CEPSA"],
  ["continente","Continente"],
  ["pingo doce","Pingo Doce"],
  ["lidl","Lidl"],
  ["auchan","Auchan"],
  ["mercadona","Mercadona"],
  ["mcdonald","McDonald's"],
  ["burger king","Burger King"],
  ["pestana","Pestana"],
  ["ibis","ibis"],
  ["campanile","Campanile"],
  ["decathlon","Decathlon"],
  ["amazon","Amazon"]
];

function parseSupplier(text){

  const f=fold(text);

  for(const [key,name] of KNOWN_SUPPLIERS){

    if(f.includes(key))
      return name;
  }

  const lines=text
    .split(/\n/)
    .map(x=>x.trim())
    .filter(Boolean);

  /*
    O fornecedor costuma aparecer nas primeiras linhas.
  */

  for(const line of lines.slice(0,12)){

    const x=fold(line);

    if(x.length<3 || x.length>60)
      continue;

    if(
      /\bnif\b|\bnipc\b|\biva\b|\btotal\b|\bfatura\b|\bfatura\b|\bdata\b|\bwww\b|\bhttp\b/.test(x)
    )
      continue;

    if(
      /^\d+$/.test(x) ||
      /^\d+[./-]\d+/.test(x)
    )
      continue;

    const letters=(x.match(/[a-z]/g)||[]).length;

    if(letters>=5)
      return line.slice(0,60);
  }

  return "";
}

/* =========================================================
   DOCUMENT NUMBER
========================================================= */

function parseDocumentNumber(text){

  const patterns=[
    /\b(?:fatura|factura|invoice|recibo|tal[aã]o)\s*(?:n[ºo°.]?|nr\.?|numero)?\s*[:#-]?\s*([A-Z0-9][A-Z0-9./-]{2,})/i,
    /\b(?:FT|FR|FS|NC)\s*[:#.-]?\s*([A-Z0-9./-]{2,})/i
  ];

  for(const re of patterns){

    const m=text.match(re);

    if(m)
      return m[1].slice(0,40);
  }

  return "";
}

/* =========================================================
   CATEGORIA
========================================================= */

function categoryFromText(text){

  const s=fold(text);

  if(
    /\b(galp|repsol|prio|cepsa|bp|gasolina|gasoleo|gasoleo|diesel|combustivel)\b/.test(s)
  )
    return "Combustível";

  if(
    /\b(hotel|ibis|pestana|campanile|hostel|pousada|alojamento|quarto)\b/.test(s)
  )
    return "Estadias";

  if(
    /\b(restaurante|cafe|café|pizza|burger|mcdonald|pastelaria|padaria|refeicao)\b/.test(s)
  )
    return "Restauração";

  if(
    /\b(continente|pingo doce|lidl|auchan|mercadona|supermercado)\b/.test(s)
  )
    return "Alimentação";

  if(
    /\b(portagem|via verde|ascendi|brisa)\b/.test(s)
  )
    return "Portagens";

  return "Outros";
}

/* =========================================================
   DATABASE
========================================================= */

function openDB(){

  return new Promise((resolve,reject)=>{

    const request=indexedDB.open("faturas-toyota-db",3);

    request.onupgradeneeded=()=>{

      const db=request.result;

      if(!db.objectStoreNames.contains("documents"))
        db.createObjectStore("documents",{keyPath:"id"});
    };

    request.onsuccess=()=>resolve(request.result);

    request.onerror=()=>reject(request.error);
  });
}

async function saveDocument(doc){

  const db=await openDB();

  const tx=db.transaction("documents","readwrite");

  tx.objectStore("documents").put(doc);

  await new Promise((resolve,reject)=>{

    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });

  db.close();
}

async function getDocuments(){

  const db=await openDB();

  const tx=db.transaction("documents","readonly");

  const req=tx.objectStore("documents").getAll();

  const result=await new Promise((resolve,reject)=>{

    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });

  db.close();

  return result.sort((a,b)=>b.createdAt-a.createdAt);
}

async function deleteDocument(id){

  const db=await openDB();

  const tx=db.transaction("documents","readwrite");

  tx.objectStore("documents").delete(id);

  await new Promise((resolve,reject)=>{

    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });

  db.close();
}

/* =========================================================
   IMAGE HELPERS
========================================================= */

async function fileToCanvas(file){

  try{

    const bitmap=await createImageBitmap(
      file,
      {imageOrientation:"from-image"}
    );

    const canvas=document.createElement("canvas");

    canvas.width=bitmap.width;
    canvas.height=bitmap.height;

    canvas.getContext("2d").drawImage(bitmap,0,0);

    bitmap.close();

    return resizeCanvas(canvas,2200);

  }catch{

    const url=URL.createObjectURL(file);

    try{

      const img=await new Promise((resolve,reject)=>{

        const image=new Image();

        image.onload=()=>resolve(image);
        image.onerror=reject;

        image.src=url;
      });

      const canvas=document.createElement("canvas");

      canvas.width=img.naturalWidth;
      canvas.height=img.naturalHeight;

      canvas.getContext("2d").drawImage(img,0,0);

      return resizeCanvas(canvas,2200);

    }finally{

      URL.revokeObjectURL(url);
    }
  }
}

function resizeCanvas(canvas,max){

  const biggest=Math.max(
    canvas.width,
    canvas.height
  );

  if(biggest<=max)
    return canvas;

  const scale=max/biggest;

  const out=document.createElement("canvas");

  out.width=Math.round(canvas.width*scale);
  out.height=Math.round(canvas.height*scale);

  out.getContext("2d").drawImage(
    canvas,
    0,
    0,
    out.width,
    out.height
  );

  return out;
}

function canvasBlob(canvas,quality=.9){

  return new Promise((resolve,reject)=>{

    canvas.toBlob(
      blob=>blob?resolve(blob):reject(new Error("Imagem inválida")),
      "image/jpeg",
      quality
    );
  });
}

function canvasDataURL(canvas,quality=.92){

  return canvas.toDataURL(
    "image/jpeg",
    quality
  );
}

/* =========================================================
   OPENCV
========================================================= */

function waitForOpenCV(timeout=12000){

  return new Promise(resolve=>{

    const start=Date.now();

    const check=()=>{

      if(
        window.cv &&
        typeof cv.Mat==="function"
      ){
        resolve(true);
        return;
      }

      if(Date.now()-start>timeout){
        resolve(false);
        return;
      }

      setTimeout(check,100);
    };

    check();
  });
}

/*
  Encontra o maior quadrilátero claro/escuro
  que provavelmente corresponde ao documento.
*/

function detectDocumentCorners(canvas){

  if(!window.cv || !cv.Mat)
    return null;

  let src=null;
  let gray=null;
  let blur=null;
  let edges=null;
  let contours=null;
  let hierarchy=null;

  try{

    src=cv.imread(canvas);

    gray=new cv.Mat();
    blur=new cv.Mat();
    edges=new cv.Mat();
    contours=new cv.MatVector();
    hierarchy=new cv.Mat();

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );

    cv.GaussianBlur(
      gray,
      blur,
      new cv.Size(5,5),
      0,
      0,
      cv.BORDER_DEFAULT
    );

    cv.Canny(
      blur,
      edges,
      60,
      180
    );

    cv.findContours(
      edges,
      contours,
      hierarchy,
      cv.RETR_LIST,
      cv.CHAIN_APPROX_SIMPLE
    );

    let best=null;
    let bestArea=0;

    const imageArea=canvas.width*canvas.height;

    for(let i=0;i<contours.size();i++){

      const contour=contours.get(i);

      const peri=cv.arcLength(
        contour,
        true
      );

      const approx=new cv.Mat();

      cv.approxPolyDP(
        contour,
        approx,
        .02*peri,
        true
      );

      if(approx.rows===4){

        const area=Math.abs(
          cv.contourArea(approx)
        );

        /*
          Ignora quadrados demasiado pequenos
          e a moldura inteira da fotografia.
        */

        if(
          area>imageArea*.08 &&
          area<imageArea*.97 &&
          area>bestArea
        ){

          const points=[];

          for(let j=0;j<4;j++){

            points.push({
              x:approx.intAt(j,0),
              y:approx.intAt(j,1)
            });
          }

          best=points;
          bestArea=area;
        }
      }

      approx.delete();
      contour.delete();
    }

    return best;

  }catch(err){

    console.warn("OpenCV:",err);
    return null;

  }finally{

    [src,gray,blur,edges,contours,hierarchy]
      .forEach(x=>{

        try{
          if(x) x.delete();
        }catch{}
      });
  }
}

/* =========================================================
   GEOMETRIA / PERSPECTIVA
========================================================= */

function distance(a,b){

  return Math.hypot(
    b.x-a.x,
    b.y-a.y
  );
}

function orderCorners(points){

  const sums=points.map(p=>p.x+p.y);
  const diffs=points.map(p=>p.x-p.y);

  const tl=points[sums.indexOf(Math.min(...sums))];
  const br=points[sums.indexOf(Math.max(...sums))];
  const tr=points[diffs.indexOf(Math.max(...diffs))];
  const bl=points[diffs.indexOf(Math.min(...diffs))];

  return [tl,tr,br,bl];
}

function perspectiveCrop(canvas,corners){

  const p=orderCorners(corners);

  const [tl,tr,br,bl]=p;

  const top=distance(tl,tr);
  const bottom=distance(bl,br);
  const left=distance(tl,bl);
  const right=distance(tr,br);

  let width=Math.round(
    Math.max(top,bottom)
  );

  let height=Math.round(
    Math.max(left,right)
  );

  /*
    Limita resolução para não gastar memória
    excessivamente no telemóvel.
  */

  const maxSide=2400;

  const scale=Math.min(
    1,
    maxSide/Math.max(width,height)
  );

  width=Math.max(1,Math.round(width*scale));
  height=Math.max(1,Math.round(height*scale));

  const src=cv.imread(canvas);

  const dst=new cv.Mat();

  const srcTri=cv.matFromArray(
    4,
    1,
    cv.CV_32FC2,
    [
      tl.x,tl.y,
      tr.x,tr.y,
      br.x,br.y,
      bl.x,bl.y
    ]
  );

  const dstTri=cv.matFromArray(
    4,
    1,
    cv.CV_32FC2,
    [
      0,0,
      width-1,0,
      width-1,height-1,
      0,height-1
    ]
  );

  const M=cv.getPerspectiveTransform(
    srcTri,
    dstTri
  );

  cv.warpPerspective(
    src,
    dst,
    M,
    new cv.Size(width,height),
    cv.INTER_LINEAR,
    cv.BORDER_CONSTANT,
    new cv.Scalar(255,255,255,255)
  );

  const output=document.createElement("canvas");

  output.width=width;
  output.height=height;

  cv.imshow(
    output,
    dst
  );

  src.delete();
  dst.delete();
  srcTri.delete();
  dstTri.delete();
  M.delete();

  return output;
}

/*
  Fallback caso o OpenCV não encontre a folha.
  Usa o conteúdo útil da fotografia e remove
  pequenas margens.
*/

function fallbackCrop(canvas){

  const ctx=canvas.getContext(
    "2d",
    {willReadFrequently:true}
  );

  const w=canvas.width;
  const h=canvas.height;

  const data=ctx.getImageData(
    0,0,w,h
  ).data;

  /*
    Amostra o brilho nas bordas.
    Isto ajuda quando o documento está sobre
    uma mesa escura.
  */

  function rowBrightness(y){

    let total=0;

    for(let x=0;x<w;x+=8){

      const i=(y*w+x)*4;

      total += (
        data[i]+
        data[i+1]+
        data[i+2]
      )/3;
    }

    return total/(Math.ceil(w/8));
  }

  function colBrightness(x){

    let total=0;

    for(let y=0;y<h;y+=8){

      const i=(y*w+x)*4;

      total += (
        data[i]+
        data[i+1]+
        data[i+2]
      )/3;
    }

    return total/(Math.ceil(h/8));
  }

  const top=rowBrightness(3);
  const bottom=rowBrightness(h-4);
  const left=colBrightness(3);
  const right=colBrightness(w-4);

  let x=0;
  let y=0;
  let cw=w;
  let ch=h;

  /*
    Só corta se houver indícios de que
    a fotografia tem margens exteriores.
  */

  if(
    top<80 &&
    bottom<80 &&
    left<80 &&
    right<80
  ){

    const margin=Math.round(
      Math.min(w,h)*.025
    );

    x=margin;
    y=margin;
    cw=w-margin*2;
    ch=h-margin*2;
  }

  const out=document.createElement("canvas");

  out.width=cw;
  out.height=ch;

  out.getContext("2d").drawImage(
    canvas,
    x,y,cw,ch,
    0,0,cw,ch
  );

  return out;
}

/* =========================================================
   DIGITALIZAÇÃO
========================================================= */

async function scanDocument(sourceCanvas){

  /*
    Primeiro tenta OpenCV.
  */

  const opencv=await waitForOpenCV();

  if(opencv){

    const corners=detectDocumentCorners(
      sourceCanvas
    );

    if(corners){

      try{

        return {
          canvas:perspectiveCrop(
            sourceCanvas,
            corners
          ),
          detected:true
        };

      }catch(err){

        console.warn(err);
      }
    }
  }

  /*
    Fallback.
  */

  return {
    canvas:fallbackCrop(sourceCanvas),
    detected:false
  };
}

/* =========================================================
   MELHORAMENTO PARA OCR
========================================================= */

function prepareOCR(canvas){

  const scale=Math.min(
    1.5,
    1800/Math.max(canvas.width,canvas.height)
  );

  const w=Math.round(canvas.width*scale);
  const h=Math.round(canvas.height*scale);

  const out=document.createElement("canvas");

  out.width=w;
  out.height=h;

  const ctx=out.getContext("2d");

  ctx.drawImage(
    canvas,
    0,
    0,
    w,
    h
  );

  const image=ctx.getImageData(
    0,
    0,
    w,
    h
  );

  const d=image.data;

  for(let i=0;i<d.length;i+=4){

    const r=d[i];
    const g=d[i+1];
    const b=d[i+2];

    /*
      Conversão para cinzento.
    */

    let gray=
      .299*r+
      .587*g+
      .114*b;

    /*
      Aumenta contraste.
    */

    gray=(gray-128)*1.45+128;

    gray=Math.max(
      0,
      Math.min(255,gray)
    );

    d[i]=gray;
    d[i+1]=gray;
    d[i+2]=gray;
  }

  ctx.putImageData(
    image,
    0,
    0
  );

  return out;
}

let ocrWorker=null;
let ocrBusy=false;

async function getOCRWorker(){

  if(ocrWorker)
    return ocrWorker;

  if(!window.Tesseract)
    throw new Error(
      "Tesseract não carregou."
    );

  ocrWorker=await Tesseract.createWorker(
    "por",
    1,
    {
      logger:m=>{

        if(m.status==="recognizing text"){

          const pct=Math.round(
            (m.progress||0)*100
          );

          updateStatus(
            `A ler a fatura… ${pct}%`
          );
        }
      }
    }
  );

  return ocrWorker;
}

async function openCamera(){

  if(!navigator.mediaDevices?.getUserMedia){

    cameraFile.click();
    return;
  }

  let stream;

  try{

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:2560},
        height:{ideal:1920}
      }
    });

  }catch{

    cameraFile.click();
    return;
  }

  nav.classList.add("hidden");
  fab.classList.add("hidden");

  const wrap=el(
    "div",
    {class:"camera"}
  );

  const video=el(
    "video",
    {
      autoplay:"true",
      playsinline:"true",
      muted:"true"
    }
  );

  video.srcObject=stream;

  const bar=el(
    "div",
    {class:"camera-bar"}
  );

  const close=el(
    "button",
    {class:"camera-action",type:"button"},
    "Fechar"
  );

  const shutter=el(
    "button",
    {
      class:"shutter",
      type:"button",
      "aria-label":"Fotografar"
    }
  );

  const gallery=el(
    "button",
    {class:"camera-action",type:"button"},
    "Galeria"
  );

  bar.append(
    close,
    shutter,
    gallery
  );

  wrap.append(
    video,
    bar
  );

  document.body.append(wrap);

  await video.play().catch(()=>{});

  function closeCamera(){

    stream.getTracks().forEach(
      t=>t.stop()
    );

    wrap.remove();

    nav.classList.remove("hidden");
  }

  close.onclick=closeCamera;

  gallery.onclick=()=>{
    closeCamera();
    galleryFile.click();
  };

  shutter.onclick=async()=>{

    if(!video.videoWidth)
      return;

    const canvas=document.createElement(
      "canvas"
    );

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    canvas.getContext("2d").drawImage(
      video,
      0,
      0
    );

    closeCamera();

    await startScan(
      resizeCanvas(canvas,2200)
    );
  };
}

    state.scanned=fallbackCrop(canvas);
    state.detected=false;
  }

  overlay.remove();

  renderReview();

  runOCR();
}

/* =========================================================
   OCR
========================================================= */

function updateStatus(text){

  const s=$("#ocrStatus");

  if(s)
    s.textContent=text;
}

async function runOCR(){

  if(!state.scanned || ocrBusy)
    return;

  ocrBusy=true;

  try{

    updateStatus(
      "A preparar a imagem para leitura…"
    );

    state.ocrImage=prepareOCR(
      state.scanned
    );

    const worker=await getOCRWorker();

    const blob=await canvasBlob(
      state.ocrImage,
      .95
    );

    updateStatus(
      "A ler a fatura…"
    );

    const result=await worker.recognize(
      blob
    );

    const text=result.data.text||"";

    const ocr=$("#ocrText");

    if(ocr)
      ocr.value=text.trim();

    /*
      Extrair dados
    */

    const supplier=parseSupplier(text);
    const nif=parseNIF(text);
    const date=parseDate(text);
    const total=parseTotal(text);
    const vat=parseVAT(text);
    const doc=parseDocumentNumber(text);
    const category=categoryFromText(text);

    if(supplier)
      $("#supplier").value=supplier;

    if(nif)
      $("#nif").value=nif;

    if(date)
      $("#date").value=date.iso;

    if(total!==null)
      $("#total").value=
        total.toLocaleString(
          "pt-PT",
          {
            minimumFractionDigits:2,
            maximumFractionDigits:2
          }
        );

    if(vat!==null)
      $("#vat").value=
        vat.toLocaleString(
          "pt-PT",
          {
            minimumFractionDigits:2,
            maximumFractionDigits:2
          }
        );

    if(doc)
      $("#docNumber").value=doc;

    if(category!=="Outros")
      $("#category").value=category;

    renderBadges({
      supplier,
      nif,
      date,
      total,
      vat,
      doc,
      category
    });

    updateStatus(
      "Leitura concluída. Confirma os campos antes de guardar."
    );

  }catch(err){

    console.error(err);

    updateStatus(
      "O OCR não conseguiu ler todos os dados. Podes corrigi-los manualmente."
    );

  }finally{

    ocrBusy=false;
  }
}

function renderBadges(data){

  const box=$("#badges");

  if(!box)
    return;

  box.innerHTML="";

  function badge(text,ok){

    const b=el(
      "span",
      {
        class:"badge "+(ok?"ok":"warn")
      },
      text
    );

    box.append(b);
  }

  badge(
    data.supplier
      ? "Fornecedor ✓"
      : "Fornecedor por confirmar",
    !!data.supplier
  );

  badge(
    data.nif
      ? "NIF ✓"
      : "NIF por confirmar",
    !!data.nif
  );

  badge(
    data.date
      ? "Data ✓"
      : "Data por confirmar",
    !!data.date
  );

  badge(
    data.total!==null
      ? "Total ✓"
      : "Total por confirmar",
    data.total!==null
  );

  if(data.vat!==null)
    badge("IVA ✓",true);
}

   GUARDAR
========================================================= */

async function saveCurrentDocument(){

  const total=parseMoney(
    $("#total").value
  );

  const vat=parseMoney(
    $("#vat").value
  );

  const date=$("#date").value;

  if(
    $("#total").value.trim() &&
    total===null
  ){

    updateStatus(
      "O total não é válido."
    );

    return;
  }

  if(
    $("#vat").value.trim() &&
    vat===null
  ){

    updateStatus(
      "O IVA não é válido."
    );

    return;
  }

  const nif=$("#nif")
    .value
    .replace(/\D/g,"");

  if(
    nif &&
    nif.length===9 &&
    !nifValid(nif)
  ){

    if(!confirm(
      "O NIF introduzido não passa a validação. Guardar mesmo assim?"
    ))
      return;
  }

  if(!state.scanned)
    return;

  const docs=await getDocuments();

  const duplicate=docs.some(d=>
    d.nif &&
    d.nif===nif &&
    d.issuedDate===date &&
    d.total===total
  );

  if(
    duplicate &&
    !confirm(
      "Já existe uma fatura com o mesmo NIF, data e total. Guardar outra?"
    )
  )
    return;

  const image=await canvasBlob(
    state.scanned,
    .92
  );

  const doc={
    id:crypto.randomUUID(),

    createdAt:Date.now(),

    issuedDate:/^\d{4}-\d{2}-\d{2}$/.test(date)
      ? date
      : null,

    month:/^\d{4}-\d{2}-\d{2}$/.test(date)
      ? date.slice(0,7)
      : "sem-data",

    supplier:$("#supplier").value.trim(),

    nif,

    vat,

    total,

    category:$("#category").value,

    docNumber:$("#docNumber").value.trim(),

    vehicle:$("#vehicle").value.trim(),

    km:$("#km").value.trim(),

    project:$("#project").value.trim(),

    notes:$("#notes").value.trim(),

    ocrText:$("#ocrText")?.value || "",

    image,

    /*
      Informação útil para o PDF
    */

    scannedWidth:state.scanned.width,
    scannedHeight:state.scanned.height
  };

  try{

    await saveDocument(doc);

    state.original=null;
    state.scanned=null;

    showDocuments();

  }catch(err){

    console.error(err);

    updateStatus(
      "Não foi possível guardar a fatura."
    );
  }
}

async function showDocuments(){

  );

  let docs=[];

    docs=await getDocuments();

  }catch{

    main.append(
      el(
        "p",
        {class:"status bad"},
        "Não foi possível abrir a base de dados."
      )
    );

    return;
  }

  if(!docs.length){

    main.append(
      el(
        "section",
        {class:"card"},
        "<strong>Ainda não existem faturas.</strong><p class='status'>Digitaliza a primeira fatura para começar.</p>"
      )
    );

    return;
  }

  const search=el(
    "input",
    {
      type:"search",
      placeholder:"Procurar fornecedor, NIF ou documento"
    }
  );

  main.append(search);

  const list=el(
    "div"
  );

  main.append(list);

  async function render(){

    list.innerHTML="";

    const q=fold(search.value);

    const visible=docs.filter(d=>{

      const text=fold([
        d.supplier,
        d.nif,
        d.docNumber,
        d.category,
        d.notes
      ].join(" "));

      return !q || text.includes(q);
    });

    if(!visible.length){

      list.append(
        el(
          "p",
          {class:"status"},
          "Nenhuma fatura encontrada."
        )
      );

      return;
    }

    const groups=new Map();

    visible.forEach(d=>{

      const key=d.month||"sem-data";

      if(!groups.has(key))
        groups.set(key,[]);

      groups.get(key).push(d);
    });

    const keys=[...groups.keys()]
      .sort((a,b)=>b.localeCompare(a));

    for(const month of keys){

      const items=groups.get(month);

      let total=0;

      items.forEach(i=>{
        if(i.total!==null)
          total+=Number(i.total);
      });

      const card=el(
        "section",
        {class:"card"}
      );

      card.innerHTML=`
        <div style="
          display:flex;
          justify-content:space-between;
          align-items:end;
          margin-bottom:10px">
          <div>
            <strong>${monthLabel(month)}</strong>
            <div class="status">
              ${items.length} documento${items.length!==1?"s":""}
            </div>
          </div>
          <strong style="color:#ff394b">
            ${euros(total)}
          </strong>
        </div>
      `;

      for(const item of items){

        const article=el(
          "article",
          {class:"document-card"}
        );

        const image=document.createElement(
          "img"
        );

        image.className="document-thumb";

        image.src=URL.createObjectURL(
          item.image
        );

        const info=el(
          "div"
        );

        const date=item.issuedDate
          ? item.issuedDate
              .split("-")
              .reverse()
              .join("/")
          : "Sem data";

        info.innerHTML=`
          <div class="document-title">
            ${escapeHTML(
              item.supplier || "Fornecedor não identificado"
            )}
          </div>

          <div class="document-meta">
            ${date}<br>
            ${escapeHTML(item.category)}
            · ${euros(item.total)}
            ${item.nif
              ? `<br>NIF ${escapeHTML(item.nif)}`
              : ""}
          </div>
        `;

        const buttons=el(
          "div",
          {class:"row"}
        );

        const edit=el(
          "button",
          {
            class:"btn secondary small",
            type:"button"
          },
          "Corrigir"
        );

        const del=el(
          "button",
          {
            class:"btn danger small",
            type:"button"
          },
          "Apagar"
        );

        edit.onclick=()=>editDocument(item);

        del.onclick=async()=>{

          if(
            !confirm(
              "Apagar esta fatura?"
            )
          )
            return;

          await deleteDocument(
            item.id
          );

          showDocuments();
        };

        buttons.append(
          edit,
          del
        );

        info.append(buttons);

        article.append(
          image,
          info
        );

        card.append(article);
      }

      list.append(card);
    }
  }

  search.oninput=render;

  render();
}

function monthLabel(key){

  if(key==="sem-data")
    return "Sem data";

  const names=[
    "Janeiro",
    "Fevereiro",
    "Março",
    "Abril",
    "Maio",
    "Junho",
    "Julho",
    "Agosto",
    "Setembro",
    "Outubro",
    "Novembro",
    "Dezembro"
  ];

  const [year,month]=key.split("-");

  return `${names[Number(month)-1]} ${year}`;
}

async function loadJsPDF(){

  if(window.jspdf)
    return window.jspdf.jsPDF;

  await new Promise((resolve,reject)=>{

    const script=document.createElement(
      "script"
    );

    script.src=
      "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js";

    script.onload=resolve;
    script.onerror=reject;

    document.head.append(script);
  });

  return window.jspdf.jsPDF;
}

function getImageDataURL(blob){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>resolve(
      reader.result
    );

    reader.onerror=reject;

    reader.readAsDataURL(blob);
  });
}

/*
  Esta função calcula o tamanho correto
  da digitalização dentro da célula.

  A imagem NÃO é esticada.
*/

function fitImage(
  imageWidth,
  imageHeight,
  cellWidth,
  cellHeight
){

  const ratio=Math.min(
    cellWidth/imageWidth,
    cellHeight/imageHeight
  );

  return {
    width:imageWidth*ratio,
    height:imageHeight*ratio
  };
}

async function createPDF(
  docs,
  perPage,
  copies,
  month
){

  if(!docs.length){

    alert(
      "Não existem documentos neste mês."
    );

    return;
  }

  const PDF=await loadJsPDF();

  const pdf=new PDF({
    orientation:"portrait",
    unit:"mm",
    format:"a4"
  });

  const pageWidth=
    pdf.internal.pageSize.getWidth();

  const pageHeight=
    pdf.internal.pageSize.getHeight();

  /*
    Margens pequenas para aproveitar papel.
  */

  const margin=7;

  /*
    Número total de documentos
    considerando as cópias pedidas.
  */

  const queue=[];

  for(let c=0;c<copies;c++){

    for(const doc of docs)
      queue.push(doc);
  }

  /*
    1 por página:
    documento grande.

    2 por página:
    divisão vertical.

    4 por página:
    grelha 2x2.
  */

  let columns=1;
  let rows=1;

  if(perPage===2){
    columns=1;
    rows=2;
  }

  if(perPage===4){
    columns=2;
    rows=2;
  }

  const cellWidth=
    (pageWidth-margin*2)/columns;

  const cellHeight=
    (pageHeight-margin*2)/rows;

  for(let i=0;i<queue.length;i++){

    if(i>0)
      pdf.addPage();

    const doc=queue[i];

    const data=await getImageDataURL(
      doc.image
    );

    /*
      Criar uma imagem temporária
      para saber as dimensões reais.
    */

    const img=await loadImage
