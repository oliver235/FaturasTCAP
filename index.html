<!doctype html>
<html lang="pt-PT">
<head>

<title>TOYOTA — Gestão documental</title>
<style>

html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Arial,sans-serif}

.hidden{display:none!important}

input,select,textarea{width:100%;background:#0d0e11;border:1px solid var(--line);border-radius:14px;min-height:48px;padding:12px 13px;outline:0}input:focus,select:focus,textarea:focus{border-color:#e4001b99;box-shadow:0 0 0 3px #e4001b1f}label{display:flex;flex-direction:column;gap:6px;margin:12px 0;color:#aaaab0;font-size:12px;font-weight:800}textarea{min-height:90px;resize:vertical}

.document-card{border-top:1px solid var(--line);padding:13px 0;display:grid;grid-template-columns:76px 1fr;gap:11px}.document-card:first-child{border-top:0}.document-thumb{width:76px;height:100px;border-radius:10px;background:#050505;object-fit:contain}.document-title{font-weight:800;margin-bottom:4px}.document-meta{color:var(--muted);font-size:12px;line-height:1.45}.month-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}

.camera{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}.camera video{flex:1;width:100%;height:100%;object-fit:cover}.camera-guide{position:absolute;inset:11% 8% 20%;border:2px solid #fff8;border-radius:18px;box-shadow:0 0 0 9999px #00035;pointer-events:none}.camera-guide:after{content:"Alinha as quatro margens da fatura dentro da moldura";position:absolute;left:0;right:0;bottom:-38px;text-align:center;color:#fffC;font-size:12px;font-weight:700}.camera-bar{display:flex;align-items:center;justify-content:space-between;padding:13px 18px calc(14px + var(--safe));background:#050505}.camera-action{color:#fff;font-weight:800;min-width:70px;background:none}.shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:6px solid #555}
.processing{position:fixed;inset:0;z-index:110;background:#07080af8;display:grid;place-items:center;padding:20px}.processing-box{width:min(480px,100%);background:#15161a;border:1px solid var(--line);border-radius:26px;padding:18px}.processing-preview{height:260px;background:#000;border-radius:18px;display:grid;place-items:center;overflow:hidden}.processing-preview img{max-width:100%;max-height:100%;object-fit:contain}.scanline{position:absolute;left:0;right:0;height:2px;background:var(--red);box-shadow:0 0 18px var(--red);animation:scan 1.35s ease-in-out infinite}@keyframes scan{0%{top:8%}50%{top:90%}100%{top:8%}}

.crop-editor{position:fixed;inset:0;z-index:120;background:#060709;display:flex;flex-direction:column;padding:12px 12px calc(12px + var(--safe))}.crop-head{display:flex;justify-content:space-between;align-items:center;padding:5px 2px 12px;gap:10px}.crop-stage{position:relative;flex:1;min-height:0;background:#000;border-radius:18px;overflow:hidden}.crop-media{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(100% - 16px);max-height:calc(100% - 16px)}.crop-media img,.crop-media canvas,.crop-svg{position:absolute;inset:0;width:100%;height:100%;display:block}.crop-media img,.crop-media canvas{object-fit:fill;user-select:none;-webkit-user-select:none;pointer-events:none}.crop-svg{overflow:visible;touch-action:none;z-index:20}.crop-svg circle{filter:drop-shadow(0 2px 8px #000);pointer-events:all;cursor:grab}.crop-svg circle:active{cursor:grabbing}.crop-magnifier{position:absolute;width:150px;height:150px;border-radius:50%;border:4px solid #fff;box-shadow:0 8px 30px rgba(0,0,0,.65),0 0 0 3px #e4001b;z-index:40;display:none;pointer-events:none;background:#000}.crop-magnifier canvas{width:100%;height:100%;border-radius:50%;display:block}.crop-actions{display:flex;gap:8px;padding-top:10px}.crop-actions button{flex:1;min-height:50px}
.export-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.export-options button{padding:12px 5px;background:#202126;border:1px solid var(--line);border-radius:13px;color:#ccc;font-weight:800}.export-options button.active{color:#fff;background:#3a1116;border-color:#e4001b99}
.mode-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.mode-tabs button{background:#202126;border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:11px;font-weight:800}.mode-tabs button.active{background:#3a1116;border-color:#e4001b88}
.small-note{font-size:11px;color:#777980}.empty{padding:24px 6px;text-align:center;color:var(--muted)}
@media(min-width:700px){.main{padding-top:34px}.cta{max-width:720px}.preview img,.preview canvas{max-height:760px}}
</style>

<body>
<div id="app" class="app"><main id="main" class="main"></main>
<button id="fab" class="fab" type="button" aria-label="Nova fatura">+</button>
<nav id="nav" class="bottom-nav">
<button data-tab="home">Início</button><button data-tab="docs">Documentos</button><button data-tab="stats">Análise</button><button data-tab="export">Exportar</button>
</nav></div>
<input id="cameraFile" class="hidden" type="file" accept="image/*" capture="environment">
<input id="galleryFile" class="hidden" type="file" accept="image/*">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script async src="https://docs.opencv.org/4.10.0/opencv.js"></script>
<script>
"use strict";

/* =========================================================
   CONFIGURAÇÃO
========================================================= */
const APP_NAME="Faturas TOYOTA";
const AUTHOR="Desenvolvido por José Sousa";
const DB_NAME="toyota-faturas-db";
const DB_VERSION=4;
const MAX_IMAGE_SIDE=3000;
const DETECT_SIDE=1500;
const OCR_SIDE=2600;
const CATEGORIES=["Combustível","Alimentação","Restauração","Estadias","Portagens","Material","Serviços","Outros"];
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* =========================================================
   ESTADO DA APLICAÇÃO
========================================================= */
const state={
  tab:"home",
  processing:false,
  original:null,
  scanned:null,
  ocrImage:null,
  preview:null,
  detectedPoints:null,
  mode:"scan",
  ocrWorker:null,
  ocrBusy:false
};

/* =========================================================
   DOM / SEGURANÇA
========================================================= */
function el(tag,attrs={},...children){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") n.className=v;
    else if(k==="text") n.textContent=String(v);
    else if(k==="html") n.innerHTML=String(v);
    else if(v!==undefined && v!==null) n.setAttribute(k,String(v));
  }
  for(const child of children.flat(Infinity)){
    if(child===null||child===undefined||child===false)continue;
    n.append(child instanceof Node?child:document.createTextNode(String(child)));
  }
  return n;
}
function fold(s){return String(s??"").normalize("NFD").replace(/\p{M}/gu,"").toLowerCase().replace(/\s+/g," ").trim()}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v){return Number.isFinite(Number(v))?Number(v).toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €":"—"}
function parseMoney(v){
  if(v===null||v===undefined)return null;
  let s=String(v).trim().replace(/[€\s]/g,"");
  if(!s)return null;
  s=s.replace(/[^\d,.-]/g,"");
  const commas=(s.match(/,/g)||[]).length,dots=(s.match(/\./g)||[]).length;
  if(commas&&dots){ if(s.lastIndexOf(",")>s.lastIndexOf(".")) s=s.replace(/\./g,"").replace(",","."); else s=s.replace(/,/g,""); }
  else if(commas===1) s=s.replace(",",".");
  else if(commas>1) s=s.replace(/,/g,"");
  else if(dots>1) s=s.replace(/\./g,"");
  const n=Number(s);
  return Number.isFinite(n)?n:null;
}
function validDate(y,m,d){const x=new Date(Date.UTC(y,m-1,d));return y>=1990&&y<=2099&&m>=1&&m<=12&&d>=1&&x.getUTCFullYear()===y&&x.getUTCMonth()===m-1&&x.getUTCDate()===d}
function isoDate(y,m,d){return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function parseDate(text){
  const s=String(text||"");
  const found=[];
  for(const m of s.matchAll(/\b(20\d{2})[./-](\d{1,2})[./-](\d{1,2})\b/g)){const y=+m[1],mo=+m[2],d=+m[3];if(validDate(y,mo,d))found.push({iso:isoDate(y,mo,d),score:100})}
  for(const m of s.matchAll(/\b(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})\b/g)){
    let y=+m[3]; if(y<100)y+=y>=70?1900:2000; const mo=+m[2],d=+m[1];
    if(validDate(y,mo,d)){const before=fold(s.slice(Math.max(0,m.index-40),m.index));found.push({iso:isoDate(y,mo,d),score:/data|emissao|emissão|documento/.test(before)?130:60})}
  }
  found.sort((a,b)=>b.score-a.score);return found[0]||null;
}

/* =========================================================
   NIF / EXTRAÇÃO
========================================================= */
function nifValid(nif){
  const s=String(nif||"").replace(/\D/g,"");
  if(!/^\d{9}$/.test(s)||/^(\d)\1{8}$/.test(s))return false;
  let sum=0;for(let i=0;i<8;i++)sum+=+s[i]*(9-i);
  const mod=sum%11,check=mod<2?0:11-mod;return check===+s[8];
}
function parseNIF(text){
  const lines=String(text||"").split(/\n/);
  const candidates=[];
  for(const line of lines){
    const f=fold(line);
    if(/\b(adquirente|cliente|consumidor|destinatario|cliente final)\b/.test(f))continue;
    const nums=line.match(/\b\d[\d\s.-]{7,17}\d\b/g)||[];
    for(const n of nums){const clean=n.replace(/\D/g,"");if(nifValid(clean))candidates.push({n:clean,score:/\bnif\b|\bnipc\b|\bcontribuinte\b/.test(f)?100:50})}
  }
  candidates.sort((a,b)=>b.score-a.score);return candidates[0]?.n||"";
}
function numberPattern(){return "(\\d{1,3}(?:[. ]\\d{3})*(?:,\\d{1,2})|\\d+(?:[,.]\\d{1,2}))"}
function parseTotal(text){
  const raw=String(text||"").replace(/\r/g,""),lines=raw.split("\n");
  const moneyRe=/(?:(?:\d{1,3}(?:[. ]\d{3})+)|\d+)(?:[,.]\d{2})(?=\s*€|\b|$)/g;
  const totalLabel=/\b(?:t[o0]tal|t[o0]t[a4]l|valor\s+(?:a\s+pagar|pago|total)|montante\s+a\s+pagar|a\s+pagar)\b/i;
  const excluded=/\b(?:subtotal|base\s+(?:tributavel|tributável)|desconto|troco|taxa\s+iva|percentagem|percentual)\b/i;
  const explicit=[];
  const valuesIn=s=>(String(s).match(moneyRe)||[]).map(parseMoney).filter(v=>v!==null&&v>=0);

  /* Prioridade máxima: uma linha explicitamente marcada como TOTAL. */
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(!totalLabel.test(line)||excluded.test(line))continue;
    const vals=valuesIn(line);
    if(vals.length){explicit.push({value:vals[vals.length-1],score:300-i/100});continue;}
    /* OCR pode colocar TOTAL numa linha e o valor na seguinte. */
    for(let j=1;j<=2;j++){
      const next=lines[i+j]||"";
      if(!next||/\b(?:iva|vat|subtotal|desconto|troco)\b/i.test(next))continue;
      const nv=valuesIn(next);if(nv.length){explicit.push({value:nv[nv.length-1],score:285-i/100});break;}
    }
  }

  /* TOTAL e o valor podem aparecer na mesma sequência depois de OCR. */
  const compact=raw.replace(/\n+/g," ");
  const re=/\b(?:t[o0]tal|t[o0]t[a4]l)(?:\s+(?:a\s+pagar|geral|documento|fatura|factura|com\s+iva|c\s*\/\s*iva|final))?\b[^\d€]{0,70}((?:\d{1,3}(?:[. ]\d{3})+|\d+)(?:[,.]\d{2}))/gi;
  for(const m of compact.matchAll(re)){const v=parseMoney(m[1]);if(v!==null)explicit.push({value:v,score:275});}
  if(explicit.length){explicit.sort((a,b)=>b.score-a.score);return explicit[0].value;}

  /* Fallback: zona final da fatura, mas nunca uma linha identificada como IVA. */
  const fallback=[];
  lines.slice(Math.max(0,lines.length-12)).forEach((line,idx)=>{
    if(excluded.test(line)||/\b(?:iva|vat)\b/i.test(line))return;
    valuesIn(line).forEach(v=>fallback.push({value:v,score:80+idx}));
  });
  fallback.sort((a,b)=>b.score-a.score);
  return fallback[0]?.value??null;
}
function parseVAT(text){
  const lines=String(text||"").split(/\n/),found=[];
  for(const line of lines){
    if(!/\b(?:iva|vat)\b/i.test(line))continue;
    /* Ex.: IVA 23% 2,30 — extrai 2,30 e não outro total da fatura. */
    const after=line.match(/\b(?:iva|vat)\b[^\d%€]{0,20}(?:\d{1,2}(?:[,.]\d{1,2})?\s*%\s*)?((?:\d{1,3}(?:[. ]\d{3})+|\d+)(?:[,.]\d{2}))/i);
    if(after){const v=parseMoney(after[1]);if(v!==null)found.push(v);continue;}
    const vals=(line.match(/(?:\d{1,3}(?:[. ]\d{3})+|\d+)(?:[,.]\d{2})/g)||[]).map(parseMoney).filter(Number.isFinite);
    if(vals.length)found.push(vals[vals.length-1]);
  }
  return found.length?found[0]:null;
}
const KNOWN_SUPPLIERS=[["galp","Galp"],["repsol","Repsol"],["prio","PRIO"],["bp ","BP"],["cepsa","CEPSA"],["continente","Continente"],["pingo doce","Pingo Doce"],["lidl","Lidl"],["auchan","Auchan"],["mercadona","Mercadona"],["mcdonald","McDonald's"],["burger king","Burger King"],["pestana","Pestana"],["ibis","ibis"],["campanile","Campanile"],["decathlon","Decathlon"],["amazon","Amazon"]];
function parseSupplier(text){
  const f=fold(text);for(const [key,name] of KNOWN_SUPPLIERS)if(f.includes(key))return name;
  const lines=String(text||"").split(/\n/).map(x=>x.trim()).filter(Boolean);
  for(const line of lines.slice(0,15)){
    const x=fold(line);if(x.length<3||x.length>70)continue;
    if(/\bnif\b|\bnipc\b|\biva\b|\btotal\b|\bfatura\b|\bfactura\b|\bdata\b|\bwww\b|\bhttp\b|\btel\b|\btelefone\b/.test(x))continue;
    if(/^\d+$/.test(x)||/^\d+[./-]\d+/.test(x))continue;
    if((x.match(/[a-z]/g)||[]).length>=5)return line.slice(0,70);
  }
  return "";
}
function parseDocumentNumber(text){
  const patterns=[
    /\b(?:fatura|factura|invoice|recibo|tal[aã]o)\s*(?:n[ºo°.]?|nr\.?|numero|número)?\s*[:#-]?\s*([A-Z0-9][A-Z0-9./-]{2,})/i,
    /\b(?:FT|FR|FS|NC|ND)\s*[:#.-]?\s*([A-Z0-9./-]{2,})/i
  ];
  for(const re of patterns){const m=String(text||"").match(re);if(m)return m[1].slice(0,50)}
  return "";
}
function categoryFromText(text){
  const s=fold(text);
  if(/\b(galp|repsol|prio|cepsa|bp|gasolina|gasoleo|diesel|combustivel)\b/.test(s))return"Combustível";
  if(/\b(hotel|ibis|pestana|campanile|hostel|pousada|alojamento|quarto)\b/.test(s))return"Estadias";
  if(/\b(restaurante|cafe|café|pizza|burger|mcdonald|pastelaria|padaria|refeicao|refeição)\b/.test(s))return"Restauração";
  if(/\b(continente|pingo doce|lidl|auchan|mercadona|supermercado)\b/.test(s))return"Alimentação";
  if(/\b(portagem|via verde|ascendi|brisa)\b/.test(s))return"Portagens";
  if(/\b(peças|pecas|material|ferramenta|abrasivo|tinta)\b/.test(s))return"Material";
  if(/\b(serviço|servico|reparação|reparacao|manutenção|manutencao)\b/.test(s))return"Serviços";
  return"Outros";
}

/* =========================================================
   INDEXEDDB
========================================================= */
let dbPromise=null;
function openDB(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error("IndexedDB não está disponível."));return}
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains("documents"))db.createObjectStore("documents",{keyPath:"id"});
    };
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>{dbPromise=null;reject(req.error||new Error("Erro IndexedDB"))};
    req.onblocked=()=>console.warn("IndexedDB bloqueada.");
  });
  return dbPromise;
}
async function saveDocument(doc){
  const db=await openDB();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction("documents","readwrite");tx.objectStore("documents").put(doc);
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("Erro a guardar"));tx.onabort=()=>reject(tx.error||new Error("Operação abortada"));
  });
}
async function getDocuments(){
  const db=await openDB();
  return await new Promise((resolve,reject)=>{
    const tx=db.transaction("documents","readonly"),req=tx.objectStore("documents").getAll();
    req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)));
    req.onerror=()=>reject(req.error||new Error("Erro a ler documentos"));
  });
}
async function deleteDocument(id){
  const db=await openDB();
  return await new Promise((resolve,reject)=>{

function enhanceScanner(source,mode="scan") {
  if(!source) return null;
  const max=OCR_SIDE;
  const c=resizeCanvas(source,max);
  const out=document.createElement("canvas");
  out.width=c.width; out.height=c.height;
  const ctx=out.getContext("2d",{alpha:false});
  if(mode==="original"){ ctx.drawImage(c,0,0); return out; }
  ctx.drawImage(c,0,0);
  const img=ctx.getImageData(0,0,out.width,out.height);
  const d=img.data;
  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];
    if(mode==="bw"){
      const y=.299*r+.587*g+.114*b;
      const v=Math.max(0,Math.min(255,(y-128)*1.45+128));
      d[i]=d[i+1]=d[i+2]=v;
    }else if(mode==="scan"){
      const y=.299*r+.587*g+.114*b;
      const v=Math.max(0,Math.min(255,(y-128)*1.18+128));
      d[i]=d[i+1]=d[i+2]=v;
    }else{
      d[i]=Math.min(255,r*1.06+3);
      d[i+1]=Math.min(255,g*1.06+3);
      d[i+2]=Math.min(255,b*1.06+3);
    }
  }
  ctx.putImageData(img,0,0);
  return out;
}

function updateStatus(message,kind="status"){
  const node=$("#ocrStatus");
  if(node){node.textContent=message;node.className=`${kind}`.trim();}
}

async function getOCRWorker(){
  if(state.ocrWorker) return state.ocrWorker;
  if(!window.Tesseract) throw new Error("Tesseract.js não carregou.");
  state.ocrWorker=await Tesseract.createWorker("por",1,{
    logger:m=>{
      const pct=typeof m.progress==="number"?Math.round(m.progress*100):null;
      if(m.status) updateStatus(pct!==null?`OCR: ${m.status} ${pct}%`:`OCR: ${m.status}`);
    }
  });
  return state.ocrWorker;
}

async function runOCR(){
  if(!state.ocrImage || state.ocrBusy) return;
  state.ocrBusy=true;
  try{
    updateStatus("A preparar OCR local…");
    const worker=await getOCRWorker();
    const result=await worker.recognize(state.ocrImage);
    const text=result?.data?.text||"";
    const supplier=parseSupplier(text);
    const nif=parseNIF(text);
    const date=parseDate(text);
    const docNumber=parseDocumentNumber(text);
    const vat=parseVAT(text);
    const total=parseTotal(text);
    if($("#ocrText")) $("#ocrText").value=text;
    if($("#supplier") && supplier) $("#supplier").value=supplier;
    if($("#nif") && nif) $("#nif").value=nif;
    if($("#date") && date) $("#date").value=date.iso;
    if($("#docNumber") && docNumber) $("#docNumber").value=docNumber;
    if($("#vat") && vat!==null) $("#vat").value=String(vat).replace(".",",");
    if($("#total") && total!==null) $("#total").value=String(total).replace(".",",");
    if($("#category")) $("#category").value=categoryFromText(text);
    const badges=$("#badges");
    if(badges){
      badges.replaceChildren();
      if(supplier) badges.append(el("span",{class:"badge ok",text:"Fornecedor ✓"}));
      if(nif) badges.append(el("span",{class:"badge ok",text:"NIF ✓"}));
      if(date) badges.append(el("span",{class:"badge ok",text:"Data ✓"}));
      if(total!==null) badges.append(el("span",{class:"badge ok",text:"Total ✓"}));
      if(!supplier&&!nif&&!date&&total===null) badges.append(el("span",{class:"badge warn",text:"Confirma os dados manualmente"}));
    }
    updateStatus(text?"OCR concluído. Confirma os campos antes de guardar.":"OCR não encontrou texto. Preenche os campos manualmente.");
  }catch(e){
    console.error("OCR:",e);
    updateStatus("OCR indisponível. Podes preencher os campos manualmente.","status warning");
  }finally{
    state.ocrBusy=false;
  }
}

async function processImage(sourceCanvas,pointsOverride=null){
  if(pointsOverride){
    try{
      return {canvas:perspectiveCrop(sourceCanvas,pointsOverride),points:pointsOverride,confidence:1,detected:true};
    }catch(e){

    }
  }
  try{
    const detected=await detectDocumentCorners(sourceCanvas);
    if(detected&&detected.points){
      try{return {canvas:perspectiveCrop(sourceCanvas,detected.points),points:detected.points,confidence:detected.confidence,detected:true}}
      catch(e){console.warn(e)}
    }
  }catch(e){console.warn("Deteção automática indisponível:",e)}
  return {canvas:fallbackCrop(sourceCanvas),points:null,confidence:0,detected:false};
}

      queue.splice(0,best.group.length);usedH+=best.h+gap;
      if(usedH>=usableH-gap)break;
    }
    if(!page.length){const d=queue.shift();page.push({doc:d,x:margin,y:margin,w:usableW,h:usableH})}
    pages.push(page);
  }
  return pages;
}
async function blobToDataURL(blob){
  if(!blob) throw new Error("Imagem não encontrada.");
  return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("Não foi possível ler a imagem."));r.readAsDataURL(blob)});
}
async function imageSizeFromBlob(blob){
  const url=URL.createObjectURL(blob);
  try{const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error("Imagem inválida."));i.src=url});return {w:img.naturalWidth||img.width,h:img.naturalHeight||img.height}}
  finally{URL.revokeObjectURL(url)}
}
async function createPDF(docs,copies,month){
  if(!docs.length){alert("Não existem documentos neste mês.");return}
  const PDF=await loadJsPDF();
  const pdf=new PDF({orientation:"portrait",unit:"mm",format:"a4",compress:true});
  const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),margin=6,gap=3;
  const prepared=[];
  for(const d of docs){
    try{
      const size=await imageSizeFromBlob(d.image);
      prepared.push({...d,scannedWidth:size.w,scannedHeight:size.h});
    }catch(e){console.warn("Imagem ignorada no PDF",d.id,e)}
  }
  if(!prepared.length){alert("As imagens das faturas não estão disponíveis. Abre uma fatura e confirma se a imagem aparece.");return}
  const queue=[];for(let c=0;c<copies;c++)prepared.forEach(d=>queue.push(d));
  const pages=packDocuments(queue,W,H,margin,gap);
  let first=true;
  for(const page of pages){
    if(!first)pdf.addPage();first=false;
    for(const p of page){
      try{
        const data=await blobToDataURL(p.doc.image);
        const format=/^data:image\/png/i.test(data)?"PNG":"JPEG";
        pdf.addImage(data,format,p.x,p.y,p.w,p.h,undefined,"FAST");
      }catch(e){
        console.error("Erro ao inserir imagem no PDF",e,p.doc);
        pdf.setDrawColor(180);pdf.rect(p.x,p.y,p.w,p.h);
        pdf.setFontSize(7);pdf.text("Imagem não disponível",p.x+3,p.y+6);
      }
      const label=p.doc.supplier||"Documento";
      if(p.w>55&&p.h>25){pdf.setFontSize(5);pdf.setTextColor(95);pdf.text(`${label}${p.doc.issuedDate?" · "+p.doc.issuedDate.split("-").reverse().join("/"):""}`,p.x+1,Math.min(H-margin,p.y+p.h+2))}
    }
  }
  const filename=`TOYOTA-faturas-${month||"sem-data"}.pdf`;
  try{
    pdf.save(filename);
  }catch(e){
    console.error("PDF save",e);
    const blob=pdf.output("blob"),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
}

async function showExport(){
  setTab("export");const main=$("#main");main.replaceChildren(renderHeader(),el("p",{class:"kicker",text:"Impressão e ficheiros"}),el("h1",{text:"Exportar"}));const docs=await getDocuments();if(!docs.length){main.append(el("p",{class:"empty",text:"Ainda não existem faturas para exportar."}));return}
  const months=[...new Set(docs.map(d=>d.month||"sem-data"))].sort((a,b)=>b.localeCompare(a)),ms=el("select");months.forEach(m=>ms.append(el("option",{value:m,text:monthLabel(m)})));
  const copies=el("select");for(let i=1;i<=5;i++)copies.append(el("option",{value:i,text:`${i} cópia${i>1?"s":""}`}));
  const card=el("section",{class:"card"});card.append(el("strong",{text:"PDF com as digitalizações"}),el("p",{class:"status",text:"O PDF usa as imagens digitalizadas guardadas localmente. O algoritmo tenta aproveitar cada folha A4 sem deformar os documentos."}));
  card.append(el("label",{text:"Mês"}),ms,el("label",{text:"Cópias"}),copies);
  const pdf=el("button",{class:"btn primary",type:"button",text:"Criar PDF para impressão"}),csv=el("button",{class:"btn secondary",type:"button",text:"Exportar Excel / CSV"});main.append(card,pdf,csv);
  pdf.onclick=()=>createPDF(docs.filter(d=>(d.month||"sem-data")===ms.value),Number(copies.value),ms.value);csv.onclick=()=>exportCSV(docs.filter(d=>(d.month||"sem-data")===ms.value),ms.value);
}
